name: Scrape TCGPlayer Price

on:
  workflow_dispatch:
    inputs:
      card_name:
        description: 'Exact card name to look up on TCGPlayer'
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: |
          npm install
          npm install playwright @netlify/blobs

      - name: Get installed Playwright version
        id: pw-version
        run: |
          VERSION=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium (cache miss only -- this is the slow part being cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies only (cache hit -- browser binary already present)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run TCGPlayer price scraper
        env:
          CARD_NAME: ${{ inputs.card_name }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
        run: node scrape-tcg-price.js
