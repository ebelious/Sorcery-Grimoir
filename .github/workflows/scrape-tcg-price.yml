name: Scrape TCGPlayer Prices

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours
  workflow_dispatch:          # allows manual run from GitHub Actions tab

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # queue instead of overlapping -- a run already in progress finishes before the next trigger starts

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Playwright's official image (Chromium + OS deps baked in). Image tag
    # version MUST match the playwright npm version installed below.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: |
          npm install
          npm install playwright@1.62.1

      - name: Run TCGPlayer price scraper
        run: node scrape-tcg-prices.js

      - name: Commit tcg-prices.json if changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tcg-prices.json
          git diff --staged --quiet || git commit -m "chore: update tcg-prices.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git checkout -- .
            git pull --rebase origin main
            sleep 3
          done
