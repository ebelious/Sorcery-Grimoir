name: Scrape TCGPlayer Prices

on:
  schedule:
    - cron: '0 */12 * * *'   # every 2 hours
  workflow_dispatch:          # allows manual run from GitHub Actions tab

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # queue instead of overlapping -- a run already in progress finishes before the next trigger starts

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Running inside Playwright's own official image instead of installing
    # Chromium + OS dependencies on a bare runner. That install step
    # (`playwright install --with-deps` / `install-deps`) does a full
    # `apt-get update` + installs dozens of system libraries every run --
    # documented by the Playwright team as commonly taking minutes, and a
    # frequent source of flakiness when Ubuntu's package mirrors are slow
    # (see https://github.com/microsoft/playwright/issues/23388, where the
    # Playwright team's own conclusion was "avoid apt installs, use a
    # Docker image instead"). This image ships Chromium and every OS
    # dependency already baked in, so there's nothing left to install here
    # at all -- Docker layer caching on GitHub-hosted runners handles
    # pulling it efficiently.
    #
    # IMPORTANT: the image tag's version (v1.62.1) must exactly match the
    # `playwright` npm package version installed below. A mismatch between
    # the two is the most common cause of "browser executable doesn't
    # exist" errors with this approach -- if you bump one, bump the other
    # to match.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: |
          npm install
          npm install playwright@1.62.1

      - name: Run TCGPlayer price scraper
        run: node scrape-tcg-prices.js

      - name: Commit tcg-prices.json if changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add tcg-prices.json
          git diff --staged --quiet || git commit -m "chore: update tcg-prices.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git checkout -- .
            git pull --rebase origin main
            sleep 3
          done
