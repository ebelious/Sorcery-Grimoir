name: Scrape Discord Updates

on:
  schedule:
    - cron: '*/5 * * * *'  # runs every 30 minutes
  workflow_dispatch:          # allows manual run from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run scraper
        run: node scrape-discord.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      - name: Commit discord.json if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add discord.json
          git diff --staged --quiet || git commit -m "chore: update discord.json [skip ci]"
          git push
