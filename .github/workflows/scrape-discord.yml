name: Scrape Discord Updates

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes -- the fastest interval GitHub Actions actually supports (sub-5-minute schedules are silently ignored, even though the syntax is accepted). The scraper itself still runs twice per invocation, 30s apart, for a bit of extra freshness within each tick.
  workflow_dispatch:          # allows manual run from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run scraper (twice, 30s apart)
        run: |
          node scrape-discord.js
          sleep 30
          node scrape-discord.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit discord.json if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add discord.json
          git diff --staged --quiet || git commit -m "chore: update discord.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
            sleep 3
          done
