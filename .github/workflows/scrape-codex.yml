name: Scrape Sorcery Codex & FAQ

on:
  schedule:
    - cron: '0 6 * * *'   # runs once a day at 06:00 UTC
  workflow_dispatch:          # allows manual run from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: npm install playwright@1.62.1

      - name: Run scraper
        run: node scrape-codex.js

      - name: Commit codex.json and changelog.json if changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add codex.json changelog.json
          git diff --staged --quiet || git commit -m "chore: update codex.json and changelog.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
            sleep 3
          done
