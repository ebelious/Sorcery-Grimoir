name: Import Deck from URL

on:
  workflow_dispatch:
    inputs:
      deck_url:
        description: 'Curiosa deck URL to import'
        required: true
        type: string
      request_id:
        description: 'Client-generated ID so the app knows which result belongs to its request'
        required: false
        type: string
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Playwright image ships Chromium, so the whole browser-binary cache dance
    # from the old bare-runner version is gone -- nothing to install or cache.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install
          npm install playwright@1.62.1

      - name: Run deck scraper
        env:
          DECK_URL: ${{ inputs.deck_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: node scrape-deck.js

      - name: Commit deck-import-result.json (to a separate branch, not main -- avoids triggering a GitHub Pages rebuild)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cp deck-import-result.json /tmp/deck-import-result.json
          git checkout -- .

          if git fetch origin deck-results 2>/dev/null; then
            git checkout -B deck-results origin/deck-results
          else
            git checkout --orphan deck-results
            git rm -rf . > /dev/null 2>&1 || true
          fi

          for i in 1 2 3 4 5; do
            cp /tmp/deck-import-result.json deck-import-result.json
            git add deck-import-result.json
            if git diff --staged --quiet; then break; fi
            git commit -m "chore: deck import result [skip ci]"
            if git push origin deck-results; then break; fi
            echo "Push rejected -- resetting to latest remote and reapplying our own result ($i)..."
            git fetch origin deck-results
            git reset --hard origin/deck-results
            sleep 2
          done
