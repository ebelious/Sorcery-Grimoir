name: Import Deck from URL

on:
  workflow_dispatch:
    inputs:
      deck_url:
        description: 'Curiosa deck URL to import'
        required: true
        type: string
      request_id:
        description: 'Client-generated ID so the app knows which result belongs to its request'
        required: false
        type: string
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install

      - name: Get installed Playwright version
        id: pw-version
        run: echo "version=$(node -e \"console.log(require('./node_modules/playwright/package.json').version)\")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium (cache miss only -- this is the slow part being cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS dependencies only (cache hit -- browser binary already present)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run deck scraper
        env:
          DECK_URL: ${{ inputs.deck_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: node scrape-deck.js

      - name: Commit deck-import-result.json
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add deck-import-result.json
          git diff --staged --quiet || git commit -m "chore: deck import result [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git checkout -- .
            git pull --rebase origin main
            sleep 3
          done
