# Collectr market prices for every card in cards.json -> collectr-prices.json, committed to
# the repo and read straight by the app from GitHub Pages.
# Runs in a real browser (Playwright), as the TCGPlayer sweep does: Collectr's API refuses
# anything that is not a browser at the TLS level.

name: Scrape Collectr prices

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collectr-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape Collectr
        run: node scrape-collectr-prices.js

      - name: Commit collectr-prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collectr-prices.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update Collectr prices"
            git push
          fi
