name: Scrape Sorcery Rewards

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, matching scrape-news.yml/scrape-events.yml
  workflow_dispatch:          # allows manual run from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run scraper
        run: node scrape-rewards.js

      - name: Commit rewards.json if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add rewards.json
          git diff --staged --quiet || git commit -m "chore: update rewards.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
            sleep 3
          done
