name: Scrape Sorcery Cards

on:
  schedule:
    - cron: '0 5 * * *'   # runs once a day at 05:00 UTC
  workflow_dispatch:          # allows manual run from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Runs inside Playwright's official Docker image -- Chromium and every OS
    # dependency are baked in, so there is no slow `playwright install
    # --with-deps` apt step. The image tag version MUST match the playwright
    # npm version installed below (bump both together).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: npm install playwright@1.62.1

      - name: Run scraper
        run: node scrape-cards.js

      - name: Commit cards.json if changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add cards.json
          git diff --staged --quiet || git commit -m "chore: update cards.json [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected, pulling and retrying ($i)..."
            git pull --rebase origin main
            sleep 3
          done
