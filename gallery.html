<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorcery Grimoir Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    h1 {
      color: #c084fc;
      margin-bottom: 16px;
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .gallery-wrapper {
      display: flex;
      overflow-x: scroll;
      gap: 12px;
      padding: 16px;
      width: 100vw;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .gallery-wrapper::-webkit-scrollbar {
      height: 8px;
    }
    .gallery-wrapper::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .gallery-wrapper::-webkit-scrollbar-thumb {
      background: #7c3aed;
      border-radius: 4px;
    }

    .gallery-wrapper img {
      height: 85vh;
      width: auto;
      flex-shrink: 0;
      border-radius: 8px;
      scroll-snap-align: start;
      border: 2px solid #3b1f6e;
      object-fit: contain;
    }

    .hint {
      color: #6b7280;
      font-size: 0.8rem;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h1>Sorcery Grimoir</h1>

  <div class="gallery-wrapper">
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145633_Brave.jpg" alt="Screenshot 1" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145641_Brave.jpg" alt="Screenshot 2" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145649_Brave.jpg" alt="Screenshot 3" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145709_Brave.jpg" alt="Screenshot 4" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145742_Brave.jpg" alt="Screenshot 5" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145750_Brave.jpg" alt="Screenshot 6" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145830_Brave.jpg" alt="Screenshot 7" />
    <img src="https://raw.githubusercontent.com/ebelious/Sorcery-Grimoir/main/Screenshots/Screenshot_20260422_145839_Brave.jpg" alt="Screenshot 8" />
  </div>

  <p class="hint">← scroll horizontally →</p>

</body>
</html>
