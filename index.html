ot be changed. For example, \n[[Bedrock]] is not affected by [[Atlantean Fate]] nor [[Abundance]]. As another example, [[Monks of \nKobalsa]] cannot gain stealth (since it's an ability) or power (since it's a characteristic). Note \nthat [[Monks of Kobalsa]] can have their cost reduced (or increased) during casting while they're \nstill in hand, since abilities only apply while in the realm unless explicitly stated."},{"k":"Card","def":"Cards are the sites, spells, and avatars that are used to play a game of Sorcery. At the beginning \nof the game, all of your spell cards will be in your Spellbook, your site cards will be in your \nAtlas, and your collection will consist of cards you have selected to begin the game in that zone. \nThe only card that begins in play is the Avatar you have selected to represent you during the game. \nIf a game effect or rule references a card in the realm, it includes tokens as well."},{"k":"Card Type","def":"There are six different card types in Sorcery: Avatar Minion Artifact Aura Magic Site"},{"k":"","def":"","sub":"Multiple Simultaneous Card Types:  It is sometimes possible for cards to have multiple types. For \nexample, automatons are minions and artifacts. For more details, see characteristics and 'Cards with \nMultiple Types.'"},{"k":"Cards with Multiple Types","def":"It's possible for cards to have multiple types. For example, automatons are minions and artifacts. \nIt's also possible for cards to gain types during the game. For example, [[Enchantress]] can cause \nauras to gain the minion type for a turn. When a card has multiple types, apply the following rules \nregarding characteristics: The default size remains unchanged. If the card was already occupying \nmultiple locations (e.g. an aura) and becomes a minion (e.g. via [[Enchantress]]), it continues to \noccupy multiple locations even though minions default to a single location. For everything other \nthan size, the characteristics of a minion take precedence. For example: Artifacts can be carried, \nwhile minions cannot be carried by default. Therefore, artifact minions cannot be carried as an \nartifact would be, since we give preference to the minion rules. Note that artifact minions can be \ncarried as a minion would be carried (e.g. [[War Horse]]). Auras cannot carry artifacts. Minions can \ncarry artifacts. Therefore, Aura minions can carry artifacts, since we give preference to the minion \nrules."},{"k":"Carriable Artifact","def":"A carriable artifact is any artifact that's not a ((monument)) and not a minion (i.e. not an \n((automaton))). Carriable artifacts have additional options when being cast as a spell. See \n'((Casting Artifacts))' for more details, and '((Ownership and Control))' for details on how control \ncan change for carriable artifacts."},{"k":"Carrying Artifacts","def":"Many artifacts can be carried by units, and carried artifacts are moved along with the unit that's \ncarrying them. For example, [[Ruby Core]] can be carried by a unit. See '((Carriable Artifacts))' \nfor more details on which artifacts can be carried, and how control may change for such artifacts. \nSee the 'Pick Up' and 'Drop' basic abilities, as well as '((Casting Artifacts)),' for details on how \na unit might start or stop carrying an artifact. See '((Stealth))' for how it benefits carried \nartifacts. If an Oversized Unit is carrying an artifact, the artifact remains in a single location \nand maintains relative positioning to the Oversized Unit. See '((Oversized Units))' and \n'((Teleporting Oversized Units))' for further details. An artifact that's being carried must share \nat least one location with the unit that's carrying it. If they ever share no locations, the carried \nartifact is automatically dropped. Non-units cannot carry artifacts. If a non-unit is somehow \ncarrying an artifact, the artifact is immediately dropped. If a unit is forcefully moved, anything \nthey're carrying moves with them, e.g. [[Bury]]. If a minion leaves the realm, anything they're \ncarrying remains in the realm, e.g. [[Fey Changeling]], [[Cast into Exile]], [[Monster Hunter]]."},{"k":"Carrying Units","def":"Normally, units cannot be carried by other units, but some effects allow it, e.g. [[War Horse]]. \nSuch effects are worded 'may carry...' or 'can pick up...' or similar, but all work in the same way. \nSuch units have ))modified(( Pick Up and Drop basic abilities, as described in those codex entries. \nIf such a unit loses the ability to carry other units, the carried units are immediately dropped. A \nunit that's being carried must share at least one location with the unit that's carrying it. If they \never share no locations, the carried unit is automatically dropped. Similar to carrying artifacts, \nthe carried units are moved along with the unit that's carrying them. This is considered forced \nmovement. If a carried unit cannot enter the location, the carried unit won't move (and will be \ndropped as usual if they no longer share a location with the carrying unit). For example, if a War \nHorse tries to carry a [[Bosk Troll]] into a [[Gnome Hollows]], the War Horse can enter the Gnome \nHollows but the Troll cannot, and thus the Troll remains where it was and is automatically dropped. \nUnits that can carry other units confer Airborne, Burrowing, Submerge, and/or Voidwalk to the \ncarried units while they're carried. For example, [[Phantom Steed]] can pick up a [[Bosk Troll]] and \nthen carry the Troll into the Void. The Troll will have Voidwalk while being carried by the Phantom \nSteed, and thus be able to survive in the void. Carried units may take the Move and Attack action \nnormally (once the Storyline is empty). Therefore, even if the carrying unit ))can't Drop(( that \nturn, the carried unit could still move themselves normally. For that first step, they will have any \nmovement abilities conferred to them by being carried, which are lost as soon as they're no longer \ncarried. For example, a Bosk Troll on a Phantom Steed in the void could step from the void onto the \nsurface of an adjacent site, using the Voidwalk ability conferred to them by being carried. Once the \nTroll is on the surface of a site, it's no longer being carried by the Phantom Steed, but by that \npoint it's safely out of the void and on the surface."},{"k":"Casting Spells","def":"Spells are the main way Avatars and other Spellcasters influence the realm. You cast minions, \nartifacts, auras, and magics. You can only cast a spell during your main phase, while the storyline \nis empty. (A few cards like [[Dodge Roll]] grant a timing exception.) When you cast a spell, follow \nthis process: Choose the Spellcaster. This is often your Avatar, but it can be any Spellcaster you \ncontrol. If your Spellcaster occupies multiple locations, choose the location where they're casting \nthe spell. For example, [[River of Flame]] occupies two locations, surface and subsurface; when it \ncasts a spell, you must choose if it's casting from the surface or subsurface location. Reveal the \nspell and confirm you have the necessary threshold and mana to cast it. Note: Both players are \nresponsible for confirming that all spells are cast legally! The most common spellcasting mistake is \nhaving insufficient threshold. Make it a regular practice to check threshold on every spell that's \ncast! Choose additional details based on the type of spell. See ))below((. Once you've done those \nthree steps, you actually pay the cost to cast the spell and the card moves from where it was \n(usually your hand) and enters the storyline. It will then resolve according to the normal storyline \nrules."},{"k":"","def":"","sub":"Casting Minions:  To cast a minion spell, you must declare the minion's summoning location. By \ndefault, you must choose the surface of one of your sites. Some abilities may modify what summoning \nlocations you may choose. For example, minions with Burrowing may be summoned directly to \nunderground locations you control. The summoning location must be a legal location for that minion \nto enter at time of casting (regardless of what might happen after the spell is cast and enters the \nstoryline). For example, you could not choose [[Gnome Hollows]] as the summoning location of an \n[[Autumn Unicorn]]."},{"k":"","def":"","sub":"Casting Artifacts:  To cast an artifact spell, you must declare the artifact's conjuring location. \nBy default, you must choose the surface of one of your sites. If it's a carriable artifact, you may \nalternately choose one of your units and declare a location occupied by that unit; when the artifact \nenters the realm, it will be carried by that unit."},{"k":"","def":"","sub":"Casting Auras:  To cast an aura spell, you must declare the conjuring location(s). The aura's card \ntext will often specify conjuring details, but by default, auras occupy 2x2 areas and can be \nconjured anywhere in the realm. Auras occupy the surface of sites and the void. To represent the \naura's locations, place the card at the intersection of the squares it occupies."},{"k":"","def":"","sub":"Casting Magics:  To cast a magic spell, you must declare all targets of the magic. For example, if \nyou cast [[Arc Lightning]], you must declare the 'target nearby unit' at the moment you cast the \nmagic spell. When the magic goes on the storyline, the target will have been chosen and can't change \nlater when the magic resolves. Note that some magic spells do not use the word 'target' and instead \nuse a word like 'ally.' For example, when you cast [[Overpower]], you do not need to specify which \nally you will choose, and instead you simply select the ally when the spell is resolving from the \nstoryline. Finally, there are a few magic spells that don't target directly, and instead cause an \nally to target. In that case, you also do not need to specify targets when you cast, since you only \nneed to declare the targets that the magic itself is targeting. For example, if you cast [[Joust!]], \nyou do not need to declare the target when you cast the magic; you select the ally when the magic is \nresolving from the storyline, and then the ally (not the magic!) does the targeting at that time."},{"k":"Cemetery","def":"Your cemetery represents a record of your contest in the realm. Whenever any of your cards are \ndiscarded, destroyed, or resolved, place them face-up in your cemetery. Players may freely examine \nthe contents of any cemetery at any time, and the order of the cards in a cemetery is irrelevant. \nEach cemetery is a zone in the game."},{"k":"Characteristics","def":"Many cards have abilities that can be gained or removed during the game, but there are some \ncharacteristics that all cards possess, depending on their card type. Effects that remove or modify \nabilities will not remove or modify these characteristics, unless specifically mentioned in the \neffect."},{"k":"","def":"","sub":"Minion Characteristics:  Minions occupy a single location by default. Minions can also hold \ncarriable artifacts by default. Minions have the following characteristics: Card name Rarity Power, \nwhich may be a single number (including zero) or two numbers (split power, one for attack power and \none for defense power) Cost, which may be zero Elemental threshold, which may be none Subtype, which \nmay be none or multiple"},{"k":"","def":"","sub":"Avatar Characteristics:  Avatars occupy a single location by default. Avatars can also hold \ncarriable artifacts by default. Unless an effect specifically mentions the word 'Avatar,' Avatars by \ndefault cannot be banished, destroyed, sacrificed, disabled, silenced, or leave the realm. Avatars \nmay only enter surface locations. Avatars have the following characteristics: Card name Power, which \nis a single number (including zero) Current and max life Spellcaster ability"},{"k":"","def":"","sub":"Artifact Characteristics:  Artifacts occupy a single location by default. Artifacts have the \nfollowing characteristics: Card name Rarity Cost, which may be zero Elemental threshold, which may \nbe none Subtype, which may be none or multiple"},{"k":"","def":"","sub":"Aura Characteristics:  Auras occupy four locations in a 2x2 area on the surface or in the void by \ndefault. Auras have the following characteristics: Card name Rarity Cost, which may be zero \nElemental threshold, which may be none Subtype, which may be none or multiple"},{"k":"","def":"","sub":"Magic Characteristics:  Magics do not enter the realm by default, and go to the cemetery after being \nresolved. Magics have the following characteristics: Card name Rarity Cost, which may be zero \nElemental threshold, which may be none"},{"k":"","def":"","sub":"Site Characteristics:  Sites occupy two locations by default, surface and subsurface. Sites have the \nfollowing characteristics: Card name Rarity Cost, which defaults to zero Elemental affinity, which \nmay be none Provides 1 mana"},{"k":"Charge","def":"Keyword Ability. This minion does not suffer from summoning sickness. It can tap or be tapped to pay \nfor costs associated with an ability the same turn it is summoned."},{"k":"Closest","def":"When determining 'closest,' e.g. for [[Persecutor]], imagine the Persecutor had unlimited movement \nand then ask: Are there any Evil units in Persecutor's range of motion? If not, there is no \n'closest' Evil. If so, the 'closest' Evil is the unit that requires the fewest Persecutor steps to \nreach. (Your choice if tied.)"},{"k":"Codex","def":"The codex is a ))collection(( of terms and rules to create a fair and consistent way to enjoy \nSorcery anywhere in the world!"},{"k":"","def":"","sub":"Further Note:  Please do not mention the existence of this subcodex entry to anyone publicly. If you \nneed a hint deciphering the code ))below((, feel free to DM @Ira on Discord. Pbatenghyngvbaf ba \nqrpvcurevat guvf pbqr ohevrq jvguva gur Pbqrk! Vs lbh QZ @Ven jvgu n abgr gung lbh'ir ernq gur shyy \nPbqrk, ur jvyy njneq lbh jvgu gur Pbqrk Ernqre ebyr ba gur znva Fbeprel qvfpbeq freire. V ubcr \nlbh'ir unq sha ernqvat ehyrf! -Ven"},{"k":"Collection","def":"Your collection includes additional cards and is one of the zones in the game. You may look at your \ncollection at any time. Your opponent may only know the number of cards in your collection. The card \nback (Spell, Site, or Avatar) is hidden information while the card is in the collection. When the \ncard moves to another zone (i.e. your hand) the information about its card back becomes public. \nConstructed Format\nYour collection may contain up to 10 cards and must respect rarity limits. Limited Formats (Draft or \nSealed)\nYour collection includes all the unplayed cards in your card pool. Furthermore, whenever an effect \nspecifies a named card in your collection, you simply get one as if it were in your collection. Take \nit from outside your card pool, using a substitute if needed. For example, if you play [[Troubled \nTown]], you may gain any Townsfolk and cast it. If you play [[Release the Hounds]], you gain two \n[[Hellhounds]]. On the other hand, if you use [[Toolbox]], you must only select from your unplayed \nordinary cards, since no specific card is named by Toolbox's effect. Casual Play Your collection \nincludes every card that you own outside of the game during casual play."},{"k":"Conjure","def":"Conjure means 'enter the realm,' for artifacts and auras. See the 'summon' codex entry for details. \nConjure and summon are analogous."},{"k":"Copy","def":"When a card enters the realm as a copy, e.g. [[Mirror Realm]] or [[Selfsame Simulacrum]], its \ncharacteristics and abilities match the copied card. If the copying card (e.g. Selfsame Simulacrum) \nleaves the realm, it reverts to its printed characteristics and abilities. When you create a copy, \ne.g. an artifact via [[Replication]] or a magic via [[Archimago]] or [[Orb of Ba'al Berith]], the \ncharacteristics and abilities match those printed on the copied card, and the copy is a token. For \nexample, in the case of a copied magic, it will be banished as soon as it resolves from the \nstoryline, per the normal token rules."},{"k":"Corner","def":"The corners of the realm are squares 1, 5, 16, and 20."},{"k":"Cost","def":"Cost is the amount of mana required to cast a spell. Cost can be modified by various effects, e.g. \n[[Hamlet]]. Cost cannot be negative. Sites have a default cost of zero. When determining the mana \ncost of a spell with an X value (e.g. [[Assorted Animals]]), X is the actual cost while the spell is \non the storyline, and otherwise X is zero. To calculate the total cost of a spell or ability: Start \nwith the mana cost or activation cost. For example, (3) for [[Bury]], or (5) if casting via [[De \nVermis Mysteriis]]. Include any additional costs. For example, discarding a site for [[Craterize]]. \nAdd anything that increases cost. For example, (2) for [[Maddening Bells]]. Subtract anything that \nreduces cost. For example, (1) less for [[Philosopher's Stone]]. Note that if you cast the spell \n'for free' or 'for (0),' you do not pay any additional costs at all! For example, [[Deathspeaker]] \non Death's Door near a [[Maddening Bells]] will still pay (0) to use the Deathspeaker's ability. See \n((For Free)) in the Codex for more details."},{"k":"Damage","def":"Cards take damage from fighting and from the effects of spells and abilities. Damage dealt to \nminions accumulates until the end phase, at which time it is healed. Whenever a minion accumulates \ndamage equal to or greater than its power, it dies. Damage dealt to your Avatar causes you to lose \nlife (or lose the game if they were already at Death's Door). Damage dealt to a site causes the \nplayer who controls the site to lose life equal to the damage dealt. Damage modification and \nprevention are described in more detail below, and the 'attack' codex entry provides further details \nas well. In most cases, there will be zero or perhaps one damage modifier, and it will be easy to \ndetermine damage. But in complex cases, follow these steps when applying damage: Determine incoming \ndamage. Declare and immediately apply damage modification from the active player, then the \nnon-active player. Declare and immediately apply damage prevention effects from the active player, \nthen the non-active player. Note that replacement effects and prevention effects don't use the \nstoryline, which is why they are immediately applied as soon as they're declared."},{"k":"","def":"","sub":"Modifying Damage:  Damage can be modified in a variety of ways: Increase damage, e.g. Lance. Double \ndamage, e.g. [[Critical Strike]] Set damage, e.g. [[Golden Harp]] Redirect damage, e.g. [[Sir \nGawain]] Note that damage prevention effects (e.g. [[Shield Maidens]]) including damage immunity \n(e.g. [[Tufted Turtles]], [[Lava Salamander]]) are separate and apply after all damage modification \neffects. Damage prevention effects use the word 'prevent' or 'immune,' or the phrase 'takes less \ndamage.' See the Preventing Damage section below for more details. Damage modification effects, \nincluding all those listed above, are replacement effects and are all handled the same way. \nSpecifically: In the order of their choice, the active player declares and immediately resolves all \nof their damage modification effects, including from sources they own and no one controls (e.g. a \n[[Mask of Mayhem]] controlled by no one). Note that replacement effects do not use the storyline, \nand thus these effects are immediately resolved as soon as they are declared. In the order of their \nchoice, the non-active player does the same thing. Each replacement effect can only be applied at \nmost once per instance of damage. For example, if you have two Sir Gawains (perhaps via [[Selfsame \nSimulacrum]]), each [[Sir Gawain]] can redirect to themselves once, but they can't use their ability \na second time on the same instance of damage. After applying all the damage modification, proceed to \ndamage prevention."},{"k":"","def":"","sub":"Preventing Damage:  Damage prevention uses the words 'prevent' or 'immune,' or the phrase 'takes \nless damage,' and applies after all other damage modification. Examples include: Takes less damage, \ne.g. [[Shield Maidens]]. Prevent damage, e.g. [[Goswhit Helmet]], ((Ward)). Immune to damage, e.g. \n[[Lava Salamander]]. After applying all damage modification effects, then apply damage prevention \neffects in the same way: In the order of their choice, the active player declares and immediately \nresolves all of their damage prevention effects, including from sources they own and no one \ncontrols. Note that prevention effects do not use the storyline, and thus these effects are \nimmediately resolved as soon as they are declared. In the order of their choice, the non-active \nplayer does the same thing."},{"k":"Damage Grid","def":"To simplify rules text and illustrate the extent of effects over a wide area, some cards show a \ndamage grid, e.g. [[Craterize]]. Damage grids may use a bold square to indicate the center of the \ncard's effect, or a dot to show the Spellcaster's location on the grid, e.g. [[Cone of Flame]]. A \ndamage grid may be rotated and reflected, though some effects may specify otherwise. E.g. [[Flame \nWave]] may only be reflected, not rotated. A damage grid affects each unit at the shown squares and \nin the same region as the caster, though some effects may specify otherwise. E.g. [[Craterize]] \nspecifies 'above and below.'  By default, an effect with a damage grid may be oriented so that the \ngrid is partially outside the realm, as long as the source or origin square in the realm. Damage \ngrids do not inherently target sites or locations in the grid; effects will use the word 'target' if \nthey actually target a site or location."},{"k":"Dead Minion","def":"A dead minion is a minion that's in a cemetery."},{"k":"Death Blow","def":"A death blow is any damage dealt to an Avatar who is on death's door, other than on the turn they \nreached death's door. If you deal a death blow to your opponent's avatar, you win! The damage can \ncome from a strike or any effect that specifically deals damage. Note that attacking their sites \ncauses your opponent's avatar to lose life, which is different from damaging their avatar. Losing \nlife, including due to site damage, does not cause a death blow. If both Avatars suffer a death blow \nsimultaneously (perhaps by one attacking the other), the game is a draw. Alternately, many \ntournaments declare that simultaneous death blows are ignored, and the game continues."},{"k":"Death's Door","def":"As your Avatar loses life, its connection with the realm weakens. When your life is reduced to 0, \nyou don't instantly lose the game! Instead, you are at death's door. While at death's door, you can \nno longer heal or set your life to a higher number. The moment you reach 0 life, you can't die that \nturn. After that single turn, any damage dealt to your avatar is a death blow, causing you to lose \nthe game. See the 'death blow' codex entry for more details. For example, on my turn, if I attack \nyou and put you to death's door (e.g. 0 life), you cannot die for the rest of that turn. Then, on \nyour turn and beyond, any damage to your avatar will be a death blow and I would win."},{"k":"Deathrite","def":"Keyword Ability. Deathrite is keyword for a triggered ability with the text: When this card dies, \n... Do whatever is stated. Deathrite effects resolve before placing the card in its owner's \ncemetery. See the '((die))' and '((attack))' codex entries for more details on specific Deathrite \ntiming."},{"k":"Defend","def":"Defend is a basic ability that allows you to defend against your opponent's attacks. A unit must be \nuntapped to defend, and it's one of two basic abilities that you can use on your opponent's turn \n(the other is Intercept). Defend is a triggered ability with the following text: When an enemy \nattacks another unit or site in this unit's range of motion, it may tap to defend, moving to the \nattack's location and joining the fight. When an attack is occurring, there is a window to defend. \nSee the '((attack))' codex entry for further details. During that window, multiple different units \ncan defend, one at a time. When a unit moves to defend, it may use any of its movement abilities, \nsuch as Airborne, Burrowing, Movement +X, Submerge, or Voidwalk. If the original target of the \nattack was a unit, the defender's controller may decide if that unit remains in the fight, or is \nremoved. If the original target was a site, it is automatically removed. Remember, only 'attacks' \ncan be defended; attacks are only caused by the Move and Attack basic ability, or very specific card \ntext that uses the word 'attack,' e.g. [[Crave Golem]]. When a unit uses its Defend ability, it \nautomatically becomes a legal target for the attack. For example, a minion with Stealth normally \ncan't be targeted by an attack, but if it chooses to Defend, it will be a legal target (as an \nexplicit exception to the normal precedence in the Silver Rule)."},{"k":"","def":"","sub":"Movement Paths for Defending:  When a unit defends, it must declare a movement path that ends with \nit occupying the attack's location, ignoring any triggered abilities."},{"k":"","def":"","sub":"When Exactly is a Unit Allowed to Defend?:  If the unit is untapped and the attack's location is \nwithin its range of motion. See '((range of motion))' for more details."},{"k":"Defender","def":"Defender is the opposite of attacker. Any attacked unit is considered a defender, even if they \ndidn't use the Defend ability. A unit that uses the Defend ability becomes a defender, but the \noriginally attacked unit is also a 'defender' if it stays in the fight. An attack is 'undefended' \nonly if there are no defenders (i.e. attacking a site)."},{"k":"Die","def":"'Dies' is synonymous with 'destroyed' and 'killed' (and 'dispel' for auras). Whenever a minion has \ndamage on it equal to or greater than its power (or is destroyed directly by an effect), that card \nis marked for death. After it is marked, any 'kill' or Deathrite triggers resolve, and finally the \nmarked card is put into its owner's cemetery. If multiple cards are marked for death simultaneously, \nuse the normal storyline rules for simultaneous triggers, then all the marked cards are put into \ntheir owners' cemeteries simultaneously.\nOnce a card has been marked for death, nothing can remove the mark. An effect that heals a marked \ncreature or increases its power does not remove the mark. Certain replacement effects can avoid \ndeath entirely (e.g. Ward, [[Gilded Aegis]], [[Lady Iseult]]), in which case the minion was never \nmarked for death at all, because that's how replacement effects work.\nAn effect may move a marked card to a different zone (e.g. [[Fey Changeling]] on [[The Geistwood]]), \nbut that card is still considered to have died for the purposes of other effects.\nIf a Deathrite ability causes more cards to die, they are also marked for death, and their Deathrite \neffects will also trigger before any cards are placed in the cemetery. None of the cards that have \nbeen marked for death are put into their owners' cemeteries until all Deathrite effects have \nresolved.\nPlayers cannot choose to sacrifice or kill a card that is already marked for death. A card that is \nalready marked for death cannot be marked for death again, and any effect that attempts to destroy \nor sacrifice that card fails. That card still only triggers its Deathrite ability once.\nCards that are sacrificed also count as being destroyed. They are marked for death following the \nsame process outlined ))above((."},{"k":"Disabled","def":"While disabled, a minion has no abilities (including basic abilities), cannot strike or deal damage, \ncannot take steps itself, cannot shoot projectiles, and cannot be tapped to pay for costs. They also \ncannot take any action granted by another card or effect (e.g. [[Raze]], [[Trial by Water]]), though \nthey can be moved by force.\nA disabled minion may be ))moved(( forcefully as long the disabled minion does not take its own \nsteps. A disabled minion may still be tapped by effects as long as it isn't tapping to pay for \ncosts.\nDisabled is not an ability itself and is not removed by silenced effects (e.g. [[Silence]]). If a \nsite is disabled, it has no abilities and cannot provide any mana or affinity. If an artifact or \naura is disabled, it has no abilities."},{"k":"Dispel","def":"Dispel means to 'die,' for auras. See the 'die' codex entry for more details."},{"k":"Draw","def":"Drawing is the primary way of getting cards from your Spellbook or Atlas into your hand. It means to \ntake a card from one of your decks and put it into your hand, resolving anything which may trigger \nfrom 'drawing.' Effects which say to put a card into your hand (e.g. [[Common Sense]]) do not \ntrigger 'draw' effects. Whenever you are instructed to draw a 'card,' you may choose to draw a spell \nfrom your spellbook or a site from your atlas. When you are instructed to draw a 'spell,' you must \ndraw from your Spellbook, and when instructed to draw a 'site' you must draw from your Atlas. If you \nare instructed to draw multiple 'cards' by a single effect (e.g. [[Pact with the Devil]]), you must \ndeclare how many sites and how many spells you intend to draw before drawing any of them. Whenever \nyou draw multiple cards, sites, or spells, you draw them one at a time and resolve any triggers \nafter each individual card drawn (e.g. [[Chains of Prometheus]])."},{"k":"Drop","def":"Drop is a basic, activated ability with the following text: Once on your turn, if this unit hasn't \ninteracted with the realm, it may drop any number of artifacts it's carrying. Each unit can use its \nDrop ability once per turn. Since Drop is an activated ability, you can only use it during the main \nphase on your turn while nothing is on the storyline. For example, you can't use the Drop ability \nwhile in the middle of the Move and Attack ability. If the unit has the ability to carry other units \n(e.g. [[War Horse]]), then its Drop basic ability is modified from 'artifacts' to 'artifacts and/or \nunits.' See the 'Pick Up' and 'Interact' codex entries for more details."},{"k":"Earth Site","def":"An earth site is a site that provides at least one earth (E) affinity. If the site provides other \ntypes of affinity as well, it's still an earth site as long as it provides at least one earth \naffinity. In particular, note that a site could be a water site (because it provides water affinity) \nAND an earth site (because it provides earth affinity). [[Aqueduct]] is an example of a water site \nand earth site. Earth site and land site are NOT synonyms."},{"k":"Element","def":"Sorcery: Contested Realm is built around the four classical elements: Air, Earth, Fire, and Water. \nTo cast spells, you'll generally need to have elemental affinity. A spell is an air spell if it \nrequires one or more air threshold, e.g. [[Apprentice Wizard]], or has an air frame, e.g. [[Castle \nServants]]. Earth, fire, and water spells are determined in the same manner. If a spell requires \nmultiple different elemental thresholds, e.g. [[Purple Knight]], it is each of those elements. \nKnowing the element of a spell is relevant for cards like [[Lava Salamander]], which can only cast \nfire spells and takes no damage from fire spells. A site is an air site if it provides one or more \nair affinity. Earth, fire, and water sites are determined in the same manner. If a site provides \nmultiple different elemental affinities, e.g. [[Ruins]], it is each of those elements. Knowing the \nelement of a site is relevant for cards like [[Avatar of Earth]], which specifically looks for earth \nelemental affinity on sites."},{"k":"","def":"","sub":"Air:  Air is the element of knowledge and ))power((, dabbling in forces beyond mortal ))control(( to \nacquire the magical means to respond to any battlefield situation. An attunement with air grants you \nboth mobility and tactical options thanks to its ability to teleport units around the realm and to \nincrease its available spells."},{"k":"","def":"","sub":"Earth:  Earth is the element of enduring strength, defined by its focus on fielding and enhancing \nmartial forces throughout the realm. An attunement with earth grants you the ability to affect your \natlas and minions that can dominate the battle through teamwork and sheer ))fighting(( power."},{"k":"","def":"","sub":"Fire:  Fire is the element of desire and destruction, willing to do whatever it takes to secure \nvictory in the realm. An attunement with fire grants you an array of explosive spells and abilities \nthat can create bursts of speed or burn friend and foe alike in great gouts of flame."},{"k":"","def":"","sub":"Water:  Water is the element of charm and trickery, ready to adapt and disrupt the strategies of the \nenemy as it manipulates all. An attunement with water grants you a powerful homefield advantage that \nwill slowly engulf the realm and the ability to position the enemy right where you want them."},{"k":"Elemental Threshold and Affinity","def":"Elemental threshold, often shortened to simply 'threshold,' describes how much elemental affinity is \nneeded to cast most spells or use some abilities. Elemental affinity is most often provided by \nsites, but can come from other sources as well. For example, [[Arid Desert]] provides one fire \naffinity (F), denoted by the red triangle near the bottom right of the card. Similarly, [[Blacksmith \nFamily]] is a minion that provides fire affinity. There are four elemental thresholds: Air (A), e.g. \n[[Castle Servants]] Earth (E), e.g. [[Common Cottagers]] Fire (F), e.g. [[Blacksmith Family]] Water \n(W), e.g. [[Fisherman's Family]] Unlike mana, you don't spend your affinity. It is merely a \nrequirement you must meet to cast spells and use ability. For example, to cast [[Ancient Dragon]] \nwith its three fire threshold (F)(F)(F), you must have three or more fire affinity. Some spells, \noften artifacts, have no threshold requirements to cast."},{"k":"Empty Site","def":"A site is empty if it has absolutely nothing there, not even an aura."},{"k":"End Phase","def":"The end phase is the last phase during your turn. Trigger abilities that happen at the end of the \nturn. Players remove all damage from their minions in the realm. Remember that Avatars do not \nautomatically heal in the same way as damage is removed from minions; however, you can heal using \nspells and other card effects. Effects that last for your turn now end. Your turn is now over. \nAnything that triggers 'after each turn' resolves now."},{"k":"Enemy","def":"An enemy is a unit that an opponent controls, including their Avatar. Enemies are always units, \nunless otherwise specified by card text. For example, [[Fade]] uses 'enemy site,' which means 'a \nsite an opponent controls.'"},{"k":"Enter","def":"A unit 'enters' a location or site when it is summoned there, or when it moves there from somewhere \nelse. 'Somewhere else' means 'a different location' for entering locations, and it means 'a \ndifferent site' for entering sites. The method of movement doesn't matter; it can be any type of \nmovement, including the Move and Attack basic ability, effects that cause a unit to 'take a step,' \nteleportation, or other forced movement. The relevant questions are: Was it summoned there, OR Did \nit move there from somewhere else? If either of those are true, then the unit 'entered' that \nlocation or site. Further notes: If a site is placed under an existing unit, the unit did not enter \nthe site. The unit didn't move, and it wasn't just summoned, so it didn't enter. This can happen if \nRubble was replaced by a site, or it was a voidwalk minion in the void and a site was played there. \nIf a non-minion occupies a location or site and then becomes a minion without moving (e.g. \n[[Enchantress]]), the minion did not enter. The minion didn't move and wasn't just summoned. If a \nminion moves between levels of a site (e.g. surface to subsurface, or subsurface to surface), it \ndoes not enter the site, since it was already occupying the site. (It does enter the specific \nlocation of surface or subsurface.) For oversized units, they only enter a location or site if they \ndidn't previously occupy it. For example:  The [[Mountain Giant]] occupies the four left squares, \nand then takes a step to the east. It enters the two sites in the right column, but it does not \nenter the two sites in the middle column, since it already occupied those sites before the move. See \nthe '((Oversized Units))' codex entry for more details."},{"k":"Evil","def":"Any minion that is an Undead, Demon, or Monster is Evil. Various cards in the game reference Evil, \nsuch as [[Day of Judgment]]."},{"k":"Fight","def":"When units fight, they strike each other. Apply the following sequence to resolve a fight: First \nstrikes resolve (e.g. Lance, [[Albespine Pikemen]]). Resolve deathrites and 'kill' effects (and \n'successfully attack' effects if this fight was part of an attack). Place dead minions in \ncemeteries. Normal strikes happen. Resolve deathrites and 'kill' effects (and 'successfully attack' \neffects if this fight was part of an attack). Place dead minions in cemeteries. Whenever a unit is \nstriking against multiple other units (for example, if there are multiple defenders), the controller \ndecides how the strike damage is distributed. There is still only a single strike from that unit \n(though some of the struck units could be struck for zero damage)."},{"k":"Fire Site","def":"A fire site is a site that provides at least one fire (F) affinity. If the site provides other types \nof affinity as well, it's still a fire site as long as it provides at least one fire affinity."},{"k":"Fireball","def":"This refers to the actual [[Fireball]] spell! This is relevant for the [[Avatar of Fire]]."},{"k":"Flooded","def":"Keyword ability. A flooded site has a minimum of one water affinity (W). Therefore, it's a water \nsite, though it still provides other elemental affinities, if any. For example, if a [[Humble \nVillage]] was flooded, it would provide earth (E) affinity and water (W) affinity. It would be a \nwater site and an earth site. If an effect 'floods' a site (e.g. [[Geyser]]), that site gains the \nFlooded ability for the stated duration. Since Flooded is an ability, effects that remove abilities \nfrom sites will also remove Flooded."},{"k":"Fly","def":"If you fly a unit somewhere, treat the unit as if it had Airborne while crossing borders, e.g. \n[[Avatar of Air]]. Fly is synonymous with 'throw through the air,' e.g. [[Siege Giant]]. For \nexample, a unit being moved by ))Avatar(( of Air's ability will be able to cross the border of a \n[[Perilous Bridge]] or [[Great Wall]], and will not take damage from a [[Wall of Brambles]], even if \nit's disabled, silenced, or [[Sky Baron]] is in the realm. Note that this effect is specific to \ncrossing borders (and not entering sites), and therefore [[Bottomless Pit]] will still trigger for \nnon-Airborne minions moved via ))Avatar(( of Air's ability. If you fly a site somewhere, e.g. \n[[Cloud City]], treat all units occupying the site as if they had Airborne while the site moves."},{"k":"Foot Soldier Token","def":"A Foot Soldier is a token minion with 1 power. A Foot Soldier is an Ordinary Mortal and an ((earth)) \nminion. For example, [[Common Village]]."},{"k":"For Free","def":"When you cast a spell 'for free' it costs (0) mana and requires no additional costs either. 'For \nfree' is synonymous with 'for (0).' You must still meet the threshold requirements to cast the \nspell. If you cast a spell that costs X 'for free' and you can choose the value of X, e.g. [[Arcane \nBarrage]], then X must equal zero. But, if the spell itself specifies the value of X, e.g. [[Twist \nof Fate]], then X = whatever is specified by the spell."},{"k":"Forced Movement","def":"Forced movement is any movement that does not require the unit to take their own step. For example, \n[[Windblast]] is forced movement, since the moved unit doesn't step. A unit being carried by another \nunit, e.g. [[War Horse]], is also forced movement for the carried unit. Effects that use the words \ndrag, pull, or push are also forced movement, e.g. [[Unland Eel]] or [[Grapple Shot]]. Teleportation \nis forced movement. However, Teleportation effects can cross regional boundaries unless otherwise \nspecified in their text. Effects that require a unit to take a step are not forced movement. For \nexample, [[Led Astray]] is not forced movement, because the unit is taking their own step (and an \nImmobile unit wouldn't move at all). Confusingly, some lure effects on older cards use a phrase like \n'force an enemy to take a step towards,' e.g. [[Coy Nixie]]. This is still not forced movement, \nsince the unit is taking their own step, and an Immobile unit wouldn't move; 'force' in these cases \nis being used in the normal English usage. The guiding principle for forced movement is whether or \nnot the unit is taking their own step. If they aren't taking their own step, then it's forced \nmovement! Unless specified by card text, forced movement cannot cause a card to change regions \n(except for teleportation, which can change regions by default)."},{"k":"Forward","def":"'Forward' is the cardinal direction away from your starting edge. This is relevant for a few cards \nlike [[Dalcean Phalanx]]. 'Forward' is player-relative. If the control of such a card changes, the \ndirection it perceives as 'forward' will also change."},{"k":"Frog Token","def":"A Frog is a token minion with zero power. A Frog is an Ordinary Beast with 'Submerge.' A Frog is a \n((water)) minion. For example, [[Pollimorph]]."},{"k":"Fully Heal","def":"To fully heal a minion, remove all damage from it. To fully heal an Avatar, its current life becomes \nits maximum life. A 'fully heal' effect supersedes other effects that reduce healing, e.g. [[River \nof Blood]]."},{"k":"Genesis","def":"Keyword Ability. Genesis is keyword for a triggered ability with the text: When this card enters the \nrealm, ... Do whatever is stated."},{"k":"Hand","def":"Your hand contains spells and sites. There is no limit to the number of cards you may have in your \nhand, and their order is irrelevant. You may look at cards in your hand. Your opponent is allowed to \nknow the card backs (spell or site) you have in your hand. For clarity of game state, if you are \nusing card sleeves, you should use different sleeves for sites and spells. Your hand is one of the \nzones in the game."},{"k":"Healing","def":"Healing an avatar is synonymous with gaining life. Healing a minion removes damage from that minion. \nWhen 'you heal X,' you increase your life by that amount, up to your avatar's maximum life. For \nexample, [[Divine Healing]] increases your current life by 7 (to a maximum of 20 or whatever your \navatar's maximum life is). If you are at death's door, your life total can't change, so any healing \neffect will fail. Setting life doesn't count as healing (e.g. [[Twist of Fate]]). But, if you're at \ndeath's door, your life total can't change and will remain at 0."},{"k":"Here","def":"'Here' refers to the location(s) that the card occupies. For most cards, such as minions and \nartifacts, that means one location. For example, [[Fey Changeling]]. For auras, that usually means 4 \nlocations, most commonly the surface of 4 sites. For example, [[A Midsummer Night's Dream]]. Another \nexample is the use of 'here' on [[Evil Presence]], which includes the site surfaces but could also \ninclude void squares as well, if the aura occupied a void square. When a site itself uses the word \n'here,' that includes both the site's surface location and it's subsurface location. For example, \n[[Dome of Osiros]] protects minions in its subsurface as well as surface. 'Here' is analogous to \n'there.'"},{"k":"Immobile","def":"Keyword ability. An Immobile unit cannot take steps. For example, if you use the Move and Attack \nbasic ability, an Immobile unit can't take steps, though it can still attack and defend at that \nlocation. An Immobile unit couldn't take any steps with [[Leap Attack]] but it could still strike. \nForced movement effects apply normally to Immobile units, so they can [[Blink]] or [[Grapple Shot]] \nlike any other unit."},{"k":"Interact","def":"A unit 'interacts' with the realm if it does any of the following things: Strikes Casts a spell \nActivates a special ability Note that only ((activated abilities)) can be activated. Triggered \nabilities and passive abilities aren't activated. Note that a '((special ability))' is different \nfrom a '((basic ability))'. Deal damage (even if the damage is prevented) Note that 'deal damage' is \nmostly but not fully covered by the first three bullet points. 'Activates a special ability' doesn't \ninclude triggered abilities, since only activated abilities can be activated. There are some \ntriggered abilities that could deal damage, e.g. [[Infernal Legion]] or [[Colicky Dragonettes]], \nwhich are intentionally included in 'interacting.'"},{"k":"Intercept","def":"Intercept is a basic ability that allows you to fight your opponent's units who 'Move and Attack' \nwithout actually attacking. A unit must be untapped to intercept, and it's one of two basic \nabilities that you can use on your opponent's turn (the other is Defend). Intercept is a triggered \nability with the following text: When an enemy using its Move and Attack ability finishes its \nmovement and does not attack, any of your units there may tap to intercept and fight that enemy. \nUnits cannot move when they intercept; they must already be at the enemy's final location. The \ntiming for an attack and the timing for intercept are the same; if the enemy attacks, you may \ndefend. If the enemy doesn't attack, you may intercept. In summary, if both of the following are \ntrue, you can intercept: The enemy used Move and Attack, AND They chose not attack. Units with \nStealth cannot be intercepted, and units with Airborne can only be intercepted by enemies with \nAirborne or Ranged. If multiple allied units intercept the same enemy, they all fight that enemy \ntogether. Only the enemy's final location is relevant for interception. See the examples below for \nmore details."},{"k":"","def":"","sub":"Intercept as a Deterrent:   I have an [[Apprentice Wizard]] on site D. You have an untapped [[Bosk \nTroll]] on site C, and both [[Queen of Midland]] and [[Queen Guinevere]] on site B. I would love to \ncast my [[Poison Nova]] to kill all your minions, but I need to get my Apprentice Wizard to site C \nfirst. If I use the Move and Attack ability to move my Apprentice Wizard to site C and then attack, \nyour Bosk Troll will be able to defend. If I move to site C but don't attack, your Bosk Troll will \nbe able to intercept. Either way, my Apprentice Wizard would die before being able to cast the \nPoison Nova on site C. In the end, I will probably not choose to move to site C, and instead do \nsomething else. Intercept is a deterrent to certain basic movement, even if you don't actually use \nthe intercept ability during a game."},{"k":"","def":"","sub":"Intercept vs. Movement +X:   You have [[Rimland Nomads]] on site D. I have an untapped [[Bosk \nTroll]] on site C. You tap your Nomads, using the Move and Attack ability. As the ability resolves, \nyou declare the following movement path: Surface site D -> Surface site C Surface site C -> Surface \nsite A Rimland Nomads have Movement +1, so you resolve that movement normally and they're now on the \nsurface of site A, having moved past the Bosk Troll without any problem. On the surface of site A, \nthey choose not to attack. (If they did attack, my Bosk Troll could defend, killing them.) Even \nthough your Rimland Nomads didn't attack, my Bosk Troll cannot intercept since it doesn't share the \nfinal location with your Rimland Nomads."},{"k":"","def":"","sub":"The Final Location is Key:   You have a Foot Soldier token on site C. I have an untapped [[Bosk \nTroll]] on site C as well. You tap your Foot Soldier, using the Move and Attack ability. As the \nability resolves, you declare the following movement path: Surface site C -> Surface site A You \nresolve that movement normally and they're now on the surface of site A, having moved away from the \nBosk Troll without any problem. On the surface of site A, they choose not to attack. (If they did \nattack, my Bosk Troll could defend, killing them.) Even though your Foot Soldier departed a location \nshared with my Bosk Troll and then didn't attack, my Bosk Troll cannot intercept now since it \ndoesn't share the final location (surface of site A) with your Foot Soldier. Remember, the two \nthings that are relevant for intercept are: Did the enemy use the Move and Attack ability, AND Did \nthey not attack? At the moment they choose not to attack, that's the moment you can tap to \nintercept, at that location."},{"k":"","def":"","sub":"Only 'Move and Attack' can Trigger Intercept:   You have an [[Apprentice Wizard]] on site D. I have \nan untapped [[Bosk Troll]] on site C. You cast [[Blink]] to teleport your Wizard to site C. My Bosk \nTroll cannot intercept since you didn't Move and Attack. I can only intercept if you use Move and \nAttack, then don't attack."},{"k":"","def":"","sub":"Intercept Without Moving:  Units can technically tap to use their Move and Attack ability without \nmoving and without attacking since both are optional, perhaps anticipating [[Mesmerism]]. If the \nunit does not attack, you may intercept! For example, you have untapped [[Amazon Warriors]] and I \nhave an [[Autumn Unicorn]] at the same location. If I tap my [[Autumn Unicorn]] to use its Move and \nAttack basic ability, then decline to move and decline to attack, your Amazon Warriors may tap to \nIntercept."},{"k":"Its Location","def":"If minion, artifact, aura, or avatar refers to 'its location,' that means the location that it \ncurrently occupies. See the 'here' codex entry for more details."},{"k":"Its Site","def":"If minion, artifact, aura, or avatar refers to 'its site,' that means the site that it currently \noccupies. See the 'here' codex entry for more details."},{"k":"Keyword Ability","def":"A keyword is a word or phrase that functions as shorthand for a longer piece of rules text. For \nexample, Burrowing is a keyword that includes multiple related rules and abilities (e.g. can move \nbetween surface and underground locations, and can survive underground). Keywords are used to \ncommunicate concepts that require more text than what will fit on a card. You can find these longer \nexplanations in the rulebook and the Codex. If a card gains multiple copies of a keyword ability, \nusually there is no benefit. For example, a [[Plumed Pegasus]] with Airborne and [[Power of Flight]] \nsimply has Airborne. When the Power of Flight ends, the Pegasus will still have Airborne due to its \nprinted ability. Sometimes, multiple copies of a keyword do provide a benefit, such as multiple \nLance keywords, e.g. [[Thankless Squire]]."},{"k":"Kill","def":"Kill simply means destroy; they are synonyms. See 'kill credit' for more details."},{"k":"Kill Credit","def":"Some effects care about who did the killing (e.g. [[Crown of the Victor]]). Only units can get \ncredit for a kill. Determine credit for a kill when a minion dies (i.e. marked for death), in \npriority order (highest first): Did a unit just strike or deal damage with a special ability? Did a \nunit just resolve a Magic spell they cast? Did a unit just activate or trigger an ability, including \nabilities granted by artifacts? If any of the above are true, in priority order, then that unit is \nthe killer. Examples: A [[Vile Imp]] resolves its Genesis ability, dealing two damage to a minion. \nThe Imp gets credit for killing that minion under condition 1. An Avatar casts [[Bury]], forcefully \n))burrowing(( a minion so it dies underground since that minion doesn't have burrowing. The minion \ndies there and the Avatar gets kill credit under condition 2. [[Asmodeus]] breaks stealth, \nactivating his ability, and destroying a minion. He gets credit under condition 3. If a unit is \ntapped to pay for an ability (e.g. [[Payload Trebuchet]]), they count as 'activating' the artifact's \nability for purposes of kill credit. The killer must be a unit, but multiple units can share credit \nfor a kill, if they both share the same priority. For example, [[Grapple Shot]] will only give \ncredit to the ally who strikes, not the spellcaster, since priority 1 is higher. If two units defend \nagainst a single attack, both defenders could get credit for the kill. Note that passive abilities \nand other ongoing effects are not included in kill credit. Only activated and triggered abilities \nare included at priority 3."},{"k":"Lance","def":"Keyword Ability. A minion with the Lance keyword enters the realm carrying a [[Lance]] artifact \ntoken. A Lance is an Ordinary, Weapon, artifact token with the text: Bearer's next strike against \nunits deals +1 damage and strikes first, then Lance breaks.  Further notes: There's only one 'first \nstrike' window in a fight. More than one Lance confers no extra speed benefit. If a unit has \nmultiple Lances, they will each add +1 damage, and all will break after the next strike against a \nunit. Using a Lance is not optional. If a unit is carrying a Lance and strikes a unit, the Lance \nwill be used and break. If a unit carrying a Lance strikes a site, the Lance does not break and does \nnot confer additional damage. Lances are normal artifacts that can be picked up and dropped as \nusual. When they break, they are removed from the game, like all tokens. Since the Lance keyword is \nan 'enters the realm' effect, even if the minion is immediately disabled or silenced when entering \nthe realm, they will still have their Lance with them!"},{"k":"Land Site","def":"A land site is a site that provides zero water affinity. Though water sites are tied specifically to \nthe element of water, land sites can have any combination of non-water affinity, or no affinity at \nall. For example, a site that provides both fire and air affinity is a land site. A site that \nprovides no affinity is also a land site. A land site is not specifically tied to the element of \nearth. If a site provides water affinity and other types of affinity (e.g. earth), it's a water site \nand not a land site. If a site gains water affinity, then it stops being a land site. 'Land site' \nand 'water site' are mutually exclusive. A site cannot be both a water site and a land site; it will \nalways be one or the other."},{"k":"Landbound","def":"Keyword Ability. This minion is disabled while not occupying at least one land location. The \nlandbound ability persists even when disabled."},{"k":"Lasts 3 of Your Turns","def":"This terminology is used on various aura, e.g. [[Entangle Terrain]], [[Falling Star]]. To resolve \nthe effect, add a counter at the end of each of your turns, and dispel the aura when there are 3 \ncounters. If the aura is silenced during your end phase (presumably because it was animated by \n[[Enchantress]] and then silenced somehow), then no counter will be added that turn."},{"k":"Lethal","def":"Keyword Ability. Any damage a Lethal unit deals to a minion is enough to kill it. (Remember that \nzero damage isn't damage at all, so it will need to do one or more damage.) For example, [[Pit \nVipers]] can kill [[Amazon Warriors]] with a single strike for 1 damage. If the Amazon Warriors had \ntheir [[Shield Maidens]] nearby, then the Pit Vipers wouldn't actually kill the Amazon Warriors, \nbecause they'd do zero damage, which isn't actually damage at all. A spellcaster with the Lethal \nability still casts Magic spells normally; the Magic spells themselves deal the damage. For example, \na spellcaster with Lethal casts [[Firebolts]], but the damage from [[Firebolts]] is not Lethal; \nFirebolts is dealing the damage, not the spellcaster. On the other hand, the damage from [[Poison \nNova]] is Lethal, because the spell itself says it's lethal."},{"k":"Life","def":"Avatars have life. Life represents the amount of damage that your Avatar can endure before it is \nplaced on death's door. As your Avatar takes damage, its overall life decreases accordingly. An \navatar's maximum life is the value printed on their card (typically 20), and cannot exceed that \nnumber. An avatar's minimum life is zero, and cannot go below that. When an avatar reaches zero \nlife, it is on Death's Door."},{"k":"Location","def":"The smallest area in Sorcery. A location is defined by its square AND region. For example, a square \nwith a void has a single location, that particular void location. At the beginning of the game, \nthere are 20 locations in the realm, all void. A square with a site has two locations: the surface \nof the site and the subsurface of the site. Those are two different locations, even though they're \nin the same square. If the entire 5x4 realm was filled with sites, then the realm would contain 40 \nlocations (the surface and subsurface of each of the 20 sites)."},{"k":"Look At","def":"When a card instructs you to 'look at' cards in a zone, you do not reveal those cards to other \nplayers, only you look at them.  This is similar to, but distinct from, a 'search.' Whenever you \nreturn cards that you have looked at to a deck, you may put them back in any order unless the effect \nspecifies otherwise."},{"k":"Lose","def":"Some effects will cause artifacts, minions, and sites to lose certain abilities, often keywords. \n'Lose' really means 'lose, can't gain, and can't have.' These effects take precedence over competing \npassive abilities. E.g. [[Sky Baron]] wins, even if I give [[Wings of Invention]] to my minion after \nyou summoned Sky Baron. It's relevant to these cards: [[Sisters of Silence]], [[Silence]], \n[[Entangle Terrain]], [[Sky Baron]], [[Atlantean Fate]], [[Scent Hounds]], [[Hounds of Ondaros]], \n[[Master Tracker]], [[Magnetic Muzzle]], [[Smokestacks of Gnaak]], [[Watchtower]], [[Hunting \nParty]], [[Sir Bors the Younger]], [[Pebbled Paths]] See the 'Can vs. Can't' codex entry for more \ndetails."},{"k":"Magic","def":"Magics are transient spells that have an immediate impact but do not persist in the realm. [[Heat \nRay]] is an example of a magic. Magics have characteristics, specifically ((magic characteristics)), \nand are one of the six card types in the game. The '((Casting Magics))' entry has details on how to \ncast magic spells."},{"k":"Main Phase","def":"The main phase is where most of Sorcery's actions and events take place. During this phase, your \nunits can be ordered to do two types of actions. They can: Cast a spell from your hand if they are a \nSpellcaster, or Activate one of their abilities You may have your units do these as many times as \nyou have resources to do so, and in any order you like. For example, you might have one minion use \ntheir Move and Attack basic ability, then cast a spell with your Avatar, then have a minion use \ntheir Pick Up basic ability, then have a different minion use their Move and Attack ability."},{"k":"Mana","def":"Mana can come from several sources, but sites are the most common. When a mana source enters the \nrealm on your turn, and during your start phase, they generate mana. You use this mana to cast \nspells or activate abilities. At the end of your turn, any remaining mana is lost, whether or not \nyou used it that turn. You may not generate mana on your opponent's turn."},{"k":"Mana Cost","def":"Mana cost is the printed cost of the spell. See ((Cost)) for more details."},{"k":"Mandatory Actions","def":"One game rule causes a mandatory action: If your Avatar is in the void, you may and must use their \nability to play a site under them, ignoring normal site adjacency rules. Other effects may cause \nmandatory actions (e.g. [[Mask of Mayhem]] or [[The Green Knight]]). For mandatory attacks, the \nquestion of whether a unit 'can attack,' depends on their range of motion. You must resolve \nmandatory actions during your main phase before doing anything else. If you have multiple mandatory \nactions, do one of your choice, resolve it, and then continue doing mandatory actions one at a time \nuntil they are all resolved. To properly apply mandatory actions, simply ask: At this moment in my \nmain phase, can I do the mandatory action? If yes, do it now! If no, do whatever you wish. If there \nis a mandatory action that you can't legally take, you can proceed with your main phase as you wish. \nIf at any point during your main phase you become able to take a mandatory action, you must do so \nimmediately, before continuing. Example - Avatar in the Void with No Sites in Hand\nYour Avatar is in the void, so the game rules require you to play a site under your Avatar, ignoring \nnormal site adjacency rules. But, you don't have any sites in your hand, so you can't. Therefore, \nyou are free to continue your main phase as you wish. You are not required to draw a site at the \nstart of your turn, nor tap your Avatar to draw a site. But if at any point you have a site in hand \nand an untapped Avatar in the void, you must play a site under you!  Example - Mandatory Attack Your \n[[Bosk Troll]] is 2 squares away from [[The Green Knight]], The Green Knight is not within the Bosk \nTroll's range of motion, and thus you are not required to attack The Green Knight. You take actions \nin your main phase as you wish. Perhaps you cast a [[War Horse]] in the same square as the Bosk \nTroll. Then, you have the [[War Horse]] use the Pick Up basic ability, carrying the Bosk Troll. \nThen, you use the War Horse's Move and Attack basic ability, moving one square closer to The Green \nKnight. After resolving the War Horse's ability and the storyline is empty, the Bosk Troll is now \nable to attack The Green Knight. You must do so, in the middle of your main phase before doing \nanything else. You were not required to carry the Bosk Troll closer to The Green Knight. But once \nyou chose to do that, the game noticed that The Green Knight was in the Bosk Troll's range of \nmotion, and thus you were required to make the Troll's attack."},{"k":"Materials Needed to Play Sorcery","def":"A deck, a way to track life, and a fun attitude! A playmat will also help, but it's not strictly \nrequired! Your deck includes 1 avatar, a spellbook, and an atlas. Depending on the format \n(constructed vs. draft/sealed), the minimum deck size varies, so explore those codex entries for \nmore details."},{"k":"May and Can","def":"If an effect uses the word 'may' or 'can,' it is optional, e.g. [[Aramos Mercenaries]] or [[Felbog \nFrog Men]]. Exception: if the effect uses 'may only' or 'can only,' then it's actually a mandatory \nrestriction, e.g. [[Dalcean Phalanx]] or [[Morgana le Fay]]."},{"k":"Minion","def":"Minions are your greatest allies, assisting you with myriad abilities in offense and defense. \n[[Plumed Pegasus]] is an example of a minion. Minions have characteristics, specifically ((minion \ncharacteristics)), and are one of the six card types in the game. The '((Casting Minions))' entry \nhas details on how to cast minion spells."},{"k":"Move","def":"'Move' means to go from one location in the realm to a different location in the realm. There are \nmany ways for units in Sorcery to move. The most common way for a unit to move is the Move and \nAttack basic ability. Another way for a unit to move is a forced movement effect, including \nteleportation. Notably, if a unit enters a location from a different zone, e.g. summoning a minion \nfrom your hand, cemetery, or spellbook, that does not count as moving (though it is 'entering'). \nFinally, note that if a unit tries to 'move' from its current location to that same location, it's \nnot actually moving at all."},{"k":"","def":"","sub":"Moving to a Specific Location Via a Special Ability or Magic:  Some card effects specify movement to \na specific location, typically by a triggered ability. For example [[Giant Shark]], [[Mount Ussar \nSanctuary]], or [[Guardian Angel]]. Some spells also provide such an effect, e.g. [[Harpyon Urge]]. \nWhen resolving such an effect, the controller of the effect must specify a path that is the fewest \npossible steps to the destination. If there are multiple equally short paths, the controller \nchooses. If no such path exists, the unit doesn't move at all. See ((Range of Motion)) for how to \napply lookahead when determining the path. Note that the basic abilities 'Move and Attack' and \n'Defend' do not require the player to choose the shortest path to the destination because they are \nlimited by the unit's movement (typically just a single step)."},{"k":"Move and Attack","def":"Move and Attack is a basic, activated ability with the following text: Tap -> This unit may take one \nstep. Then, it may attack."},{"k":"","def":"","sub":"Movement:  Normally the unit's movement path is one step between two adjacent surface locations, but \nsome abilities may modify this, including Movement +X, Moves Freely, Burrowing, Submerge, Airborne, \nand Voidwalk (and effects like [[Felbog Frog Men]]). See the entry for Movement Path for more \ninformation about declaring paths."},{"k":"","def":"","sub":"Declaring The Attack Target:  The Move and Attack ability does not use the word 'target,' so you do \nnot declare any targets in advance. As it resolves from the storyline, you declare your full \nmovement path, then resolve that movement. After completing all the movement (if any), you may \nattack, declaring your attack target at that time. See the '((attack))' codex entry for further \ndetails on the attack sequence."},{"k":"Movement +X","def":"Keyword Ability. A unit with Movement +X may move up to X additional steps when using the Move and \nAttack or Defend basic abilities. For example, [[Rimland Nomads]] may take two steps instead of just \none. If a unit has multiple copies of the Movement +X ability, the numbers simply add together. For \nexample, [[Rimland Nomads]] with [[Mad Dash]] have Movement +2."},{"k":"Moves Freely","def":"A unit with Moves Freely spends no steps moving via the Move and Attack or Defend basic abilities, \nas long as the starting and ending locations of the step satisfy the Moves Freely condition. Moves \nFreely only applies to basic movement, which is movement from the Move and Attack basic ability and \nthe Defend basic ability. A unit can combine free steps with regular steps, up to its movement \nlimit. See the examples below for more details."},{"k":"","def":"","sub":"Examples of Moves Freely:  Example 1  w1, w2, and w3 are water sites. A and B are land sites. [[Sir \nPelleas]] starts underwater at w1. He can take 1 step normally with the Move and Attack ability, so \nhe declares the following movement path: w1 underwater -> w1 surface (0 steps, Moves Freely between \nwater locations) w1 surface -> w2 surface (still 0 steps) w2 surface -> A surface (1 step) Note that \n[[Sir Pelleas]] cannot simply teleport to w3; Moves Freely requires the unit to declare a movement \npath, and some of the steps in that path might be free.  Example 2 Same as above, but [[Sir \nPelleas]] starts on the surface of B. He can declare this path: B surface -> w1 surface (1 step) w1 \nsurface -> w1 underwater (0 steps) w1 underwater -> w2 underwater (0 steps) w2 underwater -> w2 \nsurface (0 steps) The last three steps are all free, because they are between two water locations, \nper the Moves Freely ability of [[Sir Pelleas]]. Note that [[Sir Pelleas]] couldn't then continue \nfrom w2 surface to A surface, because that's not a free step, and [[Sir Pelleas]] already used up \nhis 1 step for his Move and Attack basic ability."},{"k":"Must Be Cast","def":"If a spell (typically a minion) 'must be cast' to a certain location it is an additional \nrestriction; you still must also follow normal casting restrictions for minions, e.g. to a site you \ncontrol. For example, [[Drowned]] must be cast submerged and also to a site you control. \n[[Mephistopheles]] and [[Cerberus in Chains]] must be cast to your avatar's location, and also to a \nsite you control. Minion spells cast by [[Algor Omphalos]] must be cast to its location and also to \na site you control. If the Omphalos was somehow on your opponent's site, the Omphalos wouldn't be \nable to cast minions to its location unless you could somehow cast minions to your opponent's site \ndue to some other effect. Note that if you summon a minion directly to the realm without casting it, \ne.g. [[Raise Dead]] or [[Boneyard]], then casting restrictions do not apply. (Summoning restrictions \nstill apply.)"},{"k":"Near","def":"Near is a synonym for 'nearby.'"},{"k":"Nearby","def":"Nearby refers to the current square and the eight squares that surround it (including diagonals). \nFor example, the middle square has 9 nearby squares - itself and eight others.  If a square is in \nthe corner of the realm, it will have fewer nearby squares. For example, the bottom right square has \nonly 4 nearby squares - itself and three others.  When referring to nearby sites, nearby voids, or \nnearby squares the effect can cross the boundaries of regions. For example, [[Ultimate Horror]] can \nbe in the void and still summon to a nearby site, even though sites and voids are in different \nregions. For all other references to nearby, such as nearby locations, nearby minions, nearby \nartifact, etc., regional boundaries must be respected and cannot be crossed. For example, if \n[[Belfry]] is on a site, it will not untap allies in a nearby void, because 'nearby ally' cannot \ncross a regional boundary."},{"k":"Non-Active Player","def":"The non-active player is the player who is not currently taking their turn."},{"k":"On the Ground","def":"To move 'on the ground' means to start from the surface of a site and move to another site's \nsurface, excluding Airborne and teleport. This includes all types of sites, including water sites."},{"k":"Ongoing Effect","def":"Ongoing effects apply continuously during their duration. If they do not have a listed duration, \nthey apply indefinitely while the source is in the realm. For example, [[King of the Realm]]'s \npassive ability is an ongoing effect that gives you control of all mortals. [[Gnome Hollows]]' \npassive ability is an ongoing effect that prevents units with 3 or more power from entering. \n[[Quagmire]]'s genesis ability creates an ongoing effect that causes units to be Immobile while they \noccupy nearby sites until your next turn. Between each event on the storyline, apply all ongoing \neffects. That is, the game is very regularly applying ongoing effects, both before and after each \nevent on the storyline. Most of the time, the application of ongoing effects is straightforward; \nsimply apply them. Complex interactions are described below."},{"k":"","def":"","sub":"Apply All Ongoing Effects Before Checking For Minions Dying:  If there are multiple ongoing effects, \nthe game will apply all of them before checking to see if any minions died. For example, you have a \n[[Bosk Troll]] that has taken 1 damage this turn. Then, you move it to a location that is nearby \nboth [[Wicked Witch]] and your [[House Arn Bannerman]]. Both the Witch and the Bannerman generate \nongoing effects with their passive abilities. If the game applied the -2 power from the Witch first \nand then immediately checked for minions dying, the Bosk Troll would die, even though it shouldn't \ndue to the House Arn Bannerman. Therefore, between each event on the storyline, the game applies all \nongoing effects before checking for minions dying."},{"k":"","def":"","sub":"Apply Ongoing Effects In Order - Layer System:  If ongoing effects overlap or conflict, apply them \nin the order listed here by layer: Copy effects, e.g. [[Mirror Realm]], [[Selfsame Simulacrum]] \nDisabling effects, silencing effects, e.g. [[Root Spider]], [[Iron Shackles]], [[Silence]], \n[[Sisters of Silence]] Control effects, e.g. [[King of the Realm]], [[Mesmerism]] Type changing \neffects, e.g. [[Bower of Bliss]], [[Corruptor]] Ability adding and removing effects, and affinity \nchanging effects, e.g. [[Power of Flight]], [[Watchtower]], [[Tide Naiads]], [[Drought]] Power \nsetting effects, e.g. [[Shrink]] Power addition and subtraction effects, e.g. [[Overpower]], \n[[Wicked Witch]] Power multiplication effects, e.g. [[Warp Spasm]] Within each layer, apply the \neffects based on their timestamp, from oldest to newest. For ongoing effects generated by a passive \nability (e.g. [[King of the Realm]], [[Root Spider]]), their timestamp is when the card entered the \nrealm. For ongoing effects generated by an activated or triggered ability (e.g. [[Floodplain]], \n[[Bog]]), their timestamp is when the ability was activated or triggered, not when the original \nsource entered the realm. An effect cannot remove itself once it's already being applied. For \nexample, an animated [[Silence]] aura will cause itself to lose its abilities in layer 2, but losing \nthat ability will not remove the silence effect, which was already being applied. In the unlikely \nevent that two or more cards enter the realm simultaneously and they have passive abilities that may \nneed to be ordered (e.g. my [[King of the Realm]] and yours, entering simultaneously via \n[[Boneyard]]), the active player's cards are considered to have entered first (in the order of their \nchoosing, if they have more than one entering simultaneously)."},{"k":"","def":"","sub":"Example - Two Kings of the Realm:  If you play [[King of the Realm]] and then I play [[King of the \nRealm]] afterward, the game applies both control effects in layer 3. Since your King is older, the \ngame starts with that effect. Your King gives you control of all mortals, including my King. Then, \nwhen the second King's ability is being applied, he's already controlled by you due to the first \nKing's ability. Therefore, you control all mortals and the first King 'wins.'"},{"k":"","def":"","sub":"Example - Two Smokestacks of Gnaak:  If you play [[Smokestacks of Gnaak]] and then I play another \nSmokestacks of Gnaak nearby, the game tries to apply both lose-ability effects in layer 5. Since \nyour Smokestacks are older, the game starts with that effect. Your Smokestacks causes my Smokestacks \nto lose its ability. Then, when my Smokestacks ability would be applied, it already lost its ability \ndue to the first Smokestacks. Therefore, the first Smokestacks 'wins.'"},{"k":"","def":"","sub":"Example - Flood vs. Drought:  If you play [[Flood]] and then I play [[Drought]], the game tries to \napply both affinity changing effects in layer 5. Since you played Flood first, the game first gives \nthe affected sites a minimum of one water affinity (W). Then, when my Drought ability is applied, \nthe affected sites have no water affinity. Therefore, the Drought 'wins.' If Flood had been played \nsecond, then the Flood effect would have been applied second, and thus would 'win.' Remember that if \nan activated or triggered ability creates an ongoing effect, the effect applies based on when the \nability activated or triggered, not when the original source entered the realm. For example, \n[[Floodplain]]'s activated ability would 'win' against a [[Drought]] even if the Floodplain entered \nthe realm before Drought, as long as the Floodplain's activated ability was used after Drought."},{"k":"","def":"","sub":"How to Handle Dependencies:  This is a complicated concept, perhaps the most complicated in the \nwhole codex! Be warned. Let's start with examples. I have [[Lucid Dreamers]] in the realm and cast a \n[[Bosk Troll]] to them, so my Troll gains voidwalk. Then, I cast [[Power of Flight]] on my Trolls. \nWhen applying those ongoing effects, I apply them in layer 5. Technically, I apply the Voidwalk \nfirst (because it's older) and then I apply Airborne. But, the end result would be the same if I \napplied them in the opposite order; either way, I end up with a Troll that has Voidwalk and \nAirborne. These two ongoing effects do not depend on each other. Now, let's consider two [[Sisters \nof Silence]]. I play Sister A then you play Sister B nearby. We apply the silenced effect in layer \n2. Since Sister A is older, the game applies that first, Sister B loses her ability, and Sister A \nretains her ability. If I applied them in the opposite order, Sister A would lose her ability and \nSister B would retain hers. In this case, both ongoing effects depend on each other. Finally, let's \nconsider one Sister of Silence and a [[Grievous Insult]]. I play my Sister of Silence and then you \nplay Grievous Insult. Let's say you have a [[House Arn Bannerman]] nearby my Sisters. If we apply \nthe Sisters first (because they entered the realm before the Grievous Insult was played), House Arn \nBannerman will be silenced, and then the Sisters would be silenced by the Insult. In this scenario, \nthe House Arn Bannerman would already be silenced and not get his ability back when the Sisters \nbecame silenced by the Insult! If we consider the alternate order, applying the Insult first, the \nSisters still end up silenced, but the House Arn Bannerman will not be silenced. In this case, the \nSisters' ability is dependent on the Insult, but the Insult is not dependent on the Sisters (since \nthe Sisters end up Silenced by the Insult regardless of order). Player intuition would say that if I \nplay Sisters and then you play Grievous Insult, we would expect the Grievous Insult to actually \napply first, even though it was played later. That is the whole point of the dependency rule! If one \neffect depends on another (but not visa versa!), apply the independent effect first, ignoring normal \ntimestamp order. This whole rule can probably be boiled down to 'use your intuition on how it should \nwork.' Here are further examples: I play [[King of the Realm]], and then you use [[Mesmerism]] my \nKing of the Realm. Without the dependency rule, we would apply the control effect from my King of \nthe Realm to all Mortals, then you would get control of only my King of the Realm via Mesmerism (but \nnot all the other Mortals, because we already applied that effect). But that's obviously not the way \nit should work, since Mesmerism is independent of the King's effect. Therefore, we apply Mesmerism \nfirst, then King of the Realm. I play [[Fields of Phyxis]] to silence your [[Floodplain]] in front \nof it. Then, you play [[Acid Rain]] just on my Fields. If we applied these in order, my Fields would \nsilence your Floodplain, then your Acid Rain would silence my Fields (but the Floodplain would \nalready be silenced). But that's obviously not how it should work, since Acid Rain is independent of \nFields. Therefore, we apply Acid Rain first, silencing Fields of Phyxis (and the Floodplains won't \nget silenced by the Fields). If there are multiple independent and dependent effects, apply the \nindependent effects in timestamp order, then the dependent effects in timestamp order. For example, \nif I play King of the Realm, then you play King of the Realm, you Mesmerize my King, then I \nInfiltrate my King back... We would note that Mesmerize and Infiltrate are independent of the King's \neffects, and apply those first. Mesmerize, then Infiltrate. Then we'd apply the King's abilities in \norder after that. Finally, note that if two effects are both dependent on each other, use t
