jacent to your Geomancer. If there's no void adjacent to your Geomancer, then no rubble is placed."},{"card":"","q":"Does Mirror Realm (copying an earth site), Valley of Delight (choosing earth), or one of the Bloom sites (i.e. Twilight Bloom) count for Geomancer's first ability?","a":"Yes. Mirror ))Realm(( works because it applies as it enters the realm. Valley of Delight and the Bloom sites work because the Genesis effect of the site interrupts the resolution of the Geomancer's ability; when the second part of Geomancer's ability actually resolves and looks at the site, the site is indeed an earth (E) site. See '((Splitting Events on the Storyline))' for more details on Valley of Delight interaction, analogous to the Tawny example and splitting the Druid's ability."},{"card":"","q":"If Geomancer creates a Rubble adjacent to Boulevard of Bones, do they create a skeleton?","a":"No, the rubble is created in place, not played."},{"card":"Geyser","q":"If a unit moves into the site on the same turn, but after Geyser has been cast, does it gain Airborne?","a":"No, the minion must be at the site when Geyser resolves to gain Airborne."},{"card":"Ghost Ship","q":"If I teleport my Ghost Ship from the void to a site, does its ability trigger?","a":"Yes."},{"card":"","q":"If I summon a Spirit from my opponent's cemetery, do I control it?","a":"Yes. (And as usual for an explicit summon effect, you don't need threshold and you don't pay mana.)"},{"card":"Giant Shark","q":"Will it fight units that are Airborne or Stealthed?","a":"Yes. This isn't an attack (which has targeting restrictions), but actually a fight (which simply specifies who fights based on card text)."},{"card":"","q":"What path can I choose when resolving this ability?","a":"See ((Moving to a Specific Location Via a Special Ability or Magic)) in the Codex."},{"card":"","q":"Will it fight your own units?","a":"Yes."},{"card":"","q":"Does 'enters' include minions that are summoned?","a":"Yes."},{"card":"","q":"If a unit moves within the same site (e.g. surface to underwater, or underwater to surface), does Shark trigger?","a":"No, since the unit is not entering or moving between different sites."},{"card":"","q":"What happens if I summon my minion with Genesis into my opponent's Shark's body of water?","a":"See the storyline codex entry for details."},{"card":"","q":"Can the Shark's path include movement from surface to underwater, or underwater to surface, if needed?","a":"Yes, as long as the path specified is the fewest steps possible to the target."},{"card":"","q":"If a Shark moves through a Silence aura, what happens?","a":"The movement and fight still occur. The specific resolution is: Unit enters the water site, Shark's ability triggers. You specify the movement steps to reach the target, and they all go on the Storyline. Shark starts moving. It enters the Silence aura, but the effects of the ability are still on the Storyline and aren't removed, so they continue resolving normally."},{"card":"Gift of the Raven","q":"Do multiple castings of this stack? Does it stack with other abilities that cause the minion's damage to heal me?","a":"Yes, each instance of an effect like this will trigger and heal you independently."},{"card":"Gilded Aegis","q":"A minion with Gilded Aegis is on a site chosen for Scorched Earth. The Aegis and the minion are being destroyed simultaneously. Does the Aegis have a chance to save the minion before it's destroyed?","a":"Yes."},{"card":"","q":"If forcefully burrowed without burrowing, will a unit with Gilded Aegis still die?","a":"Yes."},{"card":"Gilman House","q":"Is this effect limited to once per turn?","a":"Nope! You may use it as many times as you want in a turn, if you meet the threshold requirement. Of course, in Constructed play, you'll be limited to four, since you can have at most four Horrible Hybrids in your collection."},{"card":"Gnome Hollows","q":"If I have Crusade or House Arn Bannermen affecting my Gnome Hollows, may I summon a 2-power minion there?","a":"Yes. It's first summoned (enters the realm), then ongoing effects are applied (e.g. Crusade)."},{"card":"","q":"If Megamoeba starts at 2 power, can it move into Gnome Hollows (thus getting to 3 power)?","a":"Yes. First, Megamoeba enters, then it grows in power immediately after entering."},{"card":"","q":"If the most direct path is blocked (Gnome Hollows, Wall of Ice) will the grappling unit move around those obstacles to reach its target?","a":"No. 'Dragged' is equivalent to 'Pull,' and 'Pull' requires each location entered to be closer to the destination. Making any detours wouldn't be getting closer to the Avatar, so the unit cannot take that path."},{"card":"Golden Dawn","q":"How do I resolve this effect?","a":"Deal face up to your back row one at a time, placing each card to the surface of a site as you go. Then, shuffle any non-minions and put them on the bottom of your deck. Now all the minions are summoned simultaneously to the location they were dealt to; resolve any effects of those minions being summoned, e.g. genesis effects. Finally, check to see if you're at Death's Door now, and if so, all the summoned minions gain Charge."},{"card":"Golgor","q":"Can I choose to banish only some minions from the targeted location?","a":"No, if you choose to use this ability you must banish all minions at the targeted location with 2 or less power."},{"card":"Grapple Shot","q":"The alpha and beta text is different, which should I use?","a":"The Beta text is correct."},{"card":"","q":"Do I resolve all the steps at once, or can effects (e.g. Bottomless Pit) interrupt the movement?","a":"See the storyline codex entry for details."},{"card":"","q":"Can a disabled unit Grapple Shot?","a":"No, since it would be shooting a projectile, and disabled units can't do that."},{"card":"","q":"If I Grapple Shot a minion with Submerge through an area affected by Mariner's Curse, what happens?","a":"When the Grapple Shot projectile hits the unit, the game adds specific movement steps for the ally to the Storyline: Move A (surface) -> B (surface), Move B (surface) -> C (surface). Then, we start resolving those steps. If Mariner's Curse is on site B, once the unit being dragged reaches site B, it will be submerged, and live. Then the game tries to resolve Move B (surface) -> C (surface), which fails, since the unit isn't on the surface of site B anymore. Thus, there's no strike from Grapple Shot since it didn't reach the hit unit's location."},{"card":"","q":"If the most direct path is blocked (Gnome Hollows, Wall of Ice) will the grappling unit move around those obstacles to reach its target?","a":"No. 'Dragged' is equivalent to 'Pull,' and 'Pull' requires each location entered to be closer to the destination. Making any detours wouldn't be getting closer to the Avatar, so the unit cannot take that path."},{"card":"Grasping Ground","q":"Are the minions and artifacts targeted by the allies which drag them down, or by the caster of Grasping Ground?","a":"The caster of Grasping Ground must be able to target the minions and artifacts which will be be dragged down by their allies."},{"card":"Great Old One","q":"How does Drought interact with Great Old One?","a":"These are both passive effects, so whichever was played last takes precedence."},{"card":"","q":"What does it actually mean to permanently flood the realm, including voids?.","a":"All sites (including rubble) are flooded for the rest of the game, even sites that enter the realm later."},{"card":"Great Wall","q":"The foil and non-foil beta cards have different text. Which is correct?","a":"The non-foil beta text is correct. You may use a foil beta Great Wall in tournament play (or the alpha version), but it must be played with the non-foil beta text; ensure your opponent knows the proper text when it's played."},{"card":"","q":"Does this stop all kinds of movement through the top border (e.g. Grapple Shot), or just the Move and Attack basic ability?","a":"The Great Wall will stop most kinds of movement on the surface, with a few notable exceptions. Teleportation doesn't cross borders, and if a unit 'moves as if adjacent' (e.g. Waypoint Portal), that also doesn't cross borders. Finally airborne units can fly over the wall as they are not moving 'on the ground.'"},{"card":"","q":"The alpha and beta text is different, which should I use?","a":"The beta text is correct."},{"card":"Grigori Rasputin","q":"How do I resolve this ability?","a":"Rasputin must be in your cemetery to use this ability. Then, choose the Evil ally you will banish, which may be anywhere and not limited to your own sites. Since Banishing is the cost of the activated ability, resolve the whole activated ability before actually banishing the minion. (This is analogous to the '((Sacrifice))' rules.) Rasputin gains the printed power and abilities of the ally. Resolve Genesis abilities and any 'enter the realm' abilities. Finally, the Banished ally is actually removed from the realm. (Place it under Rasputin as a reminder of the current effect.)"},{"card":"","q":"Can I banish an evil ally from my cemetery or hand?","a":"No, you can only choose an ally in the realm to be banished by Rasputin's ability."},{"card":"Grim Reaper","q":"How does this ability work?","a":"When Reaper kills a minion, the minion is banished instead of dying. In addition, any copies of that minion in play (regardless of who controls them) are also banished. Finally, you search the owner's library of the minion that was killed (and only that player)."},{"card":"Grösse Poltergeist","q":"If a unit is carrying the animated artifact, who retains control?","a":"When the artifact is animated, it becomes a minion, and thus cannot be carried. The controller of Grösse Poltergeist gets control."},{"card":"","q":"If the unit carrying the animated artifact can also carry minions, who retains control?","a":"Grösse Poltergeist says you gain control, but the game rules say that anyone carrying the artifact gains control. Grösse Poltergiest takes precedence due to the golden rule, and the controller of Grösse Poltergeist gets control."},{"card":"Guardian Angel","q":"Can you 'fly to' a minion already sharing your location?","a":"No, that's not 'flying to.' Summon the Guardian Angel to a different location!"},{"card":"","q":"What path can I choose when resolving this ability?","a":"See ((Moving to a Specific Location Via a Special Ability or Magic)) in the Codex."},{"card":"","q":"What happens if the power of one of the units changes during the resolution of this effect so that it's no longer weaker?","a":"Only check that the target is weaker when it is initially targeted, and when the effect first starts to resolve from the storyline. Once the effect is resolving and minions are moving, it does not matter if the relative powers change after that point."},{"card":"Guile Sirens","q":"Can it target a unit in a different region?","a":"No. Targeting (by default) requires the source and the target to be in the same region."},{"card":"","q":"Does the target minion use its enhanced move abilities?","a":"Yes. When an effect has a unit 'take steps,' it uses its enhanced move abilities granted by keywords such Voidwalk, Burrowing, Submerge, and Airborne."},{"card":"","q":"Does it tap the target minion? Can this movement be intercepted?","a":"No and no. This isn't the Move and Attack basic ability, which is what requires tapping and can be intercepted."},{"card":"","q":"Consider the group of sites below. An oversized minion occupies 1-2-4-5. Guile Sirens is #5. Can the oversized minion be pulled in any way?","a":"Yes. When pulling or pushing an oversized unit, choose a single location the oversized unit occupies (and meets the requirement of the effect), and push/pull from there. So, you could choose Site 2: Oversized minion is pulled South, and ends up at 4-5-7-8. OR, choose Site 4: Oversized minion is pulled East, and ends up at 2-3-5-6. OR, choose Site 5: Oversized minion isn't pulled at all."},{"card":"","q":"Is the ability mandatory?","a":"Yes. It doesn't use the word 'may.'"},{"card":"Harbinger","q":"Does Harbinger's ability combo with other effects that allow you to cast minions, e.g. Elder Ruins, Troubled Town, Peculiar Port, etc.?","a":"Yes! It's effectively a passive ability that can be used whenever you cast a spell on your turn. The golden rule, baby!"},{"card":"","q":"When I determine my three random squares, what if I roll doubles or triples?","a":"Reroll any duplicated results until you have three ))unique(( squares."},{"card":"","q":"When do I determine the random squares?","a":"As soon as your Avatar enters the realm, during step 2 of setup."},{"card":"Harpyon Urge","q":"What does 'an ally flies' mean?","a":"The chosen unit takes flying steps as if it had the airborne ability. If the unit cannot take steps (due to being immobile, for instance), it cannot move to the targeted minion."},{"card":"","q":"What path can I choose when resolving this ability?","a":"See ((Moving to a Specific Location Via a Special Ability or Magic)) in the Codex."},{"card":"","q":"What happens if the power of one of the units changes during the resolution of this effect so that it's no longer weaker?","a":"Only check that the target is weaker when it is initially targeted, and when the effect first starts to resolve from the storyline. Once the effect is resolving and minions are moving, it does not matter if the relative powers change after that point."},{"card":"Haystack","q":"How does this interact with effects like Browse or Kelp Caverns, which do not say to search, but have you look at cards instead?","a":"If the effect does not use the word 'search' in its text, it will not be limited by Haystack."},{"card":"","q":"Does this apply if my opponent is searching my deck as well?","a":"Yes! Any time your opponent is searching their deck or your deck, they only search the top three cards."},{"card":"Headless Haunt","q":"What if my Headless Haunt tries to teleport into an illegal location? (e.g. Gnome Hollows)","a":"The teleport effect fails, and it remains where it was."},{"card":"Heirloom Lost","q":"What happens to the site that is replaced?","a":"The site being replaced is banished."},{"card":"","q":"Does this play ability allow me to break normal site placement rules?","a":"Yes! You may play this site to replace an Elite or Unique site, even if that site isn't adjacent to your existing sites."},{"card":"Hemogoblet","q":"Can I attempt to fill the Hemogoblet if it's already full?","a":"No, you must empty it first."},{"card":"","q":"When hemogoblet is emptied, do I gain mana or life equal to the power of the minion at that moment, or the power of the minion at the time of sacrifice?","a":"At the time of sacrifice. Make note of the minion's power when you fill the hemogoblet!"},{"card":"Highland Falconer","q":"What does 'shuffle if needed' mean?","a":"If you searched your spellbook, shuffle it. If you end up summoning a beast from your hand, you may still have searched your spellbook if you wanted."},{"card":"Hillock Basilisk","q":"If I summon a minion to a location affected by Hillock Basilisk, will my minion's Genesis ability resolve?","a":"Yes, the minion will not be at rest until all of its events on the storyline are resolved, including its Genesis ability."},{"card":"Hillside Chapel","q":"If the allied minion was already tapped before using this ability on them, do they still gain Ward?","a":"Yes, you resolve as much of this ability as you can. Granting the Ward is not contingent on the minion being untapped beforehand."},{"card":"Horn of Caerleon","q":"If my minion gains charge from the Horn to Move and Attack and then leaves the Horn's range, can it finish the attack?","a":"Yes, as the minion has already tapped, the rest of the Move and Attack will resolve. Once a charge has been sounded in the heat of battle, there's no stopping it!"},{"card":"Horns of Behemoth","q":"Does it turn into a Demon minion?","a":"Yes, it becomes a minion with the Demon type, and is no longer a site."},{"card":"","q":"When it awakens, is it summoning sick?","a":"Assuming it was in the realm prior to the turn it awakened, it is not summoning sick (since it was already under your control prior to this turn)."},{"card":"","q":"Is the ability optional?","a":"Yes. It is an activated ability with no cost and a threshold requirement. Like all activated abilities, you can only activate it during your Main Phase when nothing else is happening, but you are not required to activate it."},{"card":"","q":"Does it continue to provide fire affinity after it transforms into a Demon?","a":"Yes. The transformed Demon provides affinity, due to the golden rule. Obviously, if the Demon dies, you will lose that affinity."},{"card":"","q":"What happens if you copy this after it has transformed?","a":"Since transform effects permanently change the characteristics of the card, as opposed to temporary modifications of characteristics (i.e. [[Overpower]]), the copy effect will take on those new characteristics.  For instance, a [[Selfsame Simulacrum]] copying an [[Island Leviathan]] that has been transformed will enter play as an 8-power Monster minion that provides one water affinity."},{"card":"Hotwheel","q":"Does this strike a unit at the location it was summoned to?","a":"No, since it will enter that location before its Genesis ability begins to resolve. It will only strike a unit at each of the two new locations it enters while resolving its Genesis."},{"card":"Hounds of Ondaros","q":"What does it mean to 'permanently lose stealth'?","a":"Simply remove the stealth token. It does not prevent the minion from gaining stealth later."},{"card":"Howl from Beyond","q":"How do I resolve this effect?","a":"Deal face up, one at a time. Then, draw the voidwalk minions and Monsters, and banish the rest. No minions actually 'enter' the realm with this effect."},{"card":"Hyperparasite","q":"Is the minion only disabled while being carried?","a":"Yes, if the minion is no longer carried, it is no longer disabled."},{"card":"","q":"What happens if the Hyperparasite is Silenced or Disabled while carrying a minion?","a":"As per the rules about Carrying Units, if this loses its ability to carry a minion, that minion is no longer carried, and no longer disabled by this ability."},{"card":"","q":"Can this choose to drop the minion it is carrying?","a":"Yes, abilities which allow a unit to pick up other units also allow them to drop them."},{"card":"","q":"If this stops carrying a minion can it pick up another minion?","a":"Yes, it can pick up another minion, or the same minion again."},{"card":"","q":"Can this be moved by force while carrying a minion?","a":"Yes.  It cannot take its own steps while carrying a minion.  It can still be moved by force."},{"card":"Ice Lance","q":"If Ice Lance doesn't hit anything at the first location where the projectile appears, and then hits something at the 2nd location, how much damage does it do at that 2nd location?","a":"2 damage at the 2nd location. Ice Lance's damage decreases based on locations the projectile enters, not based on how many things it hits or doesn't hit."},{"card":"Ignis Rex","q":"What is a fire card?","a":"Fire sites and fire spells are fire cards. See the 'element' codex entry for more details."},{"card":"","q":"What is fire damage?","a":"Damage from a fire card."},{"card":"Imperial Road","q":"If I play a Village on my opponent's turn via Imperial Road, can I pay 1 mana to summon a Foot Soldier?","a":"The genesis effect triggers, but you don't have any mana available on your opponent's turn, so no."},{"card":"Imposter","q":"Can Imposter wear masks of Avatars with pre-game or setup abilities, and if so, what happens?","a":"Yes, you can wear masks of those avatars, and you simply ignore their pre-game or setup abilities since the game has already started by the time you put on the mask. For example: You can use [[Pathfinder]]'s ability even though your atlas has duplicate sites. You don't get to pick a Unique Dragon as [[Dragonlord]]. (Probably not a good choice of masks.) You don't roll for summoning portals as [[Harbinger]]. (Probably not a good choice of masks.) Your decks and card sleeves remain as-is for [[Magician]].  (Probably not a good choice of masks.)"},{"card":"","q":"What rarity are Avatars for purposes of including them in my collection?","a":"Consider Avatars unique for purposes of including them in your collection."},{"card":"","q":"What happens if I impersonate the Druid and then use the ability to flip?","a":"You will summon Bruin, flip, ... and then immediately lose the game because you no longer have an Avatar in play! Maybe don't include Druid in your collection?"},{"card":"","q":"What happens if I impersonate the Realm-Eater, use the ability to destroy a site, and then take damage or otherwise lose that mask before I can digest?","a":"The Realm-Eater's ability will have created an ongoing effect which immobilizes you, and can only be removed by activating the 'digest' ability.  If you lose that ability, you cannot remove the immobile effect.  Be careful!"},{"card":"Infiltrate","q":"If my Infiltrated unit attacks my opponent's undefended site, do I retain control of it?","a":"No. Once the infiltrated minion no longer has stealth, you ))lose(( control of it."},{"card":"Interrogator","q":"When does the enemy avatar have the opportunity to pay life?","a":"Immediately after the strike, before deathrites resolve. For example, if your strike puts them to 2 or less life, they will not be able to pay 3 life."},{"card":"","q":"What happens if I strike for 0 damage?","a":"A strike for zero damage is still considered a strike, so it will still trigger Interrogator's ability."},{"card":"Into the Abyss","q":"Normally pull effects can't cross regional boundaries. Can I actually pull the target minion into the void?","a":"Yes, obviously!"},{"card":"Iron Shackles","q":"Can I target a burrowed minion or a voidwalk minion?","a":"Not unless you have a burrowed spellcaster or a spellcaster in the void. Since the effect uses the word 'target,' the spellcaster must be in the same region as the target. (There are four regions: surface, underground, underwater, void.)"},{"card":"","q":"What happens if I target a minion with a Ward when conjuring this?","a":"On resolution, the Ward will protect the targeted minion. Due to the Golden Rule, the Ward breaks and the Shackles end up at the same location, not carried."},{"card":"Ironclad","q":"How does this ability work?","a":"Any time your Avatar would take damage, you reduce that damage by 2, to a minimum of 0. Note that an enemy striking one of your sites causes life loss to your Avatar, not damage; life loss is not affected by this ability. Each source of damage is reduced by 2. For example, if you attack and three Foot Soldiers defend together, you take 0 damage since each Foot Soldier would do 1 damage, which you reduce. As another example, if you are hit by an Arcane Barrage for 5, you take 0 damage, since each projectile would do 1 damage, which you reduce."},{"card":"Island Leviathan","q":"Does it turn into a Monster minion?","a":"Yes. It becomes a minion with the Monster type, and no longer a site."},{"card":"","q":"If the flooded Rubble gets replaced with a site, is the new site also flooded?","a":"No."},{"card":"","q":"When it awakens, is it summoning sick?","a":"Assuming it was in the realm prior to the turn it awakened, it is not summoning sick (since it was already under your control prior to this turn)."},{"card":"","q":"Is the ability optional?","a":"Yes. It is an activated ability with no cost and a threshold requirement. Like all activated abilities, you can only activate it during your Main Phase when nothing else is happening, but you are not required to activate it."},{"card":"","q":"Does it continue to provide water affinity after it transforms into a Monster?","a":"Yes. The flooded rubble does not provide any affinity to you (since you don't control it), but the Island Leviathan itself does provide affinity, since that's aligned with the golden rule. Obviously if the Monster dies, then you lose that affinity."},{"card":"","q":"What happens if you copy this after it has transformed?","a":"Since transform effects permanently change the characteristics of the card, as opposed to temporary modifications of characteristics (i.e. [[Overpower]]), the copy effect will take on those new characteristics.  For instance, a [[Selfsame Simulacrum]] copying an [[Island Leviathan]] that has been transformed will enter play as an 8-power Monster minion that provides one water affinity."},{"card":"Jack the Ripper","q":"Is Jack the Ripper a Monster as well as a Mortal?","a":"Yes! The inclusion of the capitalized 'Monstrous' in his typeline makes him a Monster (and thus Evil)."},{"card":"","q":"What if the Mortal's location is one where Jack would be silenced? Or disabled?","a":"When Jack the Ripper is cast (before he even enters the realm!), his ability is put on the storyline to resolve in the future, when he enters the realm. Silenced upon entering the realm: His ability is already on the storyline, so it still resolves. (A silenced minion can still kill other minions.) He does lose stealth due to silence. Disabled upon entering the realm: His ability is already on the storyline, but when it goes to resolve, he cannot actually kill anyone, since being disabled prevents a minion from taking any actions granted by an effect. He will also lose stealth due to being disabled."},{"card":"","q":"Can Jack be cast to a Mortal in a region other than the surface?","a":"Yes, but if cast to the void, he will be banished before the rest of his cast ability can resolve. If summoned underground or underwater (or to any location with an effect that would kill him) he will die before he can complete his task as well, assuming he doesn't immediately gain the ability to survive in that location.  This means he will neither Silence nor Kill his prey."},{"card":"","q":"What if I send Jack the Ripper to commit regicide, casting him to the location of my opponent's King of the Realm?","a":"Jack will enter at the King's location and will technically change control briefly to the controller of the [[King of the Realm]], but his ability will already be on the storyline. Jack will then silence and kill the King, and return to your control."},{"card":"Jihad","q":"The term 'summon' means 'enter the realm.' So, does that mean I can play minions here for free?","a":"No. This effect simply provides additional locations where you may summon your fire minions."},{"card":"Joust!","q":"When exactly do the minions fight?","a":"After both units have taken their step they will fight from their new locations. If either doesn't move, they haven't passed each other and therefore no joust takes place."},{"card":"Kairos the Archivist","q":"How do I 'archive the state of the realm' ?","a":"Take a snapshot of the cards in the realm. Players should literally take a picture of it on their phone! If you include this card in your deck, you should be prepared to take a picture during the game. Make additional notes as needed to track things like whether a unit has used its Pick Up and Drop ability for the turn, the controller of a Mesmerized minion, or if there's an ongoing effect on a minion like ))Power(( of Flight. Players are expected to make additional notes as needed to be able to recreate the state of those cards, if a picture alone is insufficient."},{"card":"","q":"When I 'archive the state of the realm,' does that include players' life totals?","a":"No. Players' life totals will not revert when Kairos's deathrite resolves."},{"card":"","q":"When I 'archive the state of the realm,' does that include cards outside the realm?","a":"No! It does not include any other zone. The thing to focus on are literally the state of cards in the realm right now."},{"card":"","q":"Do I archive global effects like Critical Strike?","a":"No, since it's not an 'archived card,' but instead an ongoing effect that hasn't yet been applied. The test for inclusion in the archive is if the effect is currently applying to a card in the realm. E.g. Whether or not you've discarded a card for Wizard's Den would be included in the archive."},{"card":"","q":"When a card is 'returned to its recorded state,' does it enter the realm?","a":"No, it is not entering the realm. Genesis, Stealth, Lance, etc. will not trigger and sites do not generate mana."},{"card":"","q":"How do I 'return all archived cards to their recorded state' ?","a":"Players should look at the picture they took, then return each card to where it was before, though banished cards can never be returned; sometimes knowledge is truly lost. Once Kairos enters the realm, cards will be tracked across zones solely for the purpose of his deathrite. He's that good of a librarian! If tracking a card across zones is not possible due to hidden information, e.g. shuffled into your deck, then the player may return the card from any zone (but never from banished)."},{"card":"","q":"When we 'return all archived cards to their recorded state,' do all changes happen simultaneously?","a":"Yes."},{"card":"","q":"When a card is 'returned to its recorded state,' does it move or enter the location?","a":"No. It does not enter the location; simply place it wherever the picture shows. This is not movement. It's like we're rewinding time, not actually moving cards around."},{"card":"","q":"Let's say the realm is archived, then I cast an artifact into my unit's hands, then my unit moves. Then Kairos dies. Does my unit bring its carried artifact when it returns to its recorded state?","a":"No! Carried artifacts do move with their bearer whenever their bearer moves, but when you 'return to its recorded state,' that's not considered movement! It's a one-of-a-kind direct placement effect. Therefore, the artifact gets left behind, wherever it is. It's like we're rewinding time, not actually moving cards around."},{"card":"","q":"When archived cards are returned to the realm, does that include tokens that were archived?","a":"Yes! If a token was in the realm and archived, it will return to its recorded state when Kairos dies. If the token left the realm (and was thus banished), the token still returns to its recorded state, because there are always unlimited copies of tokens available to the players."},{"card":"","q":"When we 'return all archived cards to their recorded state,' do all non-archived cards (e.g. cards that entered the realm after Kairos) remain unchanged?","a":"Yes. They remain where they are, though if a recently ))played(( or ))moved(( site is in the way of a site that's returning to its recorded state, the site that's in the way will get banished! See below for more examples and details."},{"card":"","q":"When we 'return all archived cards to their recorded state,' what if non-archived sites are in the way?","a":"The site that's in the way gets banished! For example, the realm is archived, then Cloud City moves, then a Lone Tower site fills in the square where Cloud City was archived. Then Kairos dies. The Lone Tower is banished and Cloud City returns to its recorded state!"},{"card":"","q":"What about Earthquake or Rubble?","a":"If Kairos archived the realm with Rubble in it, then Rubble will replace whatever sites are there when cards return to their recorded state, banishing any sites in the way! For Earthquake, imagine the following sequence: The realm is archived with sites on squares 3, 8, and 9. Then, a Lone Tower is played on square 4. Earthquake gets played, rearranging sites. Kairos dies. The sites now return to their recorded state. That means the sites that were originally on squares 3, 8, and 9 go back to where they were, all simultaneously. The Lone Tower does not change squares because it was not an archived card. If it's now in the way and in square 3, 8, or 9, it will get banished by the site that's returning there. Don't mess with the Archivist!"},{"card":"","q":"Can you give a complicated Kairos example?","a":"Enjoy this one: I have an Kettletop Leprechaun on Gnome Hollows in square 8. You have a Cloud Spirit on Cloud City in square 3. The realm gets archived. Then: Cloud City moves to square 9 and you summon Bluecap Knockers there. I cast a Grim Guisarme into the hands of my Leprechaun, who moves to square 9. I cast a House Arn Bannerman into the Gnome Hollows. Then, Kairos dies. All of the following happen simultaneously: My Kettletop Leprechaun returns to square 8; even though it's a Gnome Hollows and the Leprechaun has 3 power due to the House Arn Bannerman, remember that the 'return' effect is not movement and is not considered 'entering.' The Grim Guisarme is not an archived card, and it remains where it is on square 9. Carried artifacts move whenever their bearer moves, but returning is not a movement effect, so the artifact doesn't automatically come with the Leprechaun. The Cloud Spirit and Cloud City return to square 3; this is not movement, and thus Bluecap Knockers does not prevent it. The Bluecap Knockers find themselves in the void and are banished. There is a Grim Guisarme in the void on square 9 now. Had there been a site on square 3, it would have been banished as Cloud City returned to that square. When in doubt, always apply the Golden Rule, but especially with Kairos!"},{"card":"","q":"What if there are multiple Kairos's in play?","a":"Whenever a new Kairos archives the realm, that becomes the most recent snapshot for all Kairos deathrite effects. That is, there is only a single archive of the realm at a time. Archivists unite!"},{"card":"","q":"What if Kairos dies on The Geistwood?","a":"Since the deathrite effect and genesis effect will be triggered simultaneously, you may order them as you wish. If you resolve the printed deathrite first, archived cards will return to their recorded state, then the printed genesis effect will not resolve, since Kairos is banished. If you resolve the printed genesis first (as a deathrite due to The Geistwood), the realm will be archived, and then when the printed deathrite resolves, it would return to that very recently archived state, and Kairos would be banished."},{"card":"","q":"Can your avatar end up in the void after Kairos dies, and if so, what happens?","a":"It's theoretically possible! If it does happen, the mandatory actions rule will apply to you, and if you have a site in hand, you'll be required to play it. The way it could happen is left as an exercise for the reader!"},{"card":"","q":"Is the state of the Storyline archived? Does the Storyline get restored to its snapshotted state?","a":"No! The Storyline isn't archived, and it simply continues to resolve normally after Kairos's deathrite. For example, I have Infernal Legion in the realm on square 8. Then I summon Kairos and the realm is archived. The Infernal Legion moves to square 3, and I summon Vatn Draconis. During my End Phase, I have ((simultaneous triggers)) for Infernal Legion and Vatn Draconis. I choose to order the storyline with Vatn Draconis first, then Infernal Legion. So I resolve Vatn Draconis's ability, which kills Kairos. Kairos's deathrite goes on the storyline and resolves before the Infernal Legion ability. When I archived the realm, the storyline was empty. But that doesn't matter because the storyline is different from the realm. We return cards to their recorded state, placing the Infernal Legion back on square 8, and then continue resolving the current storyline, so the Infernal Legion's ability resolves when it's on square 8, even though the ability was added to the storyline when the Legion was on square 3."},{"card":"Karkemish Chimera","q":"Units A, B, and C are being attacked; can unit D defend the attack and protect A, B, and C, or just one of them?","a":"Just one; you must choose unit A, B, or C to be defended."},{"card":"","q":"Units A, B, and C are being attacked; can unit A defend the attack against B, so that B takes no damage?","a":"No, since A is already being attacked, they cannot take the Defend reaction."},{"card":"","q":"Do each of the attacked units take 6 damage, or is the damage split as the attacker chooses?","a":"The damage is split as the attacker chooses."},{"card":"Key to the City","q":"When does this artifact provide mana?","a":"When it enters the realm, and at the start of its controller's turn."},{"card":"","q":"How does this ability work?","a":"Site abilities cannot target, damage, destroy, banish, modify, move, or impede the movement or attacks of the bearer of the Key. Additionally, site abilities cannot cause the bearer to lose or gain life, and cannot affect healing the bearer receives. For example: Gnome Hollows will not stop a 3+ power Key bearer from entering. A Key bearer can walk over a Perilous Bridge on the ground. Remote Desert will not damage a Key bearer. Poisoned Well cannot cause the bearer to lose life. An Avatar Key bearer will not gain life from Holy Ground or lose life from Poisoned Well. An Avatar Key bearer will not have its healing reduced by River of Blood. (The Avatar itself must hold the Key to ignore the half healing effect from River of Blood.) Fields of Camlann will not destroy a Key bearer, even when it's not the chosen minion. River Rapids can't move a Key bearer. Many site effects won't apply, as part of 'can't be modified': Gilman House can't transform a Key bearer Babbling Brook can't disable a Key bearer Bog can't immobilize a Key bearer Silent Hills can't silence a Key bearer Road to Perdition can't increase or decrease a Key bearer's power Accursed Desert can't break a Key bearer's Ward Some site abilities will continue to work: Wizard's Den will still allow a Key bearer Avatar to draw a spell (since players actually draw spells, not units). Garden of Eden will still stop a Key bearer Avatar from drawing extra spells (since players actually draw spells, not units). Beacon will still count an enemy Key bearer. Asmodeus with the Key still can't destroy a Bedrock. A Key bearer Avatar will still have to pay (2) extra for Bureau of Occult Control, since gaining and paying mana is done by the player. A Key bearer Avatar will still be able to use the threshold provided by The Empyrean's site ability, since tracking threshold is done by the player. [[The Void]] ))site(( would still banish a non-voidwalk minion Key bearer, since the game itself is banishing the minion."},{"card":"","q":"How does this ability interact with Flooded sites?","a":"The Flooded ability gives a site a minimum of 1 water threshold, making it a water site. Even a bearer of Key to the City will see the water threshold and treat it as a water site. e.g. It will die in the subsurface if it doesn't have Submerge, it can't be forcefully Burrowed, etc."},{"card":"King Arthur","q":"How does the Philosopher's Stone work with multi-element cards, such as King Arthur and Queen Guienevere? Would King Arthur, who requires 4 mana, cost 3 or 0 Mana to cast using the Stone","a":"Cards that have different element symbols count as a spell of each of those affinities. So Arthur and Guinevere are each an Air spell, an Earth spell, a Fire spell, and a Water spell, all at the same time. But you are still casting them together as a single spell. So, assuming Arthur is your spellcaster's first spell of the turn, the Stone will offer a discount of 1 mana for Arthur, making him cost 3 mana. \n\nThis also means that when Arthur is played he uses up the Stone for that spellcaster's turn because he's simultaneously the first Air, Earth, Fire, and Water spell played this turn. So the Spellcaster cannot continue to use the stone that turn."},{"card":"King of the Realm","q":"What Mortals are affected by the first ability?","a":"All Mortals, anywhere in the realm."},{"card":"","q":"If a Mortal with Deathrite dies, who gets the Deathrite ability?","a":"The King's controller, since Deathrite triggers while the units are technically still in the realm."},{"card":"","q":"What happens if a second King of the Realm enters play?","a":"See '((Example - Two Kings of the Realm))' in the codex."},{"card":"","q":"If my opponent plays a Mortal with a Genesis ability and I have a King in play, who gets the Genesis ability?","a":"The player with the King gets the benefit, since they control the Mortal as soon as it's in play."},{"card":"Kingdom of Agartha","q":"If Kingdom of Agartha's ability is active, can I choose to summon minions underground without a printed Burrowing ability?","a":"Yes. Kingdom of Agartha affects minions everywhere."},{"card":"","q":"When is Kingdom of Agartha's ability active?","a":"Whenever you have three earth affinity! It is not optional; it's a passive ability that's always on while you have the necessary affinity."},{"card":"Kythera Mechanism","q":"How does this interact with Court Jester?","a":"You don't get to look at your opponent's hand, but you do get to choose which of their cards they discard (e.g. site or spell)."},{"card":"","q":"If two are played, which one takes precedence?","a":"The most recently played one. See 'ongoing effects' for more details."},{"card":"","q":"If there are two in play (and mine was played first), then I drop mine and pick it back up, do I take precedence?","a":"No. Competing passive abilities are tracked based on when the card entered play."},{"card":"Lacuna Entity","q":"What happens if the power of one of the units changes during the resolution of this effect so that it's no longer weaker?","a":"Only check that the target is weaker when it is initially targeted, and when the effect first starts to resolve from the storyline. Once the effect is resolving and minions are moving, it does not matter if the relative powers change after that point."},{"card":"Land Deed","q":"What happens if I have a minion that occupies more than one site (e.g. Mountain Giant) and also carries Land Deed?","a":"Land Deed only grants you control of the site that Land Deed occupies."},{"card":"","q":"If I gain control of a site in the middle of my turn, does it produce mana immediately?","a":"No. Sites produce mana at the start of your turn and when they enter the realm. Since the site with Land Deed was already in the realm, it doesn't produce mana merely because you took control of it."},{"card":"","q":"What happens if I have a Land Deed on Rubble?","a":"You control the Rubble and your avatar will lose life if the Rubble takes damage, but the Rubble still doesn't provide mana. i.e. you own a hunk of worthless rock!"},{"card":"Lava Salamander","q":"What counts as a 'fire spell'?","a":"Once a minion, aura, or artifact enters the realm, it is no longer considered a 'spell.' Magic never enters the realm, so it is still considered a spell while it is resolving. In effect, Lava Salamander is immune to fire Magic."},{"card":"Leap Attack","q":"Does this card count as an 'attack' since it has the word 'attack' in its name?","a":"Sorry for the confusion, but no, this is not actually an attack! You only get an 'attack' from the Move and Attack basic ability, or card text that specifically uses the word attack (e.g. Crave Golem). This card text uses the word 'strike,' which means the unit simply deals damage equal to its power (and there's no chance for the opponent to Defend, and you can strike Stealthed or Airborne units, etc.)"},{"card":"Legion of Gall","q":"What if there are fewer than three cards in the chosen collection?","a":"You banish all of the remaining cards."},{"card":"Lightning Bolt","q":"Can I lightning bolt the void?","a":"Yes, but only if the spellcaster is in the void (since Lightning Bolt targets, the spellcaster must be in the same region)."},{"card":"Lilith","q":"What happens if Lilith summons a minion with an end of turn ability (e.g. Infernal Legion)?","a":"Their ability will not trigger this turn."},{"card":"","q":"Who controls the summoned minion?","a":"The controller of Lilith. Note cards always go to the cemetery of their owner, regardless of their controller."},{"card":"Locusts of Illyria","q":"Do I summon a copy the turn I first summon the Locusts?","a":"Yes! At the end of the turn you first summon them, they will see that there are no 'new' Locusts (meaning Locusts summoned by the triggered ability), and thus summon a copy. The following turn if you still have two in the realm, you'll only get one more."},{"card":"Lord of Fear","q":"What does 'defend alone' mean?","a":"When the Defend window closes (see '((Attack))' in the codex for details), If only a single enemy unit uses the Defend ability, the Defender is removed from the fight and the original attack target is reinstated. Defenders still arrive one at a time, but if there's only one, the defense effectively is negated (though that one defender still got to tap and move to the attack's location)."},{"card":"Lord of Greed","q":"How do I properly resolve this effect?","a":"Lord of Greed may and must take a carriable artifact from anywhere in the realm, including from another unit sharing a location with him. In this case, 'elsewhere' means anywhere other than Lord of Greed's hands! He will take from allies as well. This does not target the artifact, so even artifacts carried by minions with stealth are not safe from Lord of Greed."},{"card":"Lucky Charm","q":"The alpha and beta text is different, which should I use?","a":"The beta text is correct."},{"card":"Lure","q":"Can my allied minion tempt an enemy in a different region to take a step closer?","a":"Yes, as long as they occupy a nearby site, they can be above or below that site.  However, they cannot be tempted to take a step into a region they couldn't normally move into (e.g. they cannot be made to step underground if they do not have Burrowing)."},{"card":"","q":"If the tempted enemy has multiple equally closer steps, who chooses the specific step taken?","a":"The caster of this spell determines among the equally closer choices."},{"card":"Maddening Bells","q":"If Maddening Bells tries to increase the cost of a spell that has an alternate casting cost of zero (e.g. Deathspeaker ability while on death's door, Aramos Mercenaries), what happens?","a":"The spell costs zero. See '((Cost))' for more details."},{"card":"","q":"When summoning minions, does Maddening Bells care about the location where the minion is summoned, or where the spellcaster is?","a":"Only where the spellcaster is, not the summoning location."},{"card":"","q":"If the Spellcaster is nearby Maddening Bells but the spell affects something not nearby, does it still cost 2 extra mana?","a":"Yes. Maddening Bells's ability only cares about the Spellcaster's position."},{"card":"Maelström","q":"Does the movement get resolved simultaneously?","a":"Yes, all the steps are simultaneously resolved (which might then provoke a variety of triggers)."},{"card":"","q":"If I choose to pull a minion, do I have to pull all minions?","a":"Yes."},{"card":"","q":"Can I use Floodplain before Maelström triggers?","a":"No. Floodplain is an activated ability, which can only be activated during your Main Phase."},{"card":"","q":"Consider the group of sites below. An oversized minion occupies 1-2-4-5. Maelström is #5. Can the oversized minion be pulled in any way?","a":"Yes. When pulling or pushing an oversized unit, choose a single location the oversized unit occupies (and meets the requirement of the effect), and push/pull from there. So, assuming Sites 2 and 4 are water sites as well, you could choose Site 2: Oversized minion is pulled South, and ends up at 4-5-7-8. OR, choose Site 4: Oversized minion is pulled East, and ends up at 2-3-5-6. OR, choose Site 5: Oversized minion isn't pulled at all."},{"card":"Magellan Globe","q":"If Magellan Globe is in play, can an aura or an oversized unit be cast on the edge of the realm, spanning the realm?","a":"Yes. Ensure that the game state is clear, so all players know which sites the aura occupies, using notes as needed."},{"card":"","q":"What happens if I cast a spell that does grid-based damage?","a":"The grid can span edges of the realm as needed, since they are connected."},{"card":"","q":"Will effects that check 'adjacent' or 'nearby' (e.g. Poison Nova) span edges of the realm?","a":"Yes."},{"card":"","q":"Can projectiles go around the edges of the realm?","a":"Yes, as long as they don't change regions. There are exactly four regions in Sorcery: Surface, Void, Underwater, Underground."},{"card":"","q":"Can I play Earthquake or other similar 2x2 area effects around the edge of the realm with Magellan Globe in play?","a":"Yes."},{"card":"","q":"Can Airborne units in one corner of the realm fly directly to the opposite corner if Magellan Globe is in the realm?","a":"Yes."},{"card":"","q":"If Magellan Globe is in play and an Oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"Since Magellan Globe is an ongoing effect that connects the top and bottom edges, the oversized unit can occupy 2 locations on the top row and 2 locations on the bottom row. Ensure that game state is clear, using notes as needed."},{"card":"","q":"If Magellan Globe leaves play when a card is spanning the edge of the realm, what happens?","a":"Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied. If there's no legal position anywhere in the realm for a minion, it dies. If there's no legal position anywhere in the realm for an avatar, shrink it until there is a legal position (Avatar controller's choice), and place it there."},{"card":"","q":"Are there any other corner cases for Magellan Globe?","a":"I think you mean edge cases! Let us know if you think of any more we should add. In general, apply the golden rule and have fun!"},{"card":"Magician","q":"What if an effect directs me to draw a spell, but it turns out there's a site on top of my spellbook?","a":"All cards in your spellbook are considered spells while in your spellbook, so you can draw it normally."},{"card":"","q":"What if an effect directs me to draw a site?","a":"You have no atlas, and thus any effect that causes you to draw sites will not resolve. You don't draw any cards and you don't lose the game. You cannot choose to draw from your atlas in your start phase."},{"card":"","q":"What if an effect specifies a spell or site from a zone other than my spellbook?","a":"If an effect cares about spell vs. site while the card is outside of your spellbook, you must follow the effect correctly at the moment the effect resolves. Several examples: If resolve Stone Rain, you must honestly state how many sites you have in your hand at that moment. You can partially remove cards from their sleeves and show the back to demonstrate the accurate count to your opponent, or call a judge in a tournament if you have foil cards (or double sleeve your cards with different inner color sleeves in the case of foils). If your opponent plays Pith Imp, you must honestly specify your spells in hand, and randomly select from only those. If your opponent attacks your Wizard's Den for the first time and you don't have any spells in hand, you must honestly demonstrate to your opponent that you only have sites in hand. If you play Sisters of Avalon and have no spells in hand, you must honestly demonstrate to your opponent that you have no spells. After an effect resolves that requires you to reveal the number of spells and sites in your hand, you may then mix up the cards in your hand again so that your opponent doesn't know which cards are spells and which are sites."},{"card":"","q":"Am I required to sleeve my cards, and if so, how should I do it?","a":"You are required to sleeve your cards, and they should all be the same. Cards in your spellbook and collection should be indistinguishable whether they are sites or spells."},{"card":"Makeshift Barricade","q":"If I do 1 damage to three minions simultaneously, does the Barricade break?","a":"Yes, because 1+1+1 = 3 damage dealt all at the same time."},{"card":"Mariner's Curse","q":"What if this is animated by an Enchantress?","a":"If an animated Mariner's Curse moves and enters a water site, it will submerge itself (if possible) and die (assuming it doesn't have Submerge). If it hasn't died, it will then return itself to its owner's hand. It will not have a chance to attack before its effect resolves, because the move happens before the attack."},{"card":"","q":"If I Grapple Shot a minion with Submerge through an area affected by Mariner's Curse, what happens?","a":"When the Grapple Shot projectile hits the unit, the game adds specific movement steps for the ally to the Storyline: Move A (surface) -> B (surface), Move B (surface) -> C (surface). Then, we start resolving those steps. If Mariner's Curse is on site B, once the unit being dragged reaches site B, it will be submerged, and live. Then the game tries to resolve Move B (surface) -> C (surface), which fails, since the unit isn't on the surface of site B anymore. Thus, there's no strike from Grapple Shot since it didn't reach the hit unit's location."},{"card":"","q":"An oversized unit occupies a specific site and then moves. After the move, it still occupies that site. Did it enter the site?","a":"No. It was already there, and remained there (though it may have entered different sites due to its move)."},{"card":"Mask of Mayhem","q":"If I double twice, is it multiplied by 4?","a":"Yes."},{"card":"","q":"What happens if the striking unit and the unit-being-struck are at different locations (e.g. from a unit with the Ranged ability, or Quarrelsome Kobolds)?","a":"The strike occurs at the location of the unit being struck. If the unit being struck is nearby the Mask, they will take double damage."},{"card":"","q":"My minion starts nearby the Mask and thus must attack. During my Move and Attack mandatory action, my minion moves so that it's no longer near the Mask. Do I still have to attack?","a":"No, since you do not actually attack until after moving. If your minion is no longer nearby the Mask, you are not required to attack after moving."},{"card":"Master Tracker","q":"What does it mean to 'permanently lose stealth'?","a":"Simply remove the stealth token. It does not prevent the minion from gaining stealth later."},{"card":"","q":"Once the Master Tracker leaves play, does a future enemy that arrives with Stealth still have stealth?","a":"Yes. But enemies that already lost Stealth won't regain it."},{"card":"Mayor of Milborne","q":"Does this buff my opponent's Mortals as well?","a":"Yes! The Mayor wants as many votes as possible!"},{"card":"Megalurker","q":"Can this Genesis effect drag a minion into a different region?","a":"Yes, due to the golden rule. Because avatars cannot enter non-surface locations, if one is being dragged by this effect they will be dragged as far as they can while staying within the surface region."},{"card":"Megamoeba","q":"If I play Dodge Roll on my Megamoeba, does the attack still go through because the Megamoeba is still occupying the original location?","a":"Yes, the target is still valid, but Megamoeba now has +1 power from the extra location it occupies thanks to Dodge Roll."},{"card":"","q":"If my opponent uses an effect that moves sites (e.g. Atlas Wanderer, Earthquake, etc.), what happens?","a":"Megamoeba moves with the site. Megamoeba is mostly treated a normal size unit for movement effects."},{"card":"","q":"If Megamoeba starts at 2 power, can it move into Gnome Hollows (thus getting to 3 power)?","a":"Yes. First, Megamoeba enters, then it grows in power immediately after entering."},{"card":"","q":"What happens if Megamoeba is the target of Whirling Blades?","a":"The Megamoeba moves 2 steps by extending a pseudopod twice (possibly from two different starting locations), and gains 2 power. Then, it strikes all enemies in the starting and destination locations of the pseudopods that took the steps."},{"card":"","q":"When the Megamoeba is teleported, does its passive ability still apply?","a":"Yes. A single pseudopod enters the teleportation destination, and the Megamoeba can become a single oversized unit that spans non-adjacent squares. The Megamoeba is weird."},{"card":"","q":"What happens if Megamoeba is in a Silence aura?","a":"As soon as it enters the Silence aura, it loses its abilities, but size is considered a characteristic and thus persists. Therefore, it continues to occupy all the locations, but it doesn't get the +1 power per location. It will move like any other oversized unit (albeit potentially strangely shaped)."},{"card":"","q":"Can Megamoeba declare a movement to a location it already occupies? (e.g. if it wanted to move an artifact it was carrying)","a":"Yes. Megamoeba is weird."},{"card":"","q":"What happens when Megamoeba gets pulled / pushed?","a":"Choose a specific location it occupies and pull / push a single pseudopod from there."},{"card":"","q":"If the Megamoeba occupies a site with an enemy, can the Megamoeba take the Move and Attack basic ability to move first, and then attack that original enemy, thus growing in power beforehand?","a":"Yes."},{"card":"","q":"If the Megamoeba occupies a site with an enemy, and the Megamoeba moves to a different site without attacking, can the enemy intercept?","a":"Yes! If Megamoeba uses Move and Attack, then doesn't attack, any enemy that shares a location with them may tap to intercept."},{"card":"","q":"What happens if Megamoeba gains burrow or submerge?","a":"It can occupy both the surface location and the subsurface location on a site, and each occupied location will grant +1 power, per card text. 40 power Megamoeba, here we come!"},{"card":"","q":"What happens if Megamoeba is forcefully burrowed or submerged without the burrow or submerge ability?","a":"If any part of unit occupies an inhospitable location, it dies. So, the Megamoeba would die in this case."},{"card":"","q":"What happens when the Megamoeba gets carried?","a":"It occupied all the locations it was carried through."},{"card":"Mephistopheles","q":"How do I resolve this effect?","a":"If you cast Mephistopheles, your Avatar is banished. Mephistopheles is now your Avatar. He retains Unique rarity, Demon type, and Air element, but he's no longer a minion and only an Avatar. Your current and maximum life remain the same. Notably, you won't be able to play sites normally because Mephistopheles doesn't have that ability. You will still be able to cast spells because Avatars are spellcasters as one of their characteristics. If you manage to summon Mephistopheles without casting him, then he will not replace your avatar, but his second ability will still function."},{"card":"Merlin","q":"How does Merlin's ability work and what does 'any time' actually permit?","a":"This is a passive ability, usable any time on your turn, including during your start phase before you draw a card. But, you may still only cast spells when they are normally permitted to be cast (i.e. during your Main Phase when nothing else is on the storyline other than this ability). Technically, if a Crave Golem were attacking during your Start Phase, Merlin could cast a Dodge Roll then!"},{"card":"Meteor Shower","q":"Can I choose sites that share a corner?","a":"Yes. 'Border' means adjacent squares, not including diagonals."},{"card":"Mimic","q":"How does this ability work?","a":"When you summon Mimic, you can choose to summon it normally, or instead you can choose a carriable artifact anywhere in the realm. That artifact is banished, and the Mimic is placed at the artifact's location instead as it transforms.  You control the Mimic, and if the artifact did not enter the realm this turn, the Mimic doesn't have Summoning Sickness. It turns out that artifact was a Mimic in disguise all along!"},{"card":"Miracle Workers","q":"If multiple minions including Miracle Workers die at the same time on Geistwood, can Miracle Workers return themselves and/or another minion that's dying to your hand?","a":"No, because Miracle Workers only return minions from the cemetery, and deathrites resolve while the minions are still in the realm. The Miracle Workers could return other minions that died earlier that turn and were in the cemetery."},{"card":"Mirage","q":"What happens if I try to use Mirage's alternate play text when it's played via Pathfinder?","a":"When using the Pathfinder's ability, you reveal the site, then play it in an adjacent Rubble or void (then Pathfinder moves there). Mirage's ability cannot be combined with Pathfinder."},{"card":"Mirror Realm","q":"How do Smokestacks of Gnaak and Mirror Realm interact?","a":"By the time Mirror ))Realm(( enters the realm, it's already a copy. Thus, it can copy a nearby site, and then promptly loses all abilities of that copied site (but still is the copy, without abilities). See '((Apply Ongoing Effects In Order))' in the codex for nitty-gritty details."},{"card":"","q":"What if Mirror Realm loses its abilities after it enters play (e.g. Smokestacks of Gnaak is played later)?","a":"Mirror ))Realm(( remains a copy, but any abilities that were printed on the original site are now ignored."},{"card":"","q":"Does Mirror Realm also copy the rarity of the chosen site?","a":"Yes, it's as if you had the exact same card."},{"card":"","q":"Can Mirror Realm copy Rift Valley and enter the realm in the special way, as long as it ends up nearby the Rift Valley that it's copying?","a":"Yes."},{"card":"","q":"What happens if Mirror Realm copies a Rubble?","a":"If Mirror Realm copies a Rubble, you gain no mana. You still control the Rubble, it can be attacked normally, you can play sites adjacent to it, it can be replaced by a site normally, etc. Track it carefully, distinct from other uncontrolled Rubble in the realm."},{"card":"Mismanaged Mortuary","q":"Once this is in play, do I put cards into the cemetery that I own or the cemetery that I control?","a":"You always put your cards into the cemetery you own (the one nearby your deck)."},{"card":"","q":"If I have Wormelow Tump in play, what happens?","a":"The cemeteries are still swapped, and you protect everything in 'your' cemetery (which is really your opponent's)."},{"card":"","q":"If there are an even number of Mismanaged Mortuaries in play, do they cancel out?","a":"Yes."},{"card":"Monstermorphosis","q":"If I transform an enemy minion into a Monster from my hand or Horrible Hybrids from my collection, who controls it?","a":"The controller of the minion does not change when transforming, so in that case your opponent would control it. Note cards always go to their owner's cemetery so when that minion dies it will go to your cemetery."},{"card":"Moonsong Talagelum","q":"Since this 'counts as Grey Wolves' does that mean I can include any number of it in my spellbook?","a":"No. The phrase 'counts as Grey Wolves' means that other cards will see it as being named 'Grey Wolves' in addition to its normal name. You still must follow rarity restrictions."},{"card":"Morgana le Fay","q":"Where do I keep Morgana's hand of cards?","a":"See '((Only It Can Cast))' in the codex."},{"card":"","q":"What happens to Morgana's hand if she is silenced or disabled?","a":"Her hand of cards continues to exist in its own zone, though Morgana can no longer cast those spells without the Spellcaster ability. Since you control Morgana, you can still look at the cards."},{"card":"","q":"What happens my opponent gains control of my Morgana?","a":"Your opponent will be able to have Morgana cast the spells in her hand, assuming they have the mana and appropriate threshold. You can't look at the cards in her hand while you don't control her. Remember that cards always return to their owner's cemetery, hand, or decks when leaving the realm after being played from Morgana's hand, regardless of who controls her."},{"card":"","q":"What happens to Morgana's hand if she is transformed into something else? A frog, for instance?!","a":"If Morgana is transformed, the ongoing effect which created her hand of cards will continue to apply, and the hand will continue to exist. If Morgana's new form does not have the ability to cast spells, she will not be able to cast them, but if she becomes a spellcaster again she will still have access to her hand."},{"card":"Mother Nature","q":"Does 'here' mean Mother Nature's location or site?","a":"'Here' references Mother Nature's exact location."},{"card":"Mount Ussar Sanctuary","q":"When I flee, is it step by step movement or teleportation?","a":"It's step by step movement!"},{"card":"","q":"After fleeing, if I somehow fail to reach the Sanctuary, do I still gain the Ward?","a":"No!"},{"card":"","q":"What path can I choose when resolving this ability?","a":"See ((Moving to a Specific Location Via a Special Ability or Magic)) in the Codex."},{"card":"Mountain Giant","q":"What happens if a Mountain Giant occupies a Silence aura?","a":"A card's size is generally set when it enters the realm, and is considered one of its characteristics, not an ability. It will not resize."},{"card":"","q":"If Polar Explorers or Ruler of Thul are in play and an oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"This ability only allows movement across the borders, not ongoing occupation. Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied."},{"card":"","q":"If Magellan Globe is in play and an Oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"Since Magellan Globe is an ongoing effect that connects the top and bottom edges, the oversized unit can occupy 2 locations on the top row and 2 locations on the bottom row. Ensure that game state is clear, using notes as needed."},{"card":"","q":"If Magellan Globe leaves play when a card is spanning the edge of the realm, what happens?","a":"Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied. If there's no legal position anywhere in the realm for a minion, it dies. If there's no legal position anywhere in the realm for an avatar, shrink it until there is a legal position (Avatar controller's choice), and place it there."},{"card":"Mountain Pass","q":"You have a minion on my Mountain Pass. Can I summon a minion on the site?","a":"Yes. Though summoning is included in 'entering,' it is not moving on the ground. So you can summon all you want, since summoning isn't moving."},{"card":"","q":"Your minion attacks my Mountain Pass. Can my adjacent minion defend?","a":"No, assuming the minion is beginning on the surface of a site and doesn't have the airborne ability.  Because another minion is already on the surface of the Mountain Pass, that location will not be within your minion's range of motion, and so it cannot activate the defend ability."},{"card":"","q":"What does 'enter this site on the ground' mean?","a":"Entering on the ground only covers movement from the surface of another site to the surface of the Mountain Pass, excluding Airborne and teleportation."},{"card":"","q":"I have a minion on my Mountain Pass, and a voidwalk minion on an adjacent square. Can I move from the void to Mountain Pass?","a":"Yes, since moving on the ground requires the unit to start from the surface of a site. Since the void isn't a site, moving from the void to Mountain Pass isn't considered moving on the ground."},{"card":"Mudflow","q":"Once I target the site, do I also pick 'surface' or 'unburrow?'","a":"No, you simply target the site, and then the proper action is applied. If a water site is the target, minions there are surfaced. If a land site is the target, minions there are unburrowed."},{"card":"Mudslide","q":"Do I pick left or right for all units together, or can I choose different directions?","a":"Choose left or right, and apply it to every unit at land sites in the column."},{"card":"","q":"Does this effect span the void?","a":"Yes."},{"card":"Occult Ritual","q":"The alpha, alternate art version of this card from the pledge pack has the text 'Spellcaster nearby,' while the regular foil and non-foil versions have the text 'Spellcaster here.' which is correct?","a":"The normal version is correct. The text should be 'Spellcaster here.' The alternate art version is not legal for tournament play."},{"card":"Old Salt Anchorman","q":"Does this ability protect my minions from movement effects like forceful burrowing (e.g. Bury), submerge (e.g. Drown), and teleportation (e.g. Chaos Twister)?","a":"Yes, all of those effects are movement. With Chaos Twister, don't even attempt to blow the card if the target is an ally nearby Old Salt Anchorman."},{"card":"","q":"Does this ability prevent my opponent from rearranging sites? (e.g. Earthquake, Atlas Wanderers)","a":"No, your opponent can still rearrange sites, because that doesn't count as moving the units, just the sites."},{"card":"Onslaught","q":"How does this Magic work?","a":"Onslaught creates an ongoing effect which lasts the duration of your turn and continually prevents your units from being immobilized, silenced, or disabled. A minion cast after Onslaught resolves would be protected, and would gain +1 power and Charge. Note that Onslaught does not remove any ongoing effects which may be disabling, silencing or immobilizing your units, it just suppresses them for the duration of your turn.  For example, if you play Onslaught and then summon a [[Slumbering Giantess]], her Genesis ability will still resolve, and she will be disabled when the effect of Onslaught wears off. For the duration of your turn, however, she will have +1 power and Charge, and will ignore the disable effect from her Genesis ability."},{"card":"Onyx Core","q":"When does this artifact provide mana?","a":"When it enters the realm, and at the start of its controller's turn."},{"card":"Orb of Ba'al Berith","q":"Is the Orb the spellcaster for the copied spell?","a":"Yes."},{"card":"","q":"If I cast a Magic with X in the cost, does the copy have the same value of X too?","a":"Yes. The Orb copies the spell after costs have been paid, so X is a set value."},{"card":"","q":"If I cast a spell with an additional cost (e.g. Craterize), do I need to pay the additional cost again?","a":"No. The Orb copies the spell after costs have been paid."},{"card":"","q":"Can I target the same site twice when casting two copies of Craterize with Orb?","a":"You technically can, but beware! If the first Craterize successfully destroys the targeted site, the second Craterize will no longer have a valid target in the realm and will fail, resulting in no damage from that copy of Craterize."},{"card":"Order of the White Wing","q":"Does the minion that's being summoned from elsewhere enter the realm for a moment before it's banished?","a":"No, it doesn't ever enter the realm. For example, it will not trigger a Genesis, it will not get a Lance, it will not trigger a Mariner's Curse, etc. It doesn't actually enter the realm at all, since this is a replacement effect."},{"card":"","q":"Does this prevent minions from being cast from other 'hand' zones (e.g. Morgana le Fay, or an Omphalos)?","a":"Yes. The Order prevents minions from being summoned from anywhere except directly from a player's hand."},{"card":"Ormund Harpooneers","q":"Does the target need to be in the same region as the Harpooneers?","a":"No. Normally the answer is yes, but the card text 'above or ((below))' means that normal targeting restrictions are ignored, and the Harpooneers can be in any region (surface, underground, underwater, or in the void). As long as there is an adjacent Water site to the Harpooneers and a minion occupying that water site, it will get pulled to the Harpooneers' location."},{"card":"","q":"Does the 'adjacent Water site' need to be in the same region as the Harpooneers?","a":"No. Because the Water site is not targeted, and because the card text uses 'site' instead of 'location,' the site does not need to be in the same region as the Harpooneers."},{"card":"Orpheus' Crossing","q":"On my turn when I go to Death's Door, can I still take damage and lose life?","a":"Yes. You cannot lose the game due to taking damage, but taking damage and losing life will reduce your life total if possible. See '((Death's Door))' for more details."},{"card":"Pact with the Devil","q":"If a non-minion (e.g. River of Flame, or Orb of Ba'al Berith) is the spellcaster, can I sacrifice it?","a":"Yes!"},{"card":"","q":"Do you round up your life loss, or round up your ending life?","a":"Round up the life loss. For example, if you had 3 life, you'd lose 2, ending up at 1."},{"card":"Panpipes of Pnom","q":"Does this cause a zero power unit to deal 2 damage when striking?","a":"Yes, this effect will cause zero power units to strike for 2 damage."},{"card":"Pathfinder","q":"The alpha and beta text is different, which should I use?","a":"The beta text is correct."},{"card":"","q":"Where does Pathfinder play its first site turn 1?","a":"You must play your first site turn 1 under the Pathfinder per the game rules."},{"card":"","q":"Does Pristine Paradise provide mana the turn the Pathfinder plays it from the atlas? That is, does the site have enough time to make mana before the Pathfinder moves onto it?","a":"Yes, sites immediately generate mana when they come into play."},{"card":"","q":"What happens if I try to use Mirage's alternate play text when it's played via Pathfinder?","a":"When using the Pathfinder's ability, you reveal the site, then play it in an adjacent Rubble or void (then Pathfinder moves there). Mirage's ability cannot be combined with Pathfinder."},{"card":"","q":"If I have no sites but it's not the first turn (e.g. Roots of Yggdrasil destroyed everything) and I use the Pathfinder's ability, am I forced to play the site under the Pathfinder's current location, or could I play the site adjacent?","a":"Since it's not the first turn of the game, you aren't forced to play under yourself. The Pathfinder offers an alternate way to play sites, and thus you could play it adjacent if you wanted."},{"card":"","q":"What happens if I try to use Rift Valley's ability when it's played via Pathfinder?","a":"When using the Pathfinder's ability, you reveal the site, then play it in an adjacent Rubble or void (then Pathfinder moves there). With Rift Valley, you could use its ability to make a void adjacent to Pathfinder, then play it there (and Pathfinder would then move there)."},{"card":"","q":"Can I use this ability even if I'm surrounded by sites, in the hopes that Rift Valley is on top of my atlas?","a":"Yes, you may use the ability. Assuming a normal site (and not Rift Valley) is on top of your atlas, you'll reveal it, do nothing, and then put it back on top of your atlas."},{"card":"","q":"If Pathfinder cannot move to the played site because of some effect (e.g. Sphere of Animosity, Quagmire) can you still play the site?","a":"Yes, you can still play the site to a void or rubble adjacent to the Pathfinder, even if you know you cannot move to it (Sphere of Animosity) or an effect from the played site immediately stops the Pathfinder from being able to move (Quagmire)."},{"card":"","q":"Can I use Ersatz Platz's ability to play a site from my collection?","a":"No, Pathfinder's ability specifies that the site must come from the top of your Atlas."},{"card":"Payload Trebuchet","q":"Do both units need to have been in play for a turn or have charge?","a":"Yes. Summoning sick units can't be tapped to pay costs."},{"card":"Peace Offering","q":"What does 'can't attack you' actually mean?","a":"The other player can't attack anything you control (units or sites)."},{"card":"","q":"If some effect prevents me from giving the Peace Offering to the other player (i.e. King Arthur), can they attack me on their next turn?","a":"No, if the other player does not end up controlling the Peace Offering at least for a moment, you have not successfully given it to them, and they will be free to attack you."},{"card":"","q":"If Peace Offering leaves the realm, does the truce still apply?","a":"Yes, once the Peace Offering has been given to your opponent, they can't attack you next turn, regardless of what happens to the Peace Offering after that."},{"card":"Perilous Bridge","q":"Can a unit be moved through the top border of this site by force?","a":"No, assuming the unit does not have the Airborne ability.  Effects which drag/push/pull a unit cannot cause it to move through the top border of this site while on the ground.  For instance, a non-Airborne minion cannot use  [[Grapple Shot]] to pass through this border, and a [[Pudge Butcher]] cannot pull a non-Airborne unit through it. Teleport effects do not pass through borders, however, and are not considered movement on the ground, so they can allow a unit to ))move(( to a location on the other side."},{"card":"Persecutor","q":"Can I brand an enemy and step toward the closest Evil on the same turn?","a":"No, you must choose only one option each turn."},{"card":"","q":"Can I brand an enemy in a different region, or one with Stealth?","a":"Yes! Branding does not target, and therefore you can choose minions in different regions and/or those with Stealth. This can combo successfully with other cards that care about minions being Evil!"},{"card":"","q":"Can I brand an enemy who can't be modified, e.g. Monks of Kobalsa?","a":"Yes, you can still brand them, and your cards will still treat them as Evil. They aren't actually being modified or becoming Evil; your cards just treat them that way."},{"card":"","q":"If my opponent has a warded minion and I brand it as Evil, does it lose Ward?","a":"No, because only your cards treat it as Evil. Also, branding does not target, so Ward won't break for that reason either."},{"card":"","q":"When determining 'closest Evil,' do I only consider units in my region?","a":"Yes! See '((Closest))' for more details."},{"card":"Phantom Steed","q":"What happens when a minion carries another minion that's carrying a minion?","a":"Only the minions you're directly carrying count against your limit. Have fun at the carnival!"},{"card":"Philosopher's Stone","q":"If I have two (e.g. via Replication), do the effects stack?","a":"Yes."},{"card":"","q":"How does the Philosopher's Stone work with multi-element cards, such as King Arthur and Queen Guienevere? Would King Arthur, who requires 4 mana, cost 3 or 0 Mana to cast using the Stone","a":"Cards that have different element symbols count as a spell of each of those affinities. So Arthur and Guinevere are each an Air spell, an Earth spell, a Fire spell, and a Water spell, all at the same time. But you are still casting them together as a single spell. So, assuming Arthur is your spellcaster's first spell of the turn, the Stone will offer a discount of 1 mana for Arthur, making him cost 3 mana. \n\nThis also means that when Arthur is played he uses up the Stone for that spellcaster's turn because he's simultaneously the first Air, Earth, Fire, and Water spell played this turn. So the Spellcaster cannot continue to use the stone that turn."},{"card":"Pied Piper of Hameln","q":"What happens if a second Pied Piper of Hameln enters play?","a":"You apply each of their abilities in timestamp order. The first Piper takes control of all minions with 1 or less power, then the second Piper will take control of them. The controller of the second Piper will end up controlling all minions with 1 or less power."},{"card":"Pilgrim's Shrine","q":"What happens if the minion which leaves this site can't be warded (e.g. it has a Wa
