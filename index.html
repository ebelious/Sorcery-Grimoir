<script>
const FAQ_DATA=[{"card":"Abaddon Succubus","q":"If I target an adjacent enemy already sharing a location with Abaddon Succubus, does it still take 2 damage and heal me 2?","a":"Yes!"},{"card":"","q":"If the targeted minion takes less than 2 damage (or no damage at all), do I still heal 2?","a":"Yes!"},{"card":"Abundance","q":"Does Abundance apply to my opponent's sites as well?","a":"Yes, they will get the benefit as well, if your Abundance affects their sites!"},{"card":"","q":"When do I get this extra mana?","a":"Mana is added to a player's mana pool during their Start Phase, or when a site enters the realm under their control. So, any sites already in play won't get the extra mana until the start of your next turn. But, if you play Abundance and then play a site into Abundance's area of effect, the newly played site will generate extra mana immediately. Also, if you start your turn with a site in Abundance, and then during your Main Phase the site is no longer in Abundance (e.g. Cloud City moving away, Scorched Earth, etc.), you don't lose the mana that you gained during your Start Phase."},{"card":"","q":"How much mana is generated by playing an Ordinary Tower (e.g. Lone Tower) into Abundance's effect?","a":"3 mana, because 1 (a site entering the realm under your control) + 1 (Abundance) + 1 (Genesis effect) = 3."},{"card":"Abyssal Assault","q":"Can I choose different squares for the damage?","a":"Yes."},{"card":"","q":"Is the damage dealt simultaneously?","a":"Yes. For example, if you have a 5 power Monster, it will deal 1+1+1+1+1, all simultaneously. If you try dealing it to a warded unit, the Ward will prevent all of it. If your opponent has Shield Maidens nearby, each damage will be reduced. If you have Panpipes of Pnom, it will be 2+2+2+2+2 damage instead."},{"card":"Accusation","q":"What does 'cards or allies' mean?","a":"Cards in their hand, or allies in the realm."},{"card":"Adept Illusionist","q":"What does 'shuffle if needed' mean?","a":"If you searched your spellbook, shuffle it. If you end up summoning the extra Illusionist from your hand or cemetery, you may still have searched your spellbook if you wanted."},{"card":"Adtonitum","q":"Does this ability work whenever Adtonitum moves, even if it's my opponent's turn?","a":"Yes, this is a triggered ability, which can trigger on your opponent's turn as well, if Adtonitum moves."},{"card":"Aino","q":"Can Aino step across the top and bottom edges of the realm if she already has Stealth?","a":"Yes."},{"card":"Alabaster Box","q":"Does this need to be carried to have an effect?","a":"Yes, since 'you' or 'your' refers to the controller of the artifact, and carriable artifacts must be carried to be controlled."},{"card":"Algor Omphalos","q":"Must spells cast by the Omphalos match its elements?","a":"Yes. Any spell the Omphalos casts much match at least one of its elements."},{"card":"Altar of Malachai","q":"Does my avatar still take the damage, but I just don't lose the game?","a":"Correct! Damage is still dealt to your avatar for effects that care about dealing damage. You just don't lose the game as a result!"},{"card":"Amethyst Core","q":"When does this artifact provide mana?","a":"When it enters the realm, and at the start of its controller's turn."},{"card":"Amulet of Niniane","q":"What does 'can't be targeted or damaged by magic' mean?","a":"Magic can't target the card and the card can't be damaged by Magic (even without targeting). The card can still be targeted by non-Magic effects."},{"card":"","q":"Can Magic spells which cause an ally to target a unit (e.g. Shatter Strike) select the bearer of Amulet as the target?","a":"Yes, because the ally is doing the targeting, not the Magic spell."},{"card":"Angel Ascendant","q":"If a warded Angel Ascendant fights another minion, the ward will break when the strike happens. So does Angel Ascendant strike for 2 or 3?","a":"It will strike for 3 (with the +1 power from Ward). If the opposing minion somehow struck first (perhaps via a Lance), then the ward would indeed break first and then the Angel Ascendant would only strike back for 2."},{"card":"Animist","q":"If I cast a Magic as a Spirit minion, will Orb of Ba'al Berith copy it?","a":"Good try, but no. You're casting it as a minion, so the game sees it as a Minion spell, not a Magic spell."},{"card":"","q":"If I increase or decrease the cost of a magic while I cast it as a Spirit minion, how much power will it have in the realm?","a":"Use the printed cost of the magic as its power, regardless of how much mana you actually spent to cast it. Note that magics with X as their cost work appropriately, based on the unmodified cost of the spell when you cast it."},{"card":"","q":"If I cast a magic with X as its cost (e.g. Arcane Barrage) as a Spirit minion, will the minion retain the correct power?","a":"Yes, because of the golden rule. If you pay 7 mana for your Arcane Barrage Spirit minion, it will have 7 power while in the realm."},{"card":"","q":"If Selfsame Simulacrum is summoned as a basic copy of an animated magic, what happens?","a":"'Basic copy' refers to the printed characteristics of the card, which means Selfsame will try to become a magic. But magics cannot exist in the realm, so Selfsame Simulacrum would immediately go to the cemetery and there would be no effect of the magic. Sorry!"},{"card":"","q":"If I cast a magic as a Spirit minion, do I still get the effect of the magic?","a":"No. Treat the textbox of the magic as entirely blank, though it retains its elements and rarity. For example, if you cast Craterize as Spirit minion, you do not need to discard a site as an additional cost, and it will be summoned as an 8 power, Elite earth minion."},{"card":"Annual Fair","q":"Can this ability be activated multiple times per turn?","a":"Yes, as long as you pay 1 mana for each time you wish to activate it."},{"card":"","q":"If I pay to gain water affinity, does this count as a water site this turn?","a":"No, activating this ability means the affinity is granted directly to you for the turn, not applied to the site."},{"card":"Apostles of Thamariel","q":"If there are multiple Apostles of Thamariel in play, do I need to track which Apostles go with which Angels?","a":"Yes!"},{"card":"Aquamarine Core","q":"When does this artifact provide mana?","a":"When it enters the realm, and at the start of its controller's turn."},{"card":"Aramos Mercenaries","q":"Do you still need to meet threshold requirements when using its ability?","a":"Yes, since you're still casting it (and not summoning it directly)."},{"card":"Arcade of Bones","q":"What does 'can't be targeted or damaged by magic' mean?","a":"Magic can't target the card and the card can't be damaged by Magic (even without targeting). The card can still be targeted by non-Magic effects."},{"card":"Archangel Michael","q":"If Michael cannot take a step, does he still get to strike?","a":"Yes, but you must declare a legal step if you can, using the normal lookahead rules described in 'Range of Motion.'"},{"card":"Archimago","q":"When I cast one of the banished spells, is that placed back in the cemetery?","a":"No. There's no way back from being banished, which overrides the part of resolution that would place the card in the cemetery."},{"card":"","q":"When I use the Archimago's ability to banish 3 magic spells and cast 1, do I still have to pay mana and meet threshold?","a":"Yes."},{"card":"","q":"When using this ability, must the Archimago be the caster?","a":"No, any of your spellcasters can cast the copied spell."},{"card":"","q":"What happens if I pay the cost of banishing three spells, but I cannot actually cast any of those three?","a":"If you cannot cast any of those three spells, they remain banished and nothing else happens. You did not cast a spell. (If you can cast one of the three, you must.)"},{"card":"","q":"Can I use this ability to cast Valor or Dodge Roll?","a":"No, because the Archimago's ability is an activated ability, which you can only use during your Main Phase when nothing is on the Storyline."},{"card":"Army of the Dead","q":"If the Army moves through many locations (e.g. Grapple Shot, Seven-league Boots), does it leave many Skeletons behind?","a":"Yes! Leave a Skeleton behind each time the Army enters a new location (or takes damage)."},{"card":"Askelon Phoenix","q":"What is 'fire damage' ?","a":"'Fire damage' is any damage from a fire source, such as a fire minion (including strikes), a fire site, or a fire magic. Morgana le Fay casting Lightning Bolt is not fire damage, since Lightning Bolt is an air spell. Apprentice Wizard casting Firebolts is fire damage because Firebolts is a fire magic (and in fact would be 3 separate instances of fire damage). Anyone casting Grapple Shot that sends a minion into the Phoenix will look at the minion making the strike; if it's a fire minion, it's fire damage. If the Phoenix attacks and there are multiple defenders, each defending fire minion that strikes it counts as a separate source of fire damage."},{"card":"Assorted Animals","q":"For purposes of cards that care about the mana cost of spells, what is the mana cost of a spell with X?","a":"If you cast the spell, the mana cost is X. For example, if you cast it for 2 mana, then Immortal Throne would see it as a 2 cost spell. But, if you aren't casting the spell and it's simply in your hand, spellbook, etc., then X is 0 until you actually cast it."},{"card":"Atlantean Fate","q":"Can you play Rift Valley into an area affected by Atlantean Fate?","a":"Yes, since Atlantean Fate only affects the site once it's already in play, and Rift Valley modifies how it's played in the first place."},{"card":"","q":"If one of the sites it occupies is an Ordinary water site, are minions and artifacts there still submerged?","a":"Yes. It's still affected by the aura, but that effect doesn't do anything to Ordinary sites, other than the Genesis ability."},{"card":"Atlas Wanderers","q":"What does 'normal size' mean?","a":"Anything that occupies exactly 1 location."},{"card":"","q":"Does this carry along oversized units or auras that occupy more than one square?","a":"No."},{"card":"Avatar of Water","q":"What does 'your body of water' mean?","a":"The body of water (if any) that your Avatar currently occupies. If the Avatar isn't in any body of water, the ability won't function. (They're a fish out of water!)"},{"card":"","q":"Can you choose an existing water site?","a":"Yes."},{"card":"Awakened Mummies","q":"Am I required to summon these units burrowed?","a":"Yes. You can and you must."},{"card":"","q":"Do they tap when they unburrow?","a":"No."},{"card":"Backstab","q":"Can I target my opponent's minion(s) with Backstab?","a":"Yes (but remember the spellcaster must be in the same region as all the targets)."},{"card":"","q":"If a minion has voidwalk and is in the void, could Backstab move it to an adjacent site to strike a tapped minion there?","a":"No. Your spellcaster must target both minions (which are in different regions), but that's impossible since you pick a single location the spellcaster occupies for casting a spell. You can only target minions in the region where the spell is being cast. See '((Casting Spells))' for more details."},{"card":"Ball Lightning","q":"Is the damage resolved one at a time, after each hit?","a":"Yes! Resolve the damage (and any deathrites) from the first hit, then bounce for the second hit, resolving that damage, then bounce and resolve the third hit."},{"card":"","q":"Can I hit the caster or other allies with this?","a":"At the first location of the projectile's path, it cannot hit allies or the caster, even if it hits an enemy there first. If the Ball Lightning leaves the first location, it could bounce back and hit allies or the caster later in its path."},{"card":"","q":"After bouncing off a unit, does the ball hit them again immediately since they are both at the same starting location?","a":"No. But the ball can hit other units at that location after changing direction, bouncing back and forth."},{"card":"Balor of the Evil Eye","q":"Does this ability damage units at locations in other regions?","a":"Yes, one unit at each location in every square in the cardinal direction chosen! This will include surface and subsurface of sites, as well as the void. Beware the ))evil(( eye!"},{"card":"","q":"If I choose to do 2 damage at one location, do I need to do damage at all the locations in that cardinal direction?","a":"Yes. If you choose to resolve this effect, you must deal 2 damage to one unit at each other location in the chosen direction."},{"card":"Bane of Aventis","q":"How long does this effect last?","a":"When Bane of Aventis' Genesis ability resolves, its controller will gain control of all Warded minions nearby. This change of control is indefinite, and will last even after those minions ))lose(( their Wards."},{"card":"Battlemage","q":"If the Battlemage attacks and kills two enemies in a single fight (if my opponent chose to include multiple defenders), does the Battlemage draw two cards?","a":"Yes."},{"card":"","q":"If the Battlemage activates the 'Move and Attack' ability, doesn't actually attack, and then is intercepted, does that count as 'attacking' the intercepting unit?","a":"No. An interception does not cause an 'attack,' and instead is merely a fight between the unit that used 'Move and Attack' and the unit that intercepted."},{"card":"","q":"If I declare an attack against one target, but then a different enemy defends, does that satisfy this ability?","a":"Yes. An attack was made, and then a minion was killed. As long as your attacking unit used the Move and Attack ability and then got kill credit, this ability is satisfied."},{"card":"","q":"If the Battlemage with a Flaming Sword attacks one enemy, and then another enemy dies as a result of the Flaming Sword, does the Battlemage get to draw a card?","a":"Yes. An attack was made, and then a minion was killed. As long as your attacking unit used the Move and Attack ability and then got kill credit, this ability triggers."},{"card":"Beast of Burden","q":"What happens when a minion carries another minion that's carrying a minion?","a":"Only the minions you're directly carrying count against your limit. Have fun at the carnival!"},{"card":"Bedrock","q":"If my opponent plays an effect that tries to cancel Bedrock in some way (e.g. Atlantean Fate, Smokestacks of Gnaak, etc.), what happens?","a":"Bedrock wins, and is not modified in any way."},{"card":"Begone!","q":"Does this effect target the minion?","a":"No! Therefore, the banished minion can be in a different region and/or have Stealth."},{"card":"Bind Evil","q":"What happens if the minion stops being Evil while under this effect (e.g. due to Persecutor's Brand wearing off, or Saint of Redemption entering play)?","a":"The target only needs to be Evil when the spell is cast and resolves. It will continue to be be disabled, even if it stops being Evil later, until an adjacent Spellcaster taps specifically to release it."},{"card":"Bitter Departed","q":"What if there was more than one killer last turn?","a":"Bitter Departed may teleport to any one of the killers to strike it."},{"card":"Black Cat","q":"How do I resolve this effect?","a":"The first eight times the cat would die, it doesn't instead and fully heals. Track its number of lives in some reasonable way. If it gains a deathrite, it does not trigger on the first eight lives, since it doesn't actually die. If the cat is moved to an inhospitable location, e.g. underground or underwater, the game will notice and try to kill it along with any other minions who should die. The other minion's deathrite effects will resolve first, and they'll go to the cemetery. Then the game will notice the cat should die, and continue trying to kill it until it's actually dead and goes to the cemetery."},{"card":"Black Mass","q":"What order are the cards put on the bottom of my spellbook?","a":"You choose the order for the cards."},{"card":"","q":"Can I reveal fewer than three minions?","a":"Yes! You can reveal up to three different Evil minions from the searched spells and draw them."},{"card":"Blacksmith Family","q":"Are these family cards of Castle Servants, Common Cottagers, Blacksmith Family, and Fisherman's Family considered Air, Earth, Fire, and Water spells, respectively?","a":"Yes. You can see the spell's colored frame matches those elements, so Castle Servants is an Air spell, Common Cottagers is an Earth spell, Blacksmith Family is a Fire spell, and Fisherman's Family is a Water Spell."},{"card":"Bladedancer","q":"How do I resolve this ability?","a":"Fully complete the first attack, including deathrites. Then, Bladedancer must take a step to a different location to be able to attack a new unit (or the same unit if it's oversized and occupies multiple locations). The step cannot be intercepted, but the attack is an actual second attack, following the normal attack sequence."},{"card":"Blasphemy","q":"How do I resolve this effect?","a":"Each minion simultaneously deals 1 damage to its site. Then, starting with the active player and then the non-active player, each minion chooses an artifact at it's location to destroy; you must choose an artifact that hasn't been chosen if possible. Then, all the artifacts are simultaneously destroyed. Finally, all minions tap (and won't untap the next time they normally would)."},{"card":"Blasted Oak","q":"How can I tell if a spell or non-basic ability targets something?","a":"It will use the word 'target.'"},{"card":"","q":"Are random events affected?","a":"No. Something like Lightning Bolt ('Deal 3 damage to a random unit at target location') must target Blasted Oak's location, but then the random result is still determined randomly"},{"card":"","q":"What happens if you have Kythera Mechanism?","a":"When you target, you must follow Blasted Oak's restrictions, but you can still choose random outcomes of your choice if you have Kythera Mechanism."},{"card":"","q":"Does summoning a minion target the location where it's summoned?","a":"No, and therefore Blasted Oak doesn't influence where minions may be summoned."},{"card":"","q":"How does this interact with Chain Lightning?","a":"You must target all the units you can that share Blasted Oak's site, spending as much mana as needed to do so. Once you've targeted all those units, you could additionally target other units, if you had sufficient mana. For reference, Chain Lightning reads: Deal 2 damage to target unit nearby. Any number of times, you may spend 2 mana to additionally target a new unit nearby the previous one."},{"card":"Blaze","q":"What is the proper timing of resolution for this effect?","a":"If the Blazing unit moves and attacks, the proper sequence is to resolve the move, then deal 2 damage at each departed location simultaneously, then resolve the attack."},{"card":"","q":"If the Blazing unit moves over the same location multiple times without stopping, how much damage does Blaze do?","a":"Blaze will still only do 2 damage, since a unit is either along the trail, or not. Each time the Blazing unit stops, it creates a separate trail of fire."},{"card":"","q":"If the Blazing unit dies, does it deal damage where it died?","a":"No. Though it clearly departed its location, it never 'stops,' which is what causes the flame to cause damage. To 'stop,' a unit needs to move first. (Note that if the Blazing unit somehow died while moving, then Blaze would in fact deal damage when the unit died.)"},{"card":"","q":"Is this magic damage?","a":"Yes. The source of the damage is the Blaze spell, not the unit."},{"card":"","q":"If a Blazing Megamoeba moves, does Blaze do damage?","a":"No, since the Megamoeba still occupies the sites and thus never departed."},{"card":"Blaze of Glory","q":"Does the ally die if it didn't take enough damage from the fights to kill it?","a":"No. If the fights with those enemies wouldn't normally kill your ally, your ally will live!"},{"card":"","q":"Can I cast this on my Avatar when my opponent and I are both on Death's Door to win the game?","a":"Yes. Thanks to the golden rule, your avatar will not die until after finishing all of its fights."},{"card":"","q":"What is the proper way to resolve the timing for this spell?","a":"Choose an ally, then declare an enemy near it to fight, putting that fight on the storyline. Resolve the fight, including any deathrite abilities of the enemy, and place it in the cemetery if it died. Then, repeat the process one fight at a time until the chosen ally has fought all nearby enemies. Finally, if your ally took enough damage, it will now die. That is, you declare and resolve each fight before proceeding to the next one. For example, you play Blaze of Glory on your Autumn Unicorn. I have an Estranged Loner, Muddy Pigs, and my Avatar nearby. You choose to fight my avatar first, so I lose 4 life. Then you choose to fight the Estranged Loner. It dies, I summon a Horrible Hybrids, and the Estranged Loner goes to my cemetery. Then you fight the Horrible Hybrids, it dies too, and goes to my cemetery. Then you fight the Muddy Pigs, they die, I gain 3 life, then they go to my cemetery. Finally, your Unicorn has taken enough damage to die, so it would trigger any deathrite abilities now (if it had any), and then go to your cemetery. A Blaze of Glory indeed!"},{"card":"","q":"How do I resolve this effect if control of the minion changes between fights (e.g. it had Infiltrate cast on it earlier)?","a":"If control of the ally changes in the middle of resolving this effect, the units it sees as 'enemies' will change as well.  The caster of Blaze of Glory still chooses the order in which the fights happen. Note that the fights are not optional. For example, I've infiltrated your Autumn Unicorn. You also have a Lugbog Cat and a Skeleton nearby, while I have a Bosk Troll nearby. I cast Blaze of Glory on the Autumn Unicorn. I choose to have it fight your Skeleton first, which breaks stealth, returning control of the Unicorn to you. The Skeleton is removed from the realm. The Unicorn isn't done fighting yet because it still sees an enemy - the Bosk Troll! So the Unicorn fights the Bosk Troll. The Bosk Troll dies and is placed in the cemetery. Then the Unicorn dies and is placed in the cemetery. That is, after each fight, look around and ask 'Are there any nearby enemies I haven't fought yet?' If there is, fight one! Repeat until there are no unfought nearby enemies."},{"card":"Bleeding Skull","q":"Does this need to be carried to have an effect?","a":"Yes, since 'you' or 'your' refers to the controller of the artifact, and carriable artifacts must be carried to be controlled."},{"card":"Blink","q":"Can a disabled unit Blink?","a":"Yes, this is forced movement, not taking a step themselves."},{"card":"","q":"The beta foil version of Blink and Blizzard have their the title, mana cost, and typeline swapped. Is that a misprint?","a":"Yes, this is a misprint. These are not legal for tournament play."},{"card":"Blizzard","q":"The beta foil version of Blink and Blizzard have their the title, mana cost, and typeline swapped. Is that a misprint?","a":"Yes, this is a misprint. These are not legal for tournament play."},{"card":"Blood Mana","q":"Do I still need to meet threshold requirements and pay additional costs, e.g. discarding a site for Craterize?","a":"Yes!"},{"card":"","q":"How does Blood Mana interact with reduced costs?","a":"The same cost you would pay with mana is paid by your life instead."},{"card":"","q":"Can I pay more life than I have? What if I'm on death's door?","a":"You cannot pay more life than you have. If you're on death's door, you won't be able to pay any life and Blood Mana won't help you."},{"card":"","q":"What happens if the next spell I cast is Twist of Fate?","a":"Let's say your life is 16 and my life is 20. Therefore, you cast Twist of Fate for 4 mana, but instead of mana, you pay 4 life. Your life is now 12 and the magic goes onto the Storyline. The magic resolves, swapping our life totals. My life is now 12 and your life is 20. Tricky!"},{"card":"Bodach Bogeyman","q":"How do I resolve this effect?","a":"You may simultaneously pick up from all adjacent locations. Anything picked up is forcefully moved to the Bogeyman's location. Once it arrives, it is disabled."},{"card":"","q":"What happens if the Bogeyman is Silenced or Disabled while carrying enemies?","a":"As per the rules about Carrying Units, if the Bogeyman loses his ability to carry enemies, they will be dropped and no longer carried or disabled themselves."},{"card":"","q":"What happens if the Bogeyman's power is reduced while carrying enemies?","a":"Only check that the enemy is weaker at the time that the Bogeyman targets them with the Pick Up ability. If the Bogeyman loses power or the enemy gains power later, the enemy can still continue to be carried."},{"card":"Boneyard","q":"What is the proper timing of resolution for this effect?","a":"Non-active player chooses a minion. Active player chooses a minion. Both minions enter the realm simultaneously. Then, the non-active player resolves any triggered abilities (like genesis), and finally the active player resolves their triggered abilities."},{"card":"Book of Blessings","q":"If my magic targets my allied minion, does that qualify as 'chooses' for the Book of Blessing?","a":"Yes!"},{"card":"Boulevard of Bones","q":"If Geomancer creates a Rubble adjacent to Boulevard of Bones, do they create a skeleton?","a":"No, the rubble is created in place, not played."},{"card":"Bower of Bliss","q":"How does this effect work?","a":"Cards with the printed Mortal type become Beasts, lose the Mortal type, and are silenced."},{"card":"Brobdingnag Bullfrog","q":"Does the swallowed minion untap? Is it still in the realm? Can it be attacked?","a":"Yes."},{"card":"","q":"How does forced movement affect the minion in the Bullfrog's belly?","a":"Due to the golden rule, only teleportation-based forced movement effects can move the minion out of the Bullfrog's belly; non-teleportation, forced movement effects can't move the swallowed minion away from the Bullfrog. For example,  [[Blink]] or [[Swap]] would allow the minion to escape, but [[River Rapids]], [[Riptide]], or [[Scatter]] would not."},{"card":"","q":"What happens if the Bullfrog is disabled or silenced while carrying a minion?","a":"The Bullfrog's Genesis ability creates an ongoing effect which allows the Bullfrog to continue to carry a minion in its belly, though it cannot Drop that minion or Pick Up another one. Because this comes from an ongoing effect, the Bullfrog being disabled or silenced will not cause the minion to be dropped."},{"card":"","q":"If the swallowed minion is teleported away somehow, does it lose Disabled?","a":"Yes."},{"card":"","q":"Can the Bullfrog choose to drop the minion it swallowed?","a":"No, it can't choose to drop the swallowed minion. (If the swallowed minion is teleported away, it will still be automatically dropped.)"},{"card":"Bureau of Occult Control","q":"How does this effect resolve?","a":"'Access' occurs if a card would leave the collection or cemetery zone, either ))moving(( to another zone (i.e. the realm) or being banished. You may still freely look at your collection and cemetery, and add cards to them. The (2) is paid when the ability which would 'access' cards is put on the storyline, allowing the entire effect access. The Bureau does not increase casting costs; it is a separate cost. It will not be reduced by effects that reduce casting cost (e.g. [[Mix Aer]]), since it's not a casting cost and often there are effects that access without casting anything (e.g. Adept Illusionist, Imposter, etc.) For example, Archimago must pay (2) to activate his ability, even though 3 cards are banished. Similarly, Deathspeaker must pay (2) to use his ability, even if on Death's Door, as this is not an increase to the cost of the ability but a separate cost which must be paid in advance. You may choose not to pay the (2) and resolve the rest of the effect but be unable to access cards from a cemetery or collection. For example, [[Feast for Crows]] may search the other zones and simply not remove any spells from cemetery. [[Adept Illusionist]] may search your spellbook and hand for another copy of itself, but not your cemetery."},{"card":"","q":"When casting a spell from my cemetery that would banish itself after casting (e.g. Ghostfire), can I choose not to pay the extra cost to keep it from banishing itself?","a":"No. You must pay the (2) before even casting the spell, as a separate cost. Once you actually cast it, you resolve the effect normally and your access tax has already been paid."},{"card":"","q":"How does the Bureau interact with Wormelow Tump?","a":"You still have to pay the Bureau tax! The cards themselves are not being affected; a separate cost is being added to allow you to access them."},{"card":"Buried Treasure","q":"Do I get the cards immediately when my minion carrying the treasure moves to the surface, even in the middle of something else (like defending or attacking) ?","a":"Yes! As soon as your unit is on the surface, you resolve the treasure effect."},{"card":"Caelestis","q":"Do I still need to meet threshold and summoning requirements when I cast the spell?","a":"Yes. E.g. It must still be cast to your own site."},{"card":"Cage of Sidrak","q":"What does it mean to 'lock' a minion here, and how does the Cage work?","a":"All minions with 2 or less power are teleported to the Cage and are carried by it. If the Cage moves, the carried minions move with it. While locked in the cage, the minions remain tapped and disabled. If a minion is somehow no longer carried by the Cage, it is free and no longer disabled. If a minion somehow becomes carried by the Cage (e.g. Swap), it is tapped and disabled."},{"card":"","q":"How does forced movement affect minions in the Cage?","a":"Due to the golden rule, only teleportation-based forced movement effects can move minions out of the Cage; non-teleportation, forced movement effects can't move the locked minions away from the Cage. For example, [[Blink]] or [[Swap]] would allow a minion to escape, but [[River Rapids]], [[Riptide]], or [[Scatter]] would not."},{"card":"Candlemas Monks","q":"If these die during my end phase, does their deathrite cause the game to proceed to the next end phase, essentially skipping my opponent's turn?","a":"No, when the deathrite resolves during the end phase it does not cause the game to proceed to the next end phase, as you're already in the end phase."},{"card":"Captain Baldassare","q":"If Captain Baldassare attacks a 3 power minion, killing it but also dying in the process, does the Captain have time to use their ability before they die?","a":"Yes, by a long shot! In fact, Captain Baldassare's trigger happens as soon as the attack is resolving, even before strikes are made. The trigger for Captain's ability and the Captain dying aren't in the same window of time. The ability triggers first."},{"card":"Castle Haunt","q":"If Castle Haunt is summoned to a void, e.g. Lucid Dreamers, how does its ability apply?","a":"It was never summoned to a site, so it's free to roam around the realm! (Unless it was summoned to The Void site, in which case its restriction applies normally!)"},{"card":"","q":"If Castle Haunt leaves its summoning site and doesn't immediately die, what happens?","a":"It's free to roam around the realm! This could happen because the Castle Haunt is silenced or disabled as soon as it leaves its summoning site, or because it survives via a Ward upon leaving. If it ever returns to its summoning site, its ability will apply again if it tries to leave again."},{"card":"Castle Servants","q":"Are these family cards of Castle Servants, Common Cottagers, Blacksmith Family, and Fisherman's Family considered Air, Earth, Fire, and Water spells, respectively?","a":"Yes. You can see the spell's colored frame matches those elements, so Castle Servants is an Air spell, Common Cottagers is an Earth spell, Blacksmith Family is a Fire spell, and Fisherman's Family is a Water Spell."},{"card":"Cerberus in Chains","q":"What does 'your location' mean?","a":"In this case, 'your location' means 'a location that your avatar occupies.'"},{"card":"","q":"What does 'can't move itself away' mean?","a":"Cerberus can't choose to move to a location that is farther from your avatar than its current location. (Count distance using steps that Cerberus would take using its own modes of movement, e.g. Airborne if it gained it somehow.)"},{"card":"","q":"If your avatar occupies a site you don't control, can you summon Cerberus there?","a":"No. The first sentence is an additional restriction on summoning."},{"card":"","q":"How does Cerberus in Chains automatically follow you?","a":"Whenever your avatar enters a new location, Cerberus in Chains teleports to that location."},{"card":"Chain Lightning","q":"Do I pay all the costs and choose all the targets when the spell is cast?","a":"Yes."},{"card":"","q":"Does the damage resolve sequentially or simultaneously?","a":"All targets take the damage simultaneously."},{"card":"","q":"Can I chain the lightning from target A to target B back to target A?","a":"No, that's not what 'new' means. You can only choose new targets that haven't already been targeted by the spell."},{"card":"","q":"Can additional targets be in different regions (as long as they're nearby the previous target)?","a":"No. Being nearby the previous target is an additional targeting restriction, not a loosening of the targeting rules, so all targets must be in the same region as the caster."},{"card":"Chaos Twister","q":"Does the minion teleport to the location where it lands?","a":"Yes. It teleports to the surface of the site (or void, due to the golden rule) where it lands."},{"card":"","q":"What if the minion lands in the void?","a":"It deals no damage (even to itself). Since it's now in the void, it is banished (unless it has Voidwalk)."},{"card":"","q":"What if the minion lands atop two or more sites?","a":"It lands on only a single site, which is the one that it most fully overlaps."},{"card":"","q":"What if I'm using Chaos Twister on a token? Or a really expensive card with triple sleeves?","a":"Feel free to use a stand-in."},{"card":"","q":"Does the minion continue to carry whatever it was carrying?","a":"Yes."},{"card":"","q":"How should I resolve this card in a tournament setting?","a":"This card as-written represents part of our design philosophy for Sorcery. Apply the birthday candle rule, which is that you must blow the card off your hand in a single breath; if you do not, then the effect fails. If the card falls prior to starting to blow, replace it on your hand. Once you start blowing, if the card falls due to anything other than blowing (e.g. hand movement), the effect fails. Call a judge before resolving this card if you're worried, but please be cool and apply the golden rule!"},{"card":"","q":"What if the minion doesn't land in the grid at all?","a":"The teleportation effect doesn't happen and it deals no damage."},{"card":"Chaoswish","q":"Where does the copied spell come from?","a":"It's a copy, which is a token, so you have unlimited copies, as needed. It doesn't come from your hand or your deck or anywhere else. It's a token!"},{"card":"","q":"If I have Kythera Mechanism and keep 'randomly' choosing Chaoswish, can I cast infinite spells?","a":"Specify the number of times you cast Chaoswish, and then proceed with the game. Your opponent will have the chance to copy Chaoswish that number of times!"},{"card":"","q":"How do I generate a random spell?","a":"Click the button on this page!"},{"card":"","q":"Once I cast a random spell, how do I track it during the game?","a":"Be prepared with index cards + pencil, or some other way to track what gets copied! Note that a copy is a token, so once it leaves the realm, it's banished per normal token rules. Magics (and any other copy) won't end up in the cemetery."},{"card":"","q":"What happens if the random spell cannot be cast, e.g. no valid target?","a":"The spell is not cast, and the next player may copy Chaoswish."},{"card":"","q":"What if the random spell has additional costs, e.g. Craterize?","a":"When you cast '((for free)),' you don't pay any additional costs. Have fun!"},{"card":"","q":"Must I choose which of my spellcasters is casting the spell before I know what it is?","a":"Yes."},{"card":"","q":"What happens if I play Courtesan Thaïs and then immediately play Chaoswish on the same turn?","a":"It's still your turn, so your opponent still controls their own choices. They can freely choose to copy Chaoswish or not. On the other hand, if you cast Courtesan Thaïs first, then on your opponent's turn (which you're controlling) you see that they have Chaoswish in hand and you cast it for them, you can keep copying Chaoswish as long as you want; you will decide for yourself and you will decide for them (since you're controlling their turn)."},{"card":"","q":"If my opponent and I keep deciding to copy Chaoswish, what happens?","a":"You have a lot of fun? In a tournament setting, you'll probably hit the round time limit eventually."},{"card":"Char Omphalos","q":"Must spells cast by the Omphalos match its elements?","a":"Yes. Any spell the Omphalos casts much match at least one of its elements."},{"card":"City of Glass","q":"When this is destroyed because it was damaged, who is responsible for the destruction?","a":"The source of the damage is responsible, thanks to the golden rule!  This will trigger effects like [[Vindictive Nation]], and will be prevented by effects like [[Order of the Sacred Oak]]."},{"card":"Clamor of Harpies","q":"What happens if the power of one of the units changes during the resolution of this effect so that it's no longer weaker?","a":"Only check that the target is weaker when it is initially targeted, and when the effect first starts to resolve from the storyline. Once the effect is resolving and minions are moving, it does not matter if the relative powers change after that point."},{"card":"Clay Golem","q":"Is the site played adjacent to the Clay Golem, superseding normal site placement rules?","a":"Yes!"},{"card":"Cloud City","q":"Does this carry along oversized minions or auras that occupy more than one square?","a":"No. If an oversized minion is now occupying the void, it will be banished. (Megamoeba will still move with Cloud City.)"},{"card":"","q":"Does this carry along oversized units or auras that occupy more than one square?","a":"No."},{"card":"Common Cottagers","q":"Are these family cards of Castle Servants, Common Cottagers, Blacksmith Family, and Fisherman's Family considered Air, Earth, Fire, and Water spells, respectively?","a":"Yes. You can see the spell's colored frame matches those elements, so Castle Servants is an Air spell, Common Cottagers is an Earth spell, Blacksmith Family is a Fire spell, and Fisherman's Family is a Water Spell."},{"card":"Cone of Flame","q":"Does Cone of Flame extend across multiple regions?","a":"No, all affected locations must be in the same region as the caster. By default, the damage grid is restricted to the caster's region. If the caster occupies multiple regions (e.g. a oversized unit), pick a single region where you're casting the spell."},{"card":"","q":"All the empty boxes are void and the letters are sites. If the spell is cast from the surface of X, is Z affected?","a":"Yes, because it's the same region as the spell effect, even though it's separated by void."},{"card":"Conqueror Worm","q":"If I control Rubble, can my opponent still play a site there?","a":"Yes, but it might only feed the worm."},{"card":"Consecrate","q":"Who controls the Consecrated Ground that the site transforms into?","a":"Since the site transforms, the controller of the site will not change. Whoever controlled the site that was warded will control the Consecrated Ground. If that site had no controller, no one will control the Consecrated Ground."},{"card":"Consecrated Ground","q":"Does 'has no power here' mean Evil units here have zero power?","a":"Yes. Note that when you strike, you determine your power first, then you determine how much damage you deal. So an Evil minion with a Lance would still strike a unit for 1 damage, because it has 0 power and then gets +1 damage from the Lance. See '((Damage))' for more details."},{"card":"Corpse Explosion","q":"How do I resolve this effect?","a":"Deal face up, one at a time, taking minions from any cemetery. You choose which minions you deal to each site. The dead minions do not actually 'enter' the realm with this effect. Then, damage is dealt simultaneously."},{"card":"Corruptor","q":"Does the type of my minions change everywhere, or just in the realm?","a":"Everywhere!"},{"card":"","q":"Does this ability completely replace their normal type, or simply add a new type?","a":"It adds an additional type. For example, your Mortals are Undead and Mortals and would still be silenced by Bower of Bliss. As another example, your Beasts are Monsters and Beasts, so you would still get the discount from a Pond."},{"card":"Courtesan Thaïs","q":"What does it mean for one player to be controlled by another player?","a":"If you control a player, you see all their cards and make all decisions for them. You still must make legal choices for them. For example, you still cannot force their minion to move into the void (without Voidwalk) or attack themselves."},{"card":"","q":"What happens if there are multiple copies of Courtesan Thaïs played, overlapping each other?","a":"The effects can overlap. They do not add additional turns of control beyond what's specified by card text. For example, Turn 1: Player A plays Courtesan 1. Turn 2: Player B is controlled by Player A due to Courtesan 1's effect, and plays Courtesan 2. Turn 3: Player A is controlled by Player B due to Courtesan 1's effect and Courtesan 2's effect. Turn 4: Player B is controlled by Player A due to Courtesan 2's effect."},{"card":"","q":"The beta foil version has 1 fire threshold and the normal version has 2 fire threshold. Which is correct?","a":"The normal version is correct. You still need 2 fire affinity to cast this minion."},{"card":"","q":"What happens if my turn is skipped via Vaults of Zul and Courtesan Thaïs is affecting me?","a":"If a turn is skipped then there's no actual turn, which means that part of Courtesan Thaïs's effect would wait for that player's next actual turn."},{"card":"","q":"When I control my opponent's turn, can I force them to concede?","a":"No. Stop it."},{"card":"Cradle of Etherrum","q":"Do I still need to meet threshold and summoning requirements when I cast the spell?","a":"Yes. It must be cast during your main phase, to your own site, etc. It's an otherwise normal minion spell being cast, except that it's coming from the top of your library instead of your hand, and costs (1) less."},{"card":"","q":"Is the ability to look at my top spell a passive abililty?","a":"Yes. You may look any time on your turn, including during your Start Phase and End Phase."},{"card":"Craterize","q":"Do I have to choose 'above' or 'below,' or does it damage both automatically?","a":"There is a giant meteor landing in the realm! It damages both above and ((below)) - surface, underwater, and underground!"},{"card":"","q":"All the empty boxes are void and the letters are sites. If the spell is cast from the surface of X, is Z affected?","a":"Yes, because it's the same region as the spell effect, even though it's separated by void."},{"card":"Crave Golem","q":"Can Crave Golem attack itself?","a":"No, per normal attack restrictions (which the Crave Golem respects)."},{"card":"","q":"Does it use normal targeting rules when attacking?","a":"Yes, except that it may attack other allied minions if they happen to be the chosen target. It still cannot attack Airborne or Stealth units unless it gains a special ability that allows it to do so."},{"card":"","q":"How do I properly resolve this ability?","a":"First, identify all the minions that Crave Golem ))can attack(( within its range of motion. If there are one or more such minions: Randomly pick one, then move (if needed), and attack it. This counts as a normal attack and may be defended. For example, if there's one adjacent minion with Airborne and another without Airborne, it will attack the non-Airborne minion 100% of the time (unless Crave Golem somehow gained Airborne). If there are no such minions: Imagine the Crave Golem had unlimited movement. Are there any minions it could attack now? If not, it doesn't move and the ability is over. If so, take one step toward the minion that requires the fewest Crave Golem steps to reach. (Crave Golem's controller's choice if tied.) This movement cannot be intercepted."},{"card":"","q":"Does it tap to take a step or attack?","a":"No."},{"card":"","q":"When it attacks, does the targeted unit strike back?","a":"Yes."},{"card":"","q":"When it attacks, do normal combat rules apply with defending?","a":"Yes."},{"card":"Critical Strike","q":"If I double twice, is it multiplied by 4?","a":"Yes."},{"card":"Crown Prince","q":"If I sacrifice Crown Prince (e.g. Moon Clan Werewolf, Cauldron Crones, etc.), does its deathrite still trigger?","a":"Yes! When you sacrifice something, it dies, and thus triggers deathrite."},{"card":"Crusade","q":"The term 'summon' means 'enter the realm.' So, does that mean I can play minions here for free?","a":"No. This effect simply provides additional locations where you may summon your earth minions."},{"card":"Cursed Land","q":"What happens if my opponent plays a site nearby Cursed Land that would silence it (e.g. Fields of Phyxis, Smokestacks of Gnaak)?","a":"They will not lose life. This is because Cursed Land's ability is a triggered ability, but [[Fields of Phyxis]] and [[Smokestacks of Gnaak]] both have passive abilities which apply ongoing effects, and ongoing effects are applied before triggers."},{"card":"Dank Omphalos","q":"Must spells cast by the Omphalos match its elements?","a":"Yes. Any spell the Omphalos casts much match at least one of its elements."},{"card":"Darkest Dungeon","q":"What path can I choose when resolving this ability?","a":"See ((Moving to a Specific Location Via a Special Ability or Magic)) in the Codex."},{"card":"","q":"What happens if there's no path that can get both the Avatar and the striking unit to the Darkest Dungeon (because of Perilous Bridge, for example)?","a":"If there is no legal path that will get both of the involved units to the Dungeon, there will be no movement put on the storyline, and both units will remain where they are."},{"card":"","q":"What happens if the ally strikes the avatar during a fight, and is killed by the avatar's strike?","a":"If the ally dies as a result of the fight, then you are unable to drag both the ally and the avatar to the Dungeon.  The avatar will not move."},{"card":"Day of Judgment","q":"Can I rotate the cross?","a":"Yes."},{"card":"","q":"Must the cross be entirely within the realm?","a":"Yes. Evil can cower safely in the corners!"},{"card":"","q":"Does this affect multiple regions, such as the void and subsurface as well?","a":"Yes! The card text uses 'affected squares,' which include surface, subsurface, and void."},{"card":"","q":"How do I properly resolve the banish and damage effects?","a":"Banish Evil minions first, resolving effects (if any) as a result of their banishment. Then, damage all units occupying those six squares."},{"card":"De Vermis Mysteriis","q":"Can I modify the cost of (5)?","a":"Yes! If you have Philosopher's Stone and you're playing as Harbinger, you could perhaps cast minions for a mere (3)!"},{"card":"Death Dealer","q":"Does it kill minions everywhere in the realm, even in the void or underground or underwater?","a":"Yes."},{"card":"Deathspeaker","q":"At Death's Door, does the Deathspeaker need to meet the threshold requirements?","a":"Yes. Only the casting cost is reduced to (0)."},{"card":"","q":"Can any of my spellcasters cast a spell and still benefit from my avatar's ability?","a":"Yes! As long as you control the spellcaster, the game sees it as a spell '((you))' cast, meaning the player."},{"card":"","q":"When using the Deathspeaker's ability, do I trigger Deathrite effects (perhaps because the minion is on The Geistwood)?","a":"Normally no, because Deathrite only triggers when the minion dies, and the Deathspeaker's ability banishes the minion. But, if you somehow kill the minion at the same time it enters the realm (e.g. Bottomless Pit), then Deathrite would trigger. The token dies because of Bottomless Pit (interrupting the Deathspeaker's ability), Deathrite resolves, then the token copy is banished like all tokens when it dies."},{"card":"","q":"How does this ability resolve, in detail?","a":"You cast the minion spell. Pay mana, meet threshold, banish it from the cemetery, identify where it will be summoned. The minion enters the the realm. (It is a copy of the banished minion.) 'Enter the ))realm((' effects trigger and resolve. These include: Genesis abilities. Effects like Wayfaring Pilgrim, Giant Shark, Mariner's Curse, Bottomless Pit, etc. See '((Simultaneous Triggers))' in the Codex for more details. The minion is banished. The intent is that the Deathspeaker can speak to the dead, invoke their abilities, and then release them into the afterlife (whatever that may be). See also '((Splitting Events on the Storyline))' and the example with Tawny plus a site's genesis. The Deathspeaker's ability is analogous, since the minion will enter, splitting the Deathspeaker's ability on the Storyline, the genesis ability will resolve (along with any other triggered abilities based on a minion entering the ))realm((), then it will get banished."},{"card":"","q":"When using the Deathspeaker's ability, do Genesis abilities trigger before the banishing effect?","a":"Yes, because events on the storyline are split up when a card enters the realm. See the '((Splitting Events on the Storyline))' codex entry for more details."},{"card":"","q":"Can I cast minions from my opponent's cemetery?","a":"Yes. You control it when it enters the realm, and then it gets banished."},{"card":"Deathwish","q":"What if my current life is higher than my maximum life after this effect resolves?","a":"Your current life is immediately reduced to your maximum life."},{"card":"","q":"If an avatar has an odd maximum life, do they round down after halving it?","a":"Yes."},{"card":"Demonic Contract","q":"What is all of the small text on this card?!","a":"Don't tell me you entered into a contract with a Demon without reading the fine print! The smaller text is all of the rules and stipulations for the casting of this spell!"},{"card":"","q":"What is 'lower' rarity?","a":"The order of rarities (from highest to lowest) is: Unique, Elite, Exceptional, and Ordinary. For example, if you control an Exceptional Demon, you could search for an Exceptional or Ordinary spell."},{"card":"Desecrate","q":"Who controls the Desecrated Ground that the site transforms into?","a":"Since the site transforms, the controller of the site will not change. Whoever controlled the site that was struck will control the Desecrated Ground. If that site had no controller, no one will control the Desecrated Ground."},{"card":"Detonate","q":"If I Detonate a minion with the Lethal ability, is the damage from Detonate Lethal?","a":"No, the source of the damage is the Detonate spell itself, not the exploding minion."},{"card":"","q":"What if I choose a Warded minion to destroy?","a":"The Ward breaks instead of the minion being destroyed, but there's still an explosion. After the ward breaks (protecting the minion from the destruction effect), it will still take 3 damage along with the other units at its location."},{"card":"Dhol Chants","q":"Can you tap minions with summoning sickness for this effect?","a":"Yes, it's part of the effect of the spell, not strictly a cost being paid, so you can tap your allies that have summoning sickness for this effect.  Note that only untapped units can be tapped, however."},{"card":"Displace","q":"Can this teleport a minion or artifact from a site to the void?","a":"No. The location the minion or artifact teleports to must be one diagonal step away from where it started, and steps are only measured within the same region. A minion or artifact starting at a surface location can only be teleported to another surface location, for example."},{"card":"","q":"Can this teleport an aura from a site to the void?","a":"Yes! When moving auras, you ignore the regional boundaries between surface and void locations."},{"card":"Divine Intervention","q":"Does this count as healing?","a":"No, this removes Death's Door and then sets your life to 1."},{"card":"","q":"What if I cast this while my life is higher than 1?","a":"You set your life to 1."},{"card":"Divine Lance","q":"If I break two allied Wards to increase the damage, will it be three instances of 1 damage each, or 3 damage once?","a":"Three damage once."},{"card":"Dodge Roll","q":"If Dodge Roll's mana cost is increased (e.g. Maddening Bells), can you cast it on your opponent's turn?","a":"No, because you don't have any mana available on your opponent's turn."},{"card":"Dome of Osiros","q":"If a minion here is attacked what happens?","a":"It's not possible to declare an attack against a minion here. If you attack an avatar here and a minion defends, the minion becomes a legal target, per the Defend rules."},{"card":"","q":"Does this site protect minions from cards with the word 'attack' in their name, like Leap Attack or Spin Attack?","a":"No. Dome of Osiros only prevents 'attacks' from the Move and Attack basic ability, or other card text that uses the word 'attack' (e.g. Crave Golem)."},{"card":"Dormant Monstrosity","q":"When counting 'each unit,' do I include all adjacent squares?","a":"Yes! Count any unit in any square adjacent to the summoning square (including the summoning square itself). Each unit counts once, regardless of how many adjacent squares it occupies."},{"card":"Dragonlord","q":"When do I choose my set aside Dragon? Can it change during a tournament?","a":"You must select your set aside Dragon 'before setup,' which means during deckbuilding. You cannot change it during a tournament. The Dragonlord is loyal to his champion and would not be so fickle!"},{"card":"","q":"Can my spellbook include a copy of my set aside Unique Dragon?","a":"Yes! The set aside Dragon is intended as a rules reference for both players. You may use a suitable substitute for the set aside Dragon, if needed."},{"card":"","q":"When the Dragonlord gains the abilities of the set aside Dragon, does the Dragonlord gain its power as well?","a":"No, power is a characteristic, not an ability. The Dragonlord will only gain the abilities printed in the text box."},{"card":"","q":"Can the Dragonlord gain Stealth?","a":"No. Avatars cannot gain Stealth."},{"card":"","q":"If the Dragonlord gains Voidwalk, Burrowing, or Submerge, may it enter other regions?","a":"No. Avatars cannot enter any region other than the surface."},{"card":"","q":"If the Dragonlord gains Ignis Rex's ability, is that considered fire damage? Same question for Adtonitum and air damage?","a":"Yes! If the Dragonlord gains Ignis Rex's ability and then discards a fire card, the Dragonlord will deal fire damage. Same answer for Adtonitum and air damage."},{"card":"Dread Thicket","q":"What does 'attack out of this site' mean?","a":"Take exactly one step away from the site, then attack. It doesn't matter if the unit took steps before entering the Dread Thicket, merely that they take exactly one step away from the Thicket and then attack."},{"card":"Dreadwing","q":"Does this strike my avatar even if I summon it somewhere else?","a":"Yes, Dreadwing will strike your avatar even if they don't share a location when its Genesis resolves."},{"card":"Dream-Quest","q":"Can I cast this on my Avatar, since they are a spellcaster?","a":"Your avatar can't be disabled per their characteristics. Thus, they won't be able to go to sleep, and therefore won't be able to wake up. If you cast this on your Avatar, it will have no effect."},{"card":"","q":"Using Dream-Quest, can I put to sleep one of my non-minion Spellcasters (e.g. Omphalos, River of Flame) or a spellcaster with restrictions (e.g. Earl of the Ivory Towers, Wind Sylph)?","a":"Yes! An Omphalos will be disabled and thus not draw a spell that turn, but it cannot be hurt unless it's animated. Assuming it is not hurt, you may wake it up at the start of your next turn. For a site (e.g. River of Flame), it provides no Threshold while disabled, but it will wake up in time to produce mana next turn, due to the order of resolution in the Start Phase."},{"card":"Driftwood Marrows","q":"How does this ability work?","a":"Allies which are nearby to the Marrows, including themselves, can't be forcibly submerged, e.g. ((Atlantean Fate)), ((Drown)), ((Call of the Sea)), etc. Nearby allies can still choose to submerge when taking their own steps via their own submerge ability."},{"card":"Drought","q":"Can Floodplain still flood a site affected by Drought?","a":"Yes. See '((Example - Flood vs. Drought))' in the codex."},{"card":"","q":"How do Drought and Flood interact?","a":"See '((Example - Flood vs. Drought))' in the codex."},{"card":"Druid","q":"What is the updated text for the front of the Druid?","a":"Tap -> Play or draw a site. If this is your first turn, summon Tawny here. Tap -> Summon Bruin here. Flip this card."},{"card":"","q":"Does the Druid's flip side ability work with Poisonous Dagger?","a":"No. The site itself gains the ability and is doing the damage."},{"card":"","q":"Can the Druid's flip side ability give the Druid kill credit?","a":"No. Only units can get kill credit, and the site is source of the damage. The triggered ability is the site's ability, not the Druid's. See the '((kill credit))' codex entry for more details."},{"card":"","q":"If a site loses its abilities, does the Druid's flip side ability still apply? Can this affect Bedrock?","a":"No. The Druid grants an ability to the site. If the site is silenced (or can't be modified in the case of Bedrock), then it loses the ability and will not deal damage."},{"card":"Drums of Doom","q":"I strike your minion, which is nearby the Drums. Then, you redirect the damage to a bodyguard (e.g. Royal Bodyguard, Sir Gawain), who is not nearby the Drums. Does your bodyguard take lethal damage?","a":"No. If the minion actually being damaged is not near the Drums, the damage is not Lethal."},{"card":"Duplicator","q":"How does this ability impact my collection?","a":"You may include any cards you wish in your collection, following normal deckbuilding rules. If you have 0 copies of a unique card in your deck, you may include 1 ))copy(( in your collection. If you have 2 copies of a unique card in your deck, you cannot include any copies in your collection."},{"card":"Dwarven Digging Team","q":"If I have Dwarven Digging Team in play, can I choose to summon minions underground without a printed Burrowing ability?","a":"No. The units don't gain Burrowing until they're at nearby sites, and you must choose the summoning location when you cast the spell. When you cast the minion spell, it doesn't have burrowing yet, and thus you cannot pick an underground location."},{"card":"Earthquake","q":"What does 'normal size' mean?","a":"Anything that occupies exactly 1 location."},{"card":"","q":"Does this carry along oversized units or auras that occupy more than one square?","a":"No."},{"card":"","q":"If the 2x2 area includes some sites and some void, can you rearrange the sites into the void squares?","a":"No. You can rearrange sites with other sites as you wish, but the void squares must remain the same."},{"card":"East-West Dragon","q":"Does diagonal movement include 'sideways' movement?","a":"No."},{"card":"Edge of the World","q":"What happens if Edge of the World's ability is lost (e.g. Smokestacks of Gnaak), then Edge of the World gets surrounded by sites, then its ability is regained (e.g. Smokestacks of Gnaak moves away)?","a":"In this rare case, Edge of the World would destroy itself."},{"card":"","q":"What happens if an effect causes edge of the world to not be adjacent to the void?","a":"The effect does not resolve. Examples:\nIf you try to move Cloud City to the only void square adjacent to Edge of the World, Cloud City won't move.\nIf you try to play a site from your hand, it won't work and your site will remain in your hand.\nIf you use Earthquake to rearrange sites in a way that Edge of the World isn't adjacent to void, the entire rearrangement fails (and then you still try to burrow.)\nIf you have two Magellan Globes in play at the same location and they're the only thing keeping Edge of the World adjacent to void and they are Dispelled, one is destroyed and other isn't."},{"card":"Enchantress","q":"Turning auras into minions!? Is this real?","a":"Yes, indeed. Enchantress is a very versatile Avatar, and one that twists the rules to create very interesting games. Be sure to check these FAQs as well as the auras you're looking to animate. Since many auras occupy a 2x2 area in the realm, you may want to learn about oversized units as well."},{"card":"","q":"What is the proper timing of resolution for this effect?","a":"Whenever you cast a spell, before that spell resolves, but after targets are specified. See the 'storyline' entry for more details."},{"card":"","q":"Can you animate your opponent's auras?","a":"Yes, as long as you can target them (i.e. they are in the same region as the Enchantress). Your opponent still controls the aura minion."},{"card":"","q":"Can any of my spellcasters cast a spell and still benefit from my avatar's ability?","a":"Yes! As long as you control the spellcaster, the game sees it as a spell '((you))' cast, meaning the player."},{"card":"","q":"Do animated aura change size?","a":"No."},{"card":"","q":"If Polar Explorers or Ruler of Thul are in play and an oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"This ability only allows movement across the borders, not ongoing occupation. Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied."},{"card":"","q":"If Magellan Globe is in play and an Oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"Since Magellan Globe is an ongoing effect that connects the top and bottom edges, the oversized unit can occupy 2 locations on the top row and 2 locations on the bottom row. Ensure that game state is clear, using notes as needed."},{"card":"","q":"If Magellan Globe leaves play when a card is spanning the edge of the realm, what happens?","a":"Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied. If there's no legal position anywhere in the realm for a minion, it dies. If there's no legal position anywhere in the realm for an avatar, shrink it until there is a legal position (Avatar controller's choice), and place it there."},{"card":"Entangle Terrain","q":"Does this affect subsurface units, as well as surface?","a":"Yes, since it doesn't say 'atop.' Note that it doesn't affect minions in the void, since the void isn't a site."},{"card":"Erik's Curiosa","q":"Do I really have to rip it to pieces?","a":"Please see the golden rule! The point is to actually, literally rip the card up, so it will never be playable again. It is banished after you rip it."},{"card":"","q":"How does this work in a tournament, especially in best of 1 games, when I rip this?","a":"See the rules for that specific tournament, but by default the card is playable. Tournament organizers have latitude to set rules for their events, but one reasonable approach is that you use a deck missing one card for the rest of the tournament (and it's legal to do so)."},{"card":"","q":"If my opponent gains control of my Erik's Curiosa and then they rip it, who gets to pick the card?","a":"They get a card of the controller's choice from the controller's collection (so they get to pick). Hopefully you can still be friends! (They must give you a moment to concede before they rip it.)"},{"card":"","q":"Does this effect let me break the normal restrictions on deck legality? e.g. duplicate Unique card, or duplicate any site for Pathfinder?","a":"The card limits exist only when the game starts; once the game begins, various effects can change your deck composition. So, yes, you are free to get an extra copy of a Unique card via Erik's Curiosa, as long as the card is actually in your collection."},{"card":"Ersatz Platz","q":"How do I resolve this effect?","a":"When you would use your avatar's ability (or another ability to play sites without restriction), you may choose to play that site from your collection and banish Ersatz Platz."},{"card":"Ether Core","q":"Must one of my units carry this to gain the mana?","a":"Yes! If no one is carrying it, it isn't controlled by you. Without a controller, the Ether Core provides mana to no one. Remember that carriable artifacts must be carried to be controlled!"},{"card":"Evil Presence","q":"The term 'summon' means 'enter the realm.' So, does that mean I can play minions here for free?","a":"No. This effect simply provides additional locations where you may summon your minions."},{"card":"Evil Twin","q":"Can I summon Evil Twin to a non-surface location if it will be copying a minion that has the appropriate ability (e.g. summon to an underground location while copying a Root Spider)?","a":"No. The Evil Twin only gains the abilities as enters the realm, and you must declare its summoning location at the time you cast it, before it enters."},{"card":"Failed Mutation","q":"What does 'can't be targeted or damaged by magic' mean?","a":"Magic can't target the card and the card can't be damaged by Magic (even without targeting). The card can still be targeted by non-Magic effects."},{"card":"Faith Incarnate","q":"Does this effect count all wards in the realm, or only ones I control?","a":"It counts all wards in the realm, on any unit or site!"},{"card":"Falling Star","q":"What does 'When the star falls' mean?","a":"At the end of each of your turns, during step 1 of the end phase, add a counter to Falling Star. When you add the third counter, you immediately summon a minion and resolve the rest of this effect, then dispel Falling Star."},{"card":"","q":"If my summoned minion has a genesis effect, does the genesis resolve before the strike?","a":"Yes, resolve the genesis first, including any deathrites. Then, the 'strike each other unit' effect resolves."},{"card":"","q":"Are the strikes against other units all simultaneous?","a":"Yes."},{"card":"","q":"How does this resolve if I summon an oversized minion?","a":"At least one of the summoning sites must include an affected site. The 'strike each other unit where it lands' effect occurs on one affected site of your choice (that the summoned minion occupies)."},{"card":"False Idol","q":"Do I draw a spell if my opponent's minion enters the realm tapped?","a":"No. This ability only triggers when a minion goes from being untapped to tapped while nearby the Idol."},{"card":"Far East Assassin","q":"When you use the ability, what happens to the 'thrown' artifact?","a":"It is no longer carried by the Assassin, and is uncontrolled in the target's location. Any unit may pick it up normally (including the Assassin, if it happens to be in that location)."},{"card":"","q":"Does the Assassin lose Stealth if it uses its ability?","a":"Yes. It's an activated special ability, so Stealth is lost per the normal Stealth rules."},{"card":"Feign Death","q":"If I choose a minion that has no Deathrite ability, does it still gain stealth?","a":"Yes, it will still gain stealth."},{"card":"Fey Changeling","q":"Can this be summoned to an inhospitable location (e.g. underground) and die, but still have a chance to use its genesis ability first?","a":"No. You cannot choose to summon a minion underground, underwater, or in the void unless it has the appropriate ability."},{"card":"","q":"The term 'summon' means 'enter the realm.' So, does that mean I can play this minion for free?","a":"No. This effect simply provides additional locations where you may summon this minion."},{"card":"Fields of Camlann","q":"What is the proper timing of resolution for this effect?","a":"The non-active player chooses a minion, then the active player chooses a minion. Then all other minions are killed. The non-active player resolves any triggered abilities (like deathrite), and finally the active player resolves their triggered abilities."},{"card":"Fire Harpoons!","q":"Does the 'adjacent Water site' need to be in the same region as the caster?","a":"No. Because the Water site is not targeted, and because the card text uses 'site' instead of 'location,' the site does not need to be in the same region as the caster."},{"card":"","q":"Can I cast this spell without a target just to draw a card?","a":"No. To cast a spell, you must specify all targets."},{"card":"","q":"Does the target need to be in the same region as the caster?","a":"No. Normally the answer is yes, but the card text 'above or ((below))' means that normal targeting restrictions are ignored, and the caster can be in any region (surface, underground, underwater, or in the void). As long as there is an adjacent Water site to the caster and a minion occupying that water site, it will get pulled to the caster's location."},{"card":"Firebolts","q":"What does 'one at a time' mean?","a":"Resolve the first bolt (including any deathrite or other 'kills' abilities), then resolve the next one, then resolve the 3rd one. Each bolt must go in the same direction."},{"card":"Fisherman's Family","q":"Are these family cards of Castle Servants, Common Cottagers, Blacksmith Family, and Fisherman's Family considered Air, Earth, Fire, and Water spells, respectively?","a":"Yes. You can see the spell's colored frame matches those elements, so Castle Servants is an Air spell, Common Cottagers is an Earth spell, Blacksmith Family is a Fire spell, and Fisherman's Family is a Water Spell."},{"card":"Flagellant","q":"If damage is prevented, do I still heal?","a":"No. Flagellant must actually take 1 or more damage for you to heal."},{"card":"","q":"If Flagellant takes 5 damage, do I heal more than 1?","a":"No, just 1. But if Flagellant took 1 damage separately five times, e.g. Abyssal Assault or Arcane Barrage, you would heal 5."},{"card":"Flame of the First Ones","q":"What is a 'new site'?","a":"A site where this card has not stopped since entering the realm."},{"card":"","q":"Does conjuring this into the realm count as 'stopping'?","a":"No, something must move in order to stop, and conjuring something into the realm is not movement. To trigger, the Flame has to move from one location to another."},{"card":"Flame Wave","q":"Can the grid pattern be flipped horizontally?","a":"Yes. You pick the leftmost or rightmost column, and that is where the Flame Wave starts."},{"card":"","q":"Can the grid pattern be rotated 90 degrees?","a":"No."},{"card":"Flamecaller","q":"Is the projectile considered fire damage?","a":"Yes."},{"card":"Flaming Sword","q":"If the attack damage was increased or decreased, does the splash damage include the change?","a":"Yes. For example, Critical Strike will splash double damage."},{"card":"","q":"If a unit has two Flaming Swords, do they each splash damage?","a":"Yes. Have fun dual wielding!"},{"card":"","q":"Is the splash damage a strike?","a":"No. It's damage done by the sword artifact."},{"card":"","q":"Does the splash damage occur whenever the unit strikes?","a":"Yes. For example, that includes Grapple Shot or other strikes, not just attacks from the Move and Attack basic ability."},{"card":"","q":"If the struck unit isn't an enemy, is any damage splashed?","a":"No. If there's no 'struck unit,' then it has no location. Also, there are no 'other enemies' when there's no enemy initially. See '((enemy))' in the codex."},{"card":"","q":"If the Battlemage with a Flaming Sword attacks one enemy, and then another enemy dies as a result of the Flaming Sword, does the Battlemage get to draw a card?","a":"Yes. An attack was made, and then a minion was killed. As long as your attacking unit used the Move and Attack ability and then got kill credit, this ability triggers."},{"card":"Flanking Maneuver","q":"Do the locations need to be in the same region?","a":"No. Teleport effects ignore regional boundaries unless otherwise specified, and the only restriction on this effect is that the locations be a chess knight's move apart on the board. For example, if A is a void square, and B contains a site, Flanking Maneuver can move units from that void location to either the surface or subsurface of the site."},{"card":"Flood","q":"How do Drought and Flood interact?","a":"See '((Example - Flood vs. Drought))' in the codex."},{"card":"Floodplain","q":"Can Floodplain still flood a site affected by Drought?","a":"Yes. See '((Example - Flood vs. Drought))' in the codex."},{"card":"","q":"Can I use Floodplain before Maelström triggers?","a":"No. Floodplain is an activated ability, which can only be activated during your Main Phase."},{"card":"Forsaken","q":"Can I cast this onto my opponent's site in an outer column?","a":"No, this is an additional casting restriction; it does not allow you to summon Forsaken to locations you normally could not."},{"card":"Free City","q":"Can my Free City be struck by opposing units, and if so, will it take damage?","a":"Yes, it can be struck, and any strike damage to your Free City will cause your avatar to ))lose(( the same amount of life."},{"card":"","q":"How do the strikes work?","a":"Normally, only units can strike, but card text allows the Free City site to strike as if it were a unit with 3 power."},{"card":"","q":"Can Free City die?","a":"It's striking as if it were a unit, but it's still a site. Therefore, it won't die due to damage. It can still be destroyed by a specific destruction effect (e.g. Sinkhole), but it won't die due to taking damage."},{"card":"","q":"When can it attack?","a":"Free City's ability is a passive ability that gives it the option to attack and defend 'normally' once per turn, as if it were a 3 power unit (while actually remaining a site). Therefore, it can only attack on your turn, and defend (presumably on your opponent's turn) when a unit or Free City itself is attacked by an enemy unit occupying Free City. If Free City would somehow have the chance to both attack AND defend on your turn, it can only do one."},{"card":"","q":"What can it attack?","a":"The key word is 'here.' Clearly burrowed units are 'here.' Airborne and Stealthed units are also 'here.' But, to attack Airborne or Stealth, a unit needs some special ability (e.g. Airborne, Ranged, etc.) Since Free City doesn't have those abilities, it can't actually target Airborne or Stealthed units with an attack."},{"card":"","q":"How does the attack work?","a":"Since the ability to attack is granted by a card effect and not a basic ability, no tapping is needed, but it's still an attack. Therefore, players may declare defenders for the attack normally."},{"card":"","q":"Can Free City attack the turn it enters play?","a":"Yes, because only minions are subject to summoning sickness."},{"card":"","q":"If an oversized unit occupies Free City while it attacks a different site, can Free City defend against that attack?","a":"No, since the attack is not happening on Free City."},{"card":"Frontier Settlers","q":"Can Frontier Settlers play a site that isn't adjacent to your other sites?","a":"Yes."},{"card":"Frozen Horror","q":"If I activate this ability and then move a minion nearby the Horror, does the minion become disabled?","a":"No. This ability disables minions that are nearby the Horror when the ability is activated. A minion moving nearby after that moment will not be disabled."},{"card":"Garden of Eden","q":"Does this affect spells drawn by things like Morgana le Fay and the Omphaloi?","a":"Yes.  Though those cards end up in another zone, they count as being drawn by the player, and will count against the one spell that can be drawn per turn.   For example, if a player draws a site at the start of their turn and then plays [[Morgana le Fay]], Morgana will only draw 1 spell into her hand, resulting in a total of only 1 spell drawn by that player that turn.  See the Only It Can Cast entry for more information."},{"card":"Gargantula","q":"Does tapping to free a trapped minion count as interacting with the realm?","a":"Yes, tapping to free a minion from its cocoon is activating a special ability, and counts as interacting with the realm."},{"card":"","q":"If the minion is not dragged to Gargantula's location, does it still get disabled? What if the minion is already at Gargantula's location?","a":"Gargantula must be at the same location as the minion to wrap it in her web, so if the minion cannot be dragged there it will not be disabled. However, if it already shares a location with Gargantula, she will cocoon it."},{"card":"Geomancer","q":"When I play an Earth site using the second ability, do I also place a rubble in an adjacent void?","a":"No. You only place a rubble if you play an Earth site using the first ability."},{"card":"","q":"When I play an Earth site using the first ability, where does the rubble appear?","a":"The rubble must be placed ad
