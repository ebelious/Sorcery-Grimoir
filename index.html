rd already or it's Evil)?","a":"The Ward remains on the site, as it cannot be transferred."},{"card":"Pillar of Zeiros","q":"How does this interact with effects which modify healing (e.g. River of Blood)?","a":"You banish all dead minions, count them, and then heal once for a total amount equal to the number of dead minions which were banished. [[River of Blood]] would halve, rounding down, that final total."},{"card":"Pith Imp","q":"Where does the stolen spell go?","a":"It goes to a separate zone as if the Pith Imp was carrying the spell; it does not go to your hand. You may look at the spell and your opponent may not (though they do get to see the spell at the moment you steal it)."},{"card":"","q":"If Pith Imp somehow gains Spellcaster, can it pretty please cast the spell it stole?","a":"Yes, that does seem fun!"},{"card":"Plague of Frogs","q":"Where can I summon the frogs?","a":"You can summon each of them to whatever locations will cause maximum annoyance."},{"card":"Polar Explorers","q":"If Polar Explorers or Ruler of Thul are in play and an oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"This ability only allows movement across the borders, not ongoing occupation. Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied."},{"card":"Pollimorph","q":"Does a pollimorphed animated aura (e.g. Enchantress) return to an aura form later?","a":"No. It is permanently a Frog token, and occupies a single location."},{"card":"","q":"If the original minion occupied more than one location, what happens?","a":"The controller of the transformation effect chooses which location the Frog token occupies."},{"card":"Pristine Paradise","q":"Does Pristine Paradise provide mana the turn the Pathfinder plays it from the atlas? That is, does the site have enough time to make mana before the Pathfinder moves onto it?","a":"Yes, sites immediately generate mana when they come into play."},{"card":"Quagmire","q":"If the genesis resolves, and then my opponent plays Smokestacks of Gnaak nearby, does the Quagmire effect continue?","a":"Yes. The genesis ability creates an effect that lasts until the start of your next turn."},{"card":"Queen Guinevere","q":"How does the Philosopher's Stone work with multi-element cards, such as King Arthur and Queen Guienevere? Would King Arthur, who requires 4 mana, cost 3 or 0 Mana to cast using the Stone","a":"Cards that have different element symbols count as a spell of each of those affinities. So Arthur and Guinevere are each an Air spell, an Earth spell, a Fire spell, and a Water spell, all at the same time. But you are still casting them together as a single spell. So, assuming Arthur is your spellcaster's first spell of the turn, the Stone will offer a discount of 1 mana for Arthur, making him cost 3 mana. \n\nThis also means that when Arthur is played he uses up the Stone for that spellcaster's turn because he's simultaneously the first Air, Earth, Fire, and Water spell played this turn. So the Spellcaster cannot continue to use the stone that turn."},{"card":"Questing Beast","q":"Does this end of turn ability cause the Beast to lose stealth?","a":"No, as it is a triggered ability it does not cause the Beast to interact with the realm."},{"card":"Raise Dead","q":"Where can I summon the raised minion?","a":"After randomly determining the dead minion, you may summon it anywhere."},{"card":"Raze","q":"Does this destroy artifacts underneath the site, or just ones on the surface?","a":"Artifacts both above and below the site are destroyed."},{"card":"Realm-Eater","q":"How does this ability work?","a":"Whenever ))Realm-Eater(( attacks a site and strikes it, that site is destroyed and the ))Realm-Eater(( gains an ongoing effect causing it to be immobile. You can activate ))Realm-Eater's(( digest ability to remove one instance of this immobilizing effect, but if you have attacked and destroyed multiple sites you must digest each one."},{"card":"Red Rock of Ravannis","q":"What does 'Artifacts can't be carried here' mean?","a":"Artifacts which share a location with the Red Rock are no longer carried. They are not dropped, they just stop being carried, so the effect will still apply to artifacts which cannot be dropped. These artifacts also cannot be targeted by the Pick Up ability."},{"card":"","q":"How is this resolved if either the artifact or the bearer cannot be pulled?","a":"If the bearer of the artifact cannot be pulled, but the artifact can, the Red Rock pulls the artifact out of the bearer's hands. If the artifact cannot be pulled, neither the bearer nor the artifact are pulled."},{"card":"Redmane Hyena","q":"Does the Hyena stop being a Beast if it becomes a Demon?","a":"No, it will be both a Demon and a Beast."},{"card":"Regurgitator","q":"How does this ability work?","a":"If the Regurgitator has an empty belly and there are any dead minions, you must fill its belly by banishing one. If it has a full belly, you must empty it by shooting a projectile. If it has an empty belly and there are no dead minions, nothing happens."},{"card":"Release the Hounds","q":"Can I play this with only one Hellhound in my collection?","a":"Yes. You will only summon that one [[Hellhound]]."},{"card":"Replication","q":"Where can I conjure the copy?","a":"You can conjure it anywhere."},{"card":"Rhongomyniad","q":"How does this work?","a":"After the throw, Rhongomyniad is in the final location along its path, and is not carried by any unit."},{"card":"","q":"What happens when two things that strike first clash at the same time?","a":"If multiple units in the same fight have an ability that allows them to strike first, they strike at the same time. Then any surviving units without that ability make their strikes."},{"card":"Riddle Sphinx","q":"Can I draw a site with this effect?","a":"Try this riddle: Which spell will I draw? Fooled you! Neither of them! (Yes, you can draw a site.)"},{"card":"Rift Valley","q":"Can you 'pull apart' a row with a single site?","a":"No. That's not what 'pull apart' means."},{"card":"","q":"What is a technical definition of what's happening when you use this card's ability?","a":"Choose a row or column with two adjacent sites and at least one void. Then, 'pull apart' the two adjacent sites as follows: one site stays in its current square, and the other site (along with all other contiguous sites in its row or column) shifts one square. Put Rift Valley in the void that was just created. The shifting of sites and the arrival of Rift Valley happen simultaneously."},{"card":"","q":"Can you play Rift Valley into an area affected by Atlantean Fate?","a":"Yes, since Atlantean Fate only affects the site once it's already in play, and Rift Valley modifies how it's played in the first place."},{"card":"","q":"How do Smokestacks of Gnaak and Rift Valley interact?","a":"Rift Valley enters the realm using its ability, and only loses its ability once it's in the realm (which by then, it doesn't really matter)."},{"card":"","q":"When pulling apart the row or column to place the site, can Rift Valley be played non-adjacent to your other sites?","a":"Yes."},{"card":"","q":"Does this move oversized units or auras that occupy more than one square?","a":"No."},{"card":"","q":"What happens if I try to use Rift Valley's ability when it's played via Pathfinder?","a":"When using the Pathfinder's ability, you reveal the site, then play it in an adjacent Rubble or void (then Pathfinder moves there). With Rift Valley, you could use its ability to make a void adjacent to Pathfinder, then play it there (and Pathfinder would then move there)."},{"card":"","q":"Can Mirror Realm copy Rift Valley and enter the realm in the special way, as long as it ends up nearby the Rift Valley that it's copying?","a":"Yes."},{"card":"","q":"If I have no sites but it's not the first turn (e.g. Roots of Yggdrasil destroyed everything) and I play Rift Valley, am I forced to play the site under my avatar, or could I pull apart a row of Rubble and play it there?","a":"Since it's not the first turn of the game, you aren't forced to play under yourself. Rift Valley offers an alternate way to play a site, and thus you could pull apart a row and play it there if you wanted."},{"card":"Ring of Morrigan","q":"If the damage from this trigger is prevented or redirected, do I still gain 1 life?","a":"No, you must deal at least 1 point of damage with the ability to gain any life."},{"card":"Riptide","q":"Can riptide pull a voidwalk minion in the void?","a":"No, because minions in the void aren't 'aboveground.'"},{"card":"","q":"What are the details of pulling an oversized minion that occupies the water site and other locations?","a":"When pulling or pushing a oversized unit, choose a single location the oversized unit occupies (and meets the requirement of the effect - e.g. adjacent), and push/pull from there."},{"card":"River of Blood","q":"If there are two Rivers of Blood in play, do they stack?","a":"Yes. Half the healing (rounding down), then half the healing again (round down). So [[Divine Healing]] would heal 1 with two Rivers of Blood in play."},{"card":"River of Flame","q":"If River of Flame casts a spell, choosing the surface, but there are Maddening Bells underground, is the River of Flame affected?","a":"Yes! Those bells are so loud (and still nearby the caster)."},{"card":"","q":"If River of Flame casts a spell, must you pick a region that it's casting from?","a":"Yes. Pick surface or underground when you cast the spell (or underwater if it's flooded)."},{"card":"River Rapids","q":"What is a 'connected river'?","a":"Connected rivers are a contiguous group of adjacent sites with River in their name, regardless of who controls them, and which contains River Rapids. River Rapids is, by definition, connected to itself, even if it is not connected to any other Rivers."},{"card":"","q":"How does this ability work?","a":"It is an activated ability that you can choose to activate one time on your turn. You choose a minion that is on a connected river, and push it one step. You can use this to push the minion off of rivers, and you can activate it even if River Rapids is the only 'connected' river."},{"card":"","q":"Can this ability push minions which are submerged at connected Rivers?","a":"Yes, submerged minions can be pushed."},{"card":"Roaming Monster","q":"The term 'summon' means 'enter the realm.' So, does that mean I can play this minion for free?","a":"No. This effect simply provides additional locations where you may summon this minion."},{"card":"Rolling Boulder","q":"What happens if Magellan Globe is in play and I push it along a complete row or column?","a":"The Rolling Boulder continues until it would repeat a step (i.e. back to where it started), and then stops instead of repeating a step. It doesn't do 8 damage on the starting location, since a location is either along its path or not."},{"card":"","q":"If there are two units on a site and one of them uses the boulder, does the other one get damaged?","a":"Yes. It's dangerous to play with boulders."},{"card":"","q":"What path does the boulder take?","a":"It travels in a chosen cardinal direction, staying within the same region."},{"card":"Roots of Yggdrasil","q":"What happens to destroyed Rubble?","a":"Nothing (it turns into more Rubble, and thus doesn't change)."},{"card":"Rowdy Boys","q":"When exactly is 'after striking' ?","a":"After effects concurrent with striking (e.g. after gaining life via Daperyll Vampire), but before any Deathrite abilities resolve. It's in the same moment that Stealth would break due to striking."},{"card":"Ruby Core","q":"When does this artifact provide mana?","a":"When it enters the realm, and at the start of its controller's turn."},{"card":"Ruler of Thul","q":"If Polar Explorers or Ruler of Thul are in play and an oversized unit on the top row moves 'up' one row to wrap around to the bottom, what happens?","a":"This ability only allows movement across the borders, not ongoing occupation. Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied."},{"card":"Saint of Redemption","q":"Does 'no minion is Evil' mean they are no longer considered a Demon, Monster or Undead?","a":"Minions will still keep their Demon, Monster and Undead types! They simply are no longer Evil, and will not be affected by things which specifically affect Evil."},{"card":"","q":"If Persecutor brands a minion, are they still considered evil by that player's cards while the Saint of Redemption is in play?","a":"No, the Saint redeems all minions, and even the Persecutor's brand will not condemn a redeemed soul!"},{"card":"","q":"Do all minions enter the realm tapped, or only minions which would have been Evil?","a":"All minion enter the realm tapped."},{"card":"","q":"Does this mean that minions which are not in the realm are not Evil as well?","a":"No minion anywhere is Evil as long as the Saint is in play.  This means that if a player casts [[Black Mass]], they will not be able to reveal any minions, as none of them can be Evil."},{"card":"Scatter","q":"Can I push an oversized unit?","a":"Yes, choose a cardinal direction and push the oversized unit one step in that direction as long as no part of the unit would change regions."},{"card":"","q":"Does the site itself get pushed?","a":"No."},{"card":"","q":"Can I choose different directions for each card being pushed?","a":"Yes."},{"card":"","q":"Can I push something into another region?","a":"No, this is forced movement, which cannot cause things to change regions unless specified."},{"card":"Scent Hounds","q":"What does it mean to 'permanently lose stealth'?","a":"Simply remove the stealth token. It does not prevent the minion from gaining stealth later."},{"card":"Scorched Earth","q":"A minion with Gilded Aegis is on a site chosen for Scorched Earth. The Aegis and the minion are being destroyed simultaneously. Does the Aegis have a chance to save the minion before it's destroyed?","a":"Yes."},{"card":"","q":"If I target Bedrock with Scorched Earth, the Bedrock obviously isn't destroyed, but is everything else still destroyed?","a":"Yes. (Remember Avatars cannot be destroyed.)"},{"card":"","q":"Can I choose zero sites?","a":"Yes. 'Any number' includes zero."},{"card":"Scourge Zombies","q":"If Scourge Zombies and an allied mortal die at the same time (e.g. Minor Explosion), does the Zombie's ability bring it back immediately?","a":"No, since the Scourge Zombies must be in the cemetery for their ability to trigger when the mortal dies."},{"card":"Screamer","q":"Who decides where the minion steps?","a":"The controller of Screamer."},{"card":"","q":"Is this forced movement?","a":"No, the enemy is taking their own step which can benefit from movement abilities such as Voidwalk or Airborne."},{"card":"Sea Raider","q":"If Sea Raider attacks a 3 power minion, killing it but also dying in the process, does the Raider have time to use their ability before they die?","a":"Yes. After units are killed, there is time for effects to resolve (e.g. Deathrite) before minions are placed in cemeteries. This effect resolves in the same window of time as deathrites."},{"card":"","q":"If I declare an attack against one target, but then a different enemy defends, does that satisfy this ability?","a":"Yes. An attack was made, and then a minion was killed. As long as your attacking unit used the Move and Attack ability and then got kill credit, this ability is satisfied."},{"card":"Searing Truth","q":"Does this actually target the Avatar?","a":"Yes. If your opponent casts this and targets your Warded avatar, you will not draw any cards and the Ward will break. Normal targeting rules apply (e.g. a spellcaster in the void or subsurface couldn't target an avatar with this magic, since they aren't in the same region)."},{"card":"","q":"How does this interact with damage prevention effects?","a":"Damage prevention effects on the avatar will still apply to the damage from Searing Truth."},{"card":"","q":"What do X cost spells count as for this effect?","a":"Unless resolving on the storyline, X cost spells are treated as costing zero."},{"card":"Seasoned Sellsword","q":"If my avatar is nearby Seasoned Sellsword, can I discard a card for her ability even if I already control her?","a":"Yes!"},{"card":"Seirawan Hydra","q":"How can I kill a Hydra?","a":"Deal 1 lethal damage, or 6 damage all at once. Multiple sources of simultaneous damage will work. For example, if the Hydra attacks and two [[Bosk Troll]]s defend, the Hydra will be killed. Note that damage done one at a time, e.g. [[Arcane Barrage]], would not kill it, since each individual 1 damage would be immediately healed."},{"card":"Selfsame Simulacrum","q":"If it tries to become a basic copy of an aura animated by Enchantress, what happens?","a":"Selfsame Simulacrum becomes an aura (not a minion), since that's the actual text on the animated aura. As soon as Selfsame Simulacrum is an aura, it expands to its proper size based on card text (and default aura rules), and must continue to occupy the location that was specified during casting."},{"card":"","q":"Can it enter the realm Submerged if it copies a Submerged minion (or Voidwalk, or Burrowing)?","a":"No. When you cast a minion spell, you specify where the minion will enter the realm at time of casting. When the minion actually enters the realm (i.e. it's summoned), that's when Selfsame Simulacrum's copy ability applies. Without Submerge / Burrowing / Voidwalk when it's cast, Selfsame Simulacrum can't use those abilities to change where it's summoned."},{"card":"","q":"Does it copy Genesis abilities?","a":"Yes."},{"card":"","q":"What if it loses its abilities (e.g. Silence aura)?","a":"Selfsame Simulacrum remains a copy, but any abilities that were printed on the original copy are now ignored."},{"card":"Sentinel Trap","q":"How is the facing for the Trap determined?","a":"When you conjure the Sentinel Trap into the realm, choose a cardinal direction to be its initial facing. It then rotates from there. If it is teleported, the controller of the teleport effect can choose which cardinal direction it ends up facing."},{"card":"","q":"What happens if the Trap is animated?","a":"The direction it is facing is tracked normally, and is not affected by the Trap's movement or actions."},{"card":"Shackled Demon","q":"Does the Spellcaster have to be a unit to tap and release the Demon?","a":"Yes.  Only units can tap, so a spellcaster artifact or site would be unable to release the demon."},{"card":"Shield Maidens","q":"My Shield Maidens attack, and then 3 Foot Soldiers defend. How much damage do my Shield Maidens take?","a":"0, because each source of damage is reduced by 1!"},{"card":"Shrike Orchard","q":"Can this target sub-surface minions?","a":"Yes.  The minion must be nearby to the site, which means it must be near one of the site's locations.  This means that minions which are underground (or underwater, if the Shrike Orchard is flooded) can be targeted by this effect."},{"card":"Siege Ballista","q":"Do both units need to have been in play for a turn or have charge?","a":"Yes. Summoning sick units can't be tapped to pay costs."},{"card":"Silence","q":"What happens if a Mountain Giant occupies a Silence aura?","a":"A card's size is generally set when it enters the realm, and is considered one of its characteristics, not an ability. It will not resize."},{"card":"","q":"What happens if a Silence aura is animated by Enchantress?","a":"It still silences other minions but it also silences itself."},{"card":"Silver Bullet","q":"Can the bearer cast the spell, even if they're not a spellcaster?","a":"Yes!"},{"card":"Sinister Pond","q":"How do I calculate the difference in cost of the two minions?","a":"Start with the cost of the Evil minion in your hand, then subtract the cost of the Mortal at the Pond. Remember that costs cannot be negative, so if the result is below zero, treat it as zero instead."},{"card":"","q":"Can I transform a Mortal I do not control into Evil from my hand?","a":"Yes, though since it is a transform effect, control of the transformed minion will not change. The player who controlled the Mortal will control the Evil that came from your hand."},{"card":"","q":"Can my opponent use this effect as well?","a":"Yes!"},{"card":"Sir Morien","q":"Can enemy projectiles be shot from Morien's location?","a":"No, Morien cuts them down immediately, like the total badass he is."},{"card":"Sir Tom Thumb","q":"If my opponent's beast snatches Tom up, do they now take control of him?","a":"How dare you!? Sir Tom Thumb is no mere trinket. He's a fully autonomous being and acknowledges no other controller!"},{"card":"Skeleton Mage","q":"If Deathspeaker uses his ability to cast Skeleton Mage, does the Skeleton Mage get to use its genesis ability (casting and resolving a spell) before being banished?","a":"Yes!"},{"card":"Skirmishers of Mu","q":"How does this ability work?","a":"After declaring their movement path but before actually moving, Skirmishers may shoot. (The game will lookahead to see if your declared path will actually result in movement, ignoring all triggered abilities but considering all ongoing effects.) Alternately, Skirmishers may shoot when they enter a new location during basic movement. They get one shot total during their basic movement, regardless of how far they move. Note that basic movement includes movement from a basic ability, i.e. Move and Attack, and Defend."},{"card":"Slimy Mutants","q":"Is this an activated ability that I use while Slimy Mutants are in my hand?","a":"Yes! While Slimy Mutants are in your hand, you may pay (3) and resolve the effect."},{"card":"Slumbering Giantess","q":"If attacked by a minion that strikes first, does the Giantess end up striking back?","a":"Yes, assuming she isn't killed."},{"card":"Smokestacks of Gnaak","q":"What happens if there are two Smokestacks of Gnaak nearby each other?","a":"See '((Example - Two Smokestacks of Gnaak))' in the codex!"},{"card":"","q":"How do Smokestacks of Gnaak and Mirror Realm interact?","a":"By the time Mirror ))Realm(( enters the realm, it's already a copy. Thus, it can copy a nearby site, and then promptly loses all abilities of that copied site (but still is the copy, without abilities). See '((Apply Ongoing Effects In Order))' in the codex for nitty-gritty details."},{"card":"","q":"How do Smokestacks of Gnaak and Rift Valley interact?","a":"Rift Valley enters the realm using its ability, and only loses its ability once it's in the realm (which by then, it doesn't really matter)."},{"card":"Snowball","q":"Are minions along the path affected even if they have stealth?","a":"Yes! Projectiles do not hit stealth minions, but Snowball is just using the projectile to draw a path. It doesn't matter what units are hit, all of them along the path are rolled up in the snowball and pulled along!"},{"card":"","q":"Does the snowball's path include both the starting and ending locations?","a":"Yes! The projectile's path determines which locations are affected by the rest of the snowball, gathering up everything along the way, just as you'd expect giant snowball physics would work after watching all those Saturday morning cartoons."},{"card":"Sow the Earth","q":"If I happen to play a Lone Tower from the top of my atlas, will the mana from the Genesis ability also be doubled? What about mana from Abundance?","a":"Yes. Any mana that the site produces, including via any abilities, will be doubled."},{"card":"Sparkmage","q":"Can any of my spellcasters cast a spell and still benefit from my avatar's ability?","a":"Yes! As long as you control the spellcaster, the game sees it as a spell '((you))' cast, meaning the player."},{"card":"","q":"Is the damage considered air damage?","a":"Yes."},{"card":"","q":"If I give my Sparkmage a poisonous dagger, will it deal lethal damage with its tap ability?","a":"Yes, because it's dealing the damage directly via it's ability. (Damage from a lightning bolt cast by the Sparkmage would not be lethal.)"},{"card":"","q":"If I reduce the threshold required to cast the spell (e.g. Mix Aer), does the threshold still count for the Sparkmage ability?","a":"Yes. The Sparkmage ability considers printed threshold on the spell."},{"card":"Spear of Destiny","q":"What if the minion being killed occupies more than one location?","a":"You choose where the spear teleports, which will be a single location the minion occupies."},{"card":"Sphere of Animosity","q":"What does 'Avatars here can't leave' mean?","a":"Avatars currently under the Sphere of Animosity can't enter locations not occupied by the Sphere. This means they can't move to those locations, or be moved by force. Note that when a site moves, it carries along cards of normal size with it, and those cards do not count as entering a new location. This means that a moving site can carry an Avatar out of the Sphere."},{"card":"Spin Attack","q":"Does this card count as an 'attack' since it has the word 'attack' in its name?","a":"Sorry for the confusion, but no, this is not actually an attack! You only get an 'attack' from the Move and Attack basic ability, or card text that specifically uses the word attack (e.g. Crave Golem). This card text uses the word 'strike,' which means the unit simply deals damage equal to its power (and there's no chance for the opponent to Defend, and you can strike Stealthed or Airborne units, etc.)"},{"card":"Spire Lich","q":"Does Spire satisfy the Spire Lich?","a":"Yes, because of the golden rule. Be cool!"},{"card":"","q":"Does Watchtower satisfy the Spire Lich?","a":"Yes, because of the golden rule. Be cool!"},{"card":"Spore Spouts","q":"When is the power of the minion checked to see if it's small enough to summon to any site?","a":"You check at the time of casting, before the minion enters the realm. This means that you can summon a Vengeful Heir to any site, even if it enters the realm as a minion which would be too large to work with Spore Sprouts normally, for example."},{"card":"Squirming Mass","q":"Let's say the Mass is 1 power, and it fights another 1 power minion. What happens?","a":"Both take 1 damage each, which results in their simultaneous death. That triggers Squirming Mass's ability, which means its gains +1 power, but it's already dying, and merely gaining power isn't enough to save it. (Something specifically that saves a unit from death would be necessary, like Gilded Aegis.) In this example, both minions are placed in the cemetery."},{"card":"","q":"If a minion's current power is different from its printed power when it dies, which value does Squirming Mass gain?","a":"The current power of the minion that dies."},{"card":"Stagecoach","q":"Can this Pick Up and carry enemy minions?","a":"Yes, the coach will carry anyone!"},{"card":"Stitched Abomination","q":"How does this ability work?","a":"The Abomination takes damage as if it is one unit, but the player causing the damage can choose which part or parts of the Abomination it applies to (after damage reduction, if any). Once a part has enough damage assigned to kill it, it's removed. When the last part of the Abomination is destroyed, so is the Abomination. For example, I have an Abomination with 5 + 4 + 3 power, and you are dealing it 7 damage from a Major Explosion. You can assign 3 and 4 damage, destroying those parts, and it's left with 5 power. Alternately, if it were my own Major Explosion, I could assign 3 damage to the 5-power part, and 3 damage to the 4-power part, and 1 damage to 3-power part. It's left with 5+4+3 power, with some damage on each of those parts (which will be removed normally at end of turn).  If an effect would destroy or kill the Abomination outright, including taking Lethal damage, all of its parts are killed. If an effect would banish the Abomination, all of it is banished."},{"card":"Sturmgeist","q":"When does this ability resolve?","a":"Whenever an enemy announces a Magic spell, after they've paid the costs but before the spell resolves."},{"card":"","q":"What does 'closer' mean?","a":"Determine which location it could step to using its normal movement that would be closest to the caster that triggered it. For instance, assume the Sturmgeist is at location S, and the spellcaster is at location C:  Because the Sturmgeist has the airborne ability, it is able to get from S to C in one step, so it must do so, leaving it zero steps away from the caster.  It cannot move to A or B, because those locations are still one step away from the caster, which is further than zero steps."},{"card":"","q":"If the spellcaster dies before the spell they cast resolves, will their spell still resolve?","a":"No! If the spellcaster is dead before their spell resolves, the spell will not resolve at all. See '((Source is No Longer in the Realm))' for more details."},{"card":"","q":"What if the Magic is cast by something other than a unit?","a":"The Sturmgeist only hears spells cast by enemies, which are units. Spells cast by artifacts (e.g. Omphalos) or sites (e.g. River of Flame) will not trigger its ability."},{"card":"Summoning Sphere","q":"Does this allow me to summon my units burrowed even without burrowing?","a":"No. The effect only allows you to break the restriction of choosing one of your own sites, but not the rule about summoning atop the site."},{"card":"","q":"The term 'summon' means 'enter the realm.' So, does that mean I can play minions here for free?","a":"No. This effect simply provides additional locations where you may summon your minions."},{"card":"Sunken Treasure","q":"Do I get the cards immediately when my minion carrying the treasure moves to the surface, even in the middle of something else (like defending or attacking) ?","a":"Yes! As soon as your unit is on the surface, you resolve the treasure effect."},{"card":"Swap","q":"If one target is a minion, can the other target be an artifact, and vice versa?","a":"Yes. Target one (minion or artifact) and target another (minion or artifact)."},{"card":"","q":"How exactly do I resolve a 'swap' effect?","a":"The two cards are simultaneously teleported to each other's location. If one of the targets cannot be targeted or teleported (e.g. Iron Man Talus), neither target moves."},{"card":"","q":"Can this effect swap cards into different regions?","a":"No. You target both cards being swapped, and targets must be in the same region as the caster. See ((Casting Spells)) for more information."},{"card":"","q":"What if one or both of the swapped cards were being carried?","a":"If either card was being carried by a unit, that unit will be carrying the newly swapped artifact/minion, due to the golden rule. For example, if two carried artifacts are swapped, the bearers will be carrying their newly swapped artifacts (even if they both are in the same location). If a minion is swapped with an artifact, presumably the minion will be immediately dropped (unless the new bearer can carry minions) and the artifact will not be carried (unless the swapped minion was being carried before it was swapped)."},{"card":"","q":"What if an oversized unit is involved?","a":"Choose one of the locations the oversized unit occupies as the destination of the other card. See '((Teleporting Oversized Units))' for more details."},{"card":"Symmetric Suffering","q":"How do I resolve this effect if I sacrifice a card that has multiple types (e.g. Automaton) ?","a":"When you sacrifice a card that has multiple types, you may specify which type your opponent must match. For example, if you sacrifice one automaton (Minion and Artifact), you can force your opponent to sacrifice a minion or an artifact, your choice (not both). Similarly, if you're playing as Enchantress and you sacrifice an animated aura (Minion and Aura), you can force your opponent to sacrifice a minion or an aura, your choice (not both)."},{"card":"Tactical Move","q":"What is the timing for the resolution of this spell?","a":"Choose an ally, declare its movement steps, placing them on the Storyline, then resolve those steps. Repeat for each ally. That is, you declare and resolve each ally's steps before proceeding to the next ally. If you gain more allies during the resolution, you may move them too; keep repeating the effect until each ally has moved."},{"card":"Templar","q":"Can any of my spellcasters cast a spell and still benefit from my avatar's ability?","a":"Yes! As long as you control the spellcaster, the game sees it as a spell '((you))' cast, meaning the player."},{"card":"Thankless Squire","q":"Once the Thankless Squire has delivered all those lances, and isn't carrying any more, is it still Immobile?","a":"Yes, he's very tired and in need of a rest."},{"card":"The Apex of Babel","q":"What does it mean to 'build The Tower of Babel' and 'play ... atop this' ?","a":"You may play The Apex of Babel onto the same square as The Base of Babel! (If you have multiple copes of The Base of Babel in the realm, choose one.) If you do, they merge into a single site called The Tower of Babel. When you build it by playing the Apex, resolve the effect on The Apex of Babel. The Tower of Babel is considered a single site that provides (2) mana and (A)(E), and is both Unique and Exceptional. (The turn you play it, you gain (1) more mana since the Base was already in play.) If it's destroyed, both The Apex of Babel and The Base of Babel go to your cemetery. If it's copied, e.g. Mirror Realm, the copy will provide (2) mana, etc., but you won't get the build bonus again. For all purposes, The Tower of Babel is considered a single site."},{"card":"The Base of Babel","q":"What does it mean to 'build The Tower of Babel' and 'play ... atop this' ?","a":"You may play The Apex of Babel onto the same square as The Base of Babel! (If you have multiple copes of The Base of Babel in the realm, choose one.) If you do, they merge into a single site called The Tower of Babel. When you build it by playing the Apex, resolve the effect on The Apex of Babel. The Tower of Babel is considered a single site that provides (2) mana and (A)(E), and is both Unique and Exceptional. (The turn you play it, you gain (1) more mana since the Base was already in play.) If it's destroyed, both The Apex of Babel and The Base of Babel go to your cemetery. If it's copied, e.g. Mirror Realm, the copy will provide (2) mana, etc., but you won't get the build bonus again. For all purposes, The Tower of Babel is considered a single site."},{"card":"The Colour Out of Space","q":"If it's not adjacent to void and is within Abundance, does it still gain extra mana?","a":"Yes. The site doesn't provide mana normally, but if it's modified in some way (e.g. Abundance), then it can provide additional mana. 0 + 1 = 1."},{"card":"","q":"If it's not adjacent to void and is the target of a flood, does it still gain water affinity?","a":"Yes. The site doesn't provide affinity normally, but if it's modified in some way (e.g. Flood), then it will."},{"card":"The Doom of Dilmun","q":"Can this minion die?","a":"The only way it can be killed is if you sacrifice it. Otherwise, it cannot be killed. Meet your doom!"},{"card":"The Flood","q":"If Draconian Bonekite, Sir Pelleas, and Azuridge Caravan are all in the realm, can I choose to keep the Caravan and another minion?","a":"No, you cannot save Azuridge Caravan and other minions. Since Azuridge Caravan counts as all minion types, you cannot save it and any other minion with a type since they will always have a shared type."},{"card":"","q":"If there are minions with multiple types in the realm, can I choose what type they count as when resolving The Flood? (e.g. I control Draconian Bonekite and Wyvern.","a":"They are both of their minion types at all times. Though each minion has another minion type in addition to Dragon in their type line, you can only choose one! You can only save one Dragon from the flood!"},{"card":"","q":"Who chooses what minions of each type are saved from The Flood?","a":"The controller of the spell."},{"card":"","q":"Can I choose to save a minion that has no minion type e.g. Maiden, Mother, Crone?","a":"No, since Maiden, Mother, Crone has no type it cannot be saved from being submerged."},{"card":"The Geistwood","q":"If multiple minions including Miracle Workers die at the same time on Geistwood, can Miracle Workers return themselves and/or another minion that's dying to your hand?","a":"No, because Miracle Workers only return minions from the cemetery, and deathrites resolve while the minions are still in the realm. The Miracle Workers could return other minions that died earlier that turn and were in the cemetery."},{"card":"","q":"If The Geistwood site itself and minions occupying the site are all destroyed at the same time, do the minions' genesis abilities still count as Deathrite abilities, or can the active player decide to destroy Geistwood before the deathrites resolve?","a":"Since the destruction is simultaneous (e.g. Roots of Ygdrassil), all Deathrites will resolve before cards are moved to the cemetery."},{"card":"The Hexham Haunts","q":"How does summoning burrowed interact with Evil Presence?","a":"You may summon the Haunts to an affected site, and they must be burrowed. But the Haunts won't gain Charge and Evil Presence will remain in the realm because the Haunts were not summoned 'here' according to Evil Presence, since Evil Presence occupies the surface (and perhaps the void), not underground."},{"card":"The Immortal Throne","q":"What does 'alone here' mean?","a":"No other units at the location."},{"card":"","q":"What counts as 'playing' a card?","a":"Playing a site, which costs 0, or casting a spell."},{"card":"","q":"If I modify the cost of a spell (e.g. a Mix artifact, or an alternate casting cost), does The Immortal Throne look at the modified cost or the printed cost?","a":"Cost in this case means 'printed cost.'"},{"card":"","q":"The alpha foil version has the text for Pendulum of Peril on it. Is that a misprint?","a":"Yes. Use the text for the normal version. The foil version is not legal for tournament ))play((."},{"card":"The Inquisition","q":"When does this ability trigger?","a":"If an effect requires you to reveal it from your hand, or from your spellbook, or if your opponent searches your spellbook."},{"card":"The Malleus Maleficarum","q":"Can the bearer cast the spell, even if they're not a spellcaster?","a":"Yes!"},{"card":"The Manor at Daperyll Hill","q":"If the 3 damage is reduced, redirected away from 'here', or prevented, do I still heal 3?","a":"No, the full 3 damage must be dealt to the targeted minion here in order to heal 3."},{"card":"The Rack","q":"Stretch my avatar? You're pulling my leg! Does this make my avatar an oversized unit now?","a":"Pulling both arms and both legs actually but, yes! Your avatar will now be an oversized unit!"},{"card":"","q":"If Magellan Globe leaves play when a card is spanning the edge of the realm, what happens?","a":"Units cannot balance on the edge of the realm and an oversized unit that finds its way there falls to one side or the other. Its controller places it in the closest legal position, controller's choice if tied. If there's no legal position anywhere in the realm for a minion, it dies. If there's no legal position anywhere in the realm for an avatar, shrink it until there is a legal position (Avatar controller's choice), and place it there."},{"card":"The Void","q":"How does this site work?","a":"The site still has both a surface and subsurface, but those locations also count as void simultaneously. It has a surface + void location, and a subsurface + void location. Minions without voidwalk that enter the site will immediately be banished. Spells cast from the surface + void location can target cards that are in the surface or the void, for example. Projectiles can travel from the surface + void location into the void."},{"card":"","q":"Can my avatar enter this site?","a":"Yes."},{"card":"","q":"Can forced movement move a minion from a surface location to the surface of The Void?","a":"Yes!"},{"card":"","q":"When my opponent casts a minion spell with Voidwalk, can they choose The Void as its summoning location, even though it's my site?","a":"Yes! It is a void, so they can choose to cast their Voidwalk minions to here if they wish."},{"card":"","q":"While my Avatar occupies the surface + void location of The Void site, can I target something occupying the underground + void location of The Void site?","a":"Yes! The target is in the same region (void) as the spellcaster, so it can be targeted!"},{"card":"","q":"Normally, when moving from void to a site, a minion (e.g. Hounds of Ondaros) can move directly to the surface OR subsurface. Therefore, when moving from the subsurface + void location of this site, can a minion like Hounds of Ondaros move directly to the surface of an adjacent site? Could they move from the surface + void location directly to the subsurface of an adjacent site?","a":"Yes! Minions with voidwalk can continue to use their voidwalk abilities to move accordingly."},{"card":"Thing in the Ice","q":"What does 'can't be targeted or damaged by magic' mean?","a":"Magic can't target the card and the card can't be damaged by Magic (even without targeting). The card can still be targeted by non-Magic effects."},{"card":"Thunderstorm","q":"The alpha and beta text is different, which should I use?","a":"The beta text is correct."},{"card":"Tide Naiads","q":"Can Tide Naiads move from an underwater location to an underground location?","a":"No. They would need to enter the underground location to flood it, and they cannot enter underground locations without burrowing."},{"card":"Toolbox","q":"Can the bearer cast the spell, even if they're not a spellcaster?","a":"Yes!"},{"card":"Torrid Omphalos","q":"Must spells cast by the Omphalos match its elements?","a":"Yes. Any spell the Omphalos casts much match at least one of its elements."},{"card":"Torshammar Trinket","q":"How does this work with end of turn and damage clearing?","a":"The intent is that a 1 power minion with 1 damage + the Trinket would survive the turn."},{"card":"Trade Encampment","q":"Do I have to reveal the traded artifacts?","a":"Yes, you must reveal them to ensure it is a fair trade."},{"card":"Tringh Constrictor","q":"The alpha and beta text is different, which should I use?","a":"The beta text is correct."},{"card":"Troll Bridge","q":"What is a 'lone enemy'?","a":"A 'lone enemy' is an enemy unit that's not entering simultaneously with another enemy unit. Stationary units at the Troll Bridge ignored. Here are some examples: If an enemy [[War Horse]] is carrying its Avatar and moves to your Troll Bridge, it will not trigger, since there are two enemies entering simultaneously.  If your [[Bodach Bogeyman]] is carrying two enemy minions and moves to your Troll Bridge, it will not trigger. However, if the Bogeyman were carrying just one enemy, the Bridge would trigger. If there is already an enemy occupying the Troll Bridge and another enemy unit enters, it will trigger for the entering enemy."},{"card":"Truesight Crossbow","q":"Can the bearer shoot or defend against a stealthed enemy?","a":"Yes. The bearer can target stealthed minions with spells, shoot them with projectiles, attack or intercept them and even defend against their attacks."},{"card":"Tufted Turtles","q":"My Tufted Turtles attack (having taken no damage so far this turn), and then 3 Foot Soldiers defend. How much damage do my Tufted Turtles take?","a":"0, because all three Foot Soldiers did damage at the same time, tied for first, and thus all are prevented!"},{"card":"Twist of Fate","q":"Does this count as healing?","a":"No, this is setting life."},{"card":"","q":"What happens if I cast this when I'm at death's door?","a":"You can cast it, and your opponent will go to 0 life, being put at Death's Door and becoming immune to damage for the rest of the turn. You will still remain at 0 life since you can't gain life once you're at death's door."},{"card":"","q":"For purposes of cards that care about the mana cost of spells, what is the mana cost of a spell with X?","a":"If you cast the spell, the mana cost is X. For example, if you cast it for 2 mana, then Immortal Throne would see it as a 2 cost spell. But, if you aren't casting the spell and it's simply in your hand, spellbook, etc., then X is 0 until you actually cast it."},{"card":"Ultimate Horror","q":"The alpha foil version has 3 air threshold and the normal version has 2 air threshold. Which is correct?","a":"The normal version is correct. You only need 2 air affinity to cast this minion."},{"card":"","q":"When Ultimate Horror summons dead voidwalk minions, can they go to different nearby sites and voids?","a":"Yes!"},{"card":"Undertaker Engine","q":"Can it burrow and unburrow different things the same turn?","a":"Yes."},{"card":"Undertow","q":"Does Undertow let you pull a unit underwater if they have submerge?","a":"No, because it's a 'normal step,' which doesn't allow changing regions."},{"card":"Unland Angler","q":"What are the details of pulling an oversized minion that occupies the water site and other locations?","a":"When pulling or pushing a oversized unit, choose a single location the oversized unit occupies (and meets the requirement of the effect - e.g. adjacent), and push/pull from there."},{"card":"Unland Eel","q":"When it submerges, can it pull down a minion anywhere in the realm, or only from its location?","a":"No. Unland Eel can only drag a minion that shares its location."},{"card":"Vanguard Knights","q":"If I have two Vanguard Knights equally forward, do they cancel each other out?","a":"Yes. They only get the benefit if they are the true vanguard, with a single minion being the farthest forward."},{"card":"","q":"How do I know if they're the 'farthest forward?'","a":"The row of squares closest to you is 1, then the next row is 2, then 3, then 4. The higher the number, the farther forward it is."},{"card":"Varmint Warrens","q":"Does this prevent enemy magic from harming my beasts?","a":"Yes, as long as the effect says 'target'. You'll need to bring in a specialized exterminator to flush out these hidey-holes."},{"card":"","q":"What counts as an 'enemy' for this effect? Is it enemies of the beast, or enemies of the site?","a":"Beasts at Varmint Warrens cannot be targeted by spells or abilities used by the enemies of the beast. All kinds of critters can hide in the warrens!"},{"card":"Vatn Draconis","q":"If I choose to submerge minions and artifacts here, do I submerge Vatn Draconis too?","a":"Yes, it will submerge itself. You cannot choose to submerge only some of the minions and artifacts."},{"card":"Vaults of Zul","q":"If I play this under my avatar, have I stopped there?","a":"No, because a unit doesn't enter the site if the unit was already present in the square when the site was played."},{"card":"","q":"What does 'stops here' mean?","a":"An avatar stops when there is no additional movement for that unit on the Storyline. A unit must first move to then stop."},{"card":"","q":"Does Vaults of Zul trigger once per game, or once per game per avatar?","a":"Once per game total. They took time to loot the vaults! (If two avatars somehow stop on the vaults simultaneously, they will both be tied for first, and will both loot the vaults.)"},{"card":"","q":"What happens if my turn is skipped via Vaults of Zul and Courtesan Thaïs is affecting me?","a":"If a turn is skipped then there's no actual turn, which means that part of Courtesan Thaïs's effect would wait for that player's next actual turn."},{"card":"Vesper Swarm","q":"What does it mean to 'fly to' something? Does it have to be the shortest possible path or any valid path?","a":"Refer to the article on ((Moving to a Specific Location Via a Special Ability or Magic)) to see how an ability like this works."},{"card":"Vindictive Nation","q":"When moving sites around, does Vindictive Nation protect the nearby sites before or after the move?","a":"Vindictive Nation protects the sites it was nearby before the move. For example:  I = Vindictive Nation R = Rubble A = Allied Site My opponent casts Earthquake and rearranges the two rightmost sites:  Even though site A moved and is now nearby Vindictive Nation, my opponent doesn't lose any life because A wasn't nearby Vindictive Nation before the move. Alternately, if we started from the second situation and Earthquake moved sites into the first situation, my opponent would lose 3 life because they moved a site that was nearby Vindictive Nation (even though the site ended up no longer nearby)."},{"card":"","q":"If my Vindictive Nation is silenced by my opponent, e.g. Smokestacks of Gnaak, will my opponent lose life?","a":"No, because Smokestacks silences them first. Vindictive Nation's ability is effectively a triggered ability, while Smokestacks are a passive ability that generates an ongoing effect. Ongoing effects are applied before triggered abilities can trigger."},{"card":"","q":"Does this effect have time to resolve if the site itself is getting destroyed?","a":"Yes! They are very vindictive."},{"card":"","q":"Does 'modifying' a site include Flooding it?","a":"Yes, since Flooded is an ability that gets added to the site."},{"card":"Vivien the Enchantress","q":"What does 'wherever she is' mean?","a":"Anywhere! The realm, your hand, and cemetery, and even while in the middle of your spellbook."},{"card":"","q":"Since Avatars are Spellcasters, is Vivien a Spellcaster?","a":"Not by default. Avatars don't have the printed ability 'Spellcaster,' so Vivien must gain the Spellcaster ability another way, e.g. a minion with the printed Spellcaster ability."},{"card":"","q":"Can Vivien the Enchantress copy the abilities of another Vivien the Enchantress?","a":"No."},{"card":"","q":"What happens if Vivien uses the Druid's ability to summon Bruin and flip?","a":"She summons Bruin and then flips. As a flipped card with nothing on the back, she has no game text and will effectively do nothing for the rest of the game. She is no longer a minion, has no card type or abilities, etc. The flipped card can exist in the void, and technically she could turn off Pristine Paradise, and would be destroyed by Roots of Yggdrasil."},{"card":"Wall of Air","q":"Does this affect subsurface units?","a":"No. (They are not atop the site.)"},{"card":"","q":"What if this is animated by an Enchantress?","a":"An animated Wall of Air can't move (unless it gains power), since it has a Wall of Air in its middle! If it gains power (or teleports) and manages to move, the Wall of Air applies between the two squares it occupies."},{"card":"","q":"Does this affect the corners of the border? (e.g. Airborne units moving diagonally)","a":"No. 'Border' means adjacent squares, not including diagonals."},{"card":"","q":"How many squares does this aura occupy?","a":"2"},{"card":"Wall of Fire","q":"How many squares does this aura occupy?","a":"2"},{"card":"","q":"What does 'passes through' mean?","a":"Moving through in any way, whether willingly or by force. For example, a unit moved by Grapple Shot or Pudge Butcher would take damage from the Wall of Fire. Note that a teleported unit doesn't pass through borders, and thus wouldn't be affected."},{"card":"","q":"Does this affect Airborne units?","a":"Yes. (They are atop the site.)"},{"card":"","q":"Does this affect the corners of the border? (e.g. Airborne units moving diagonally)","a":"No. 'Border' means adjacent squares, not including diagonals."},{"card":"","q":"What if this is animated by an Enchantress?","a":"It can move, but units are not passing through the Wall of Flame due to its own movement. After moving, its effect will apply between the two squares it occupies."},{"card":"","q":"Does this affect subsurface units?","a":"No. (They are not atop the site.)"},{"card":"Wall of Ice","q":"How many squares does this aura occupy?","a":"2"},{"card":"","q":"What if this is animated by an Enchantress?","a":"An animated Wall of Ice can't move normally, since it has a Wall of Ice in its middle! If it gains Airborne (or teleports, etc.) and manages to move, the Wall of Ice applies between the two squares it occupies."},{"card":"Warp Spasm","q":"When is the power doubled?","a":"This effect applies a doubling throughout the turn. If the unit gains or loses power, apply any additions or subtractions first, then double."},{"card":"Watchtower","q":"What does it mean to 'permanently lose stealth'?","a":"Simply remove the stealth token. It does not prevent the minion from gaining stealth later."},{"card":"Watery Grave","q":"What does 'drowns' mean?","a":"A minion 'drowns' if it dies due to being underwater without also having the submerge ability. You control the resulting Skeleton."},{"card":"Wave of Eviction","q":"How do I properly resolve this effect?","a":"Choose a cardinal direction from your water site. Forcefully move all enemies from your water site one step in the chosen direction and flood that site. Trigger and resolve any effects related to minions entering or the site being flooded. Then repeat the process until you reach the edge of the realm. The flood and push effect will continue even across a void, but minions cannot be forcefully moved across regions. Each site will be flooded at the same moment as the minions arrive, so a submerged minion being evicted will also be submerged on the new site (and there will never be a moment where it's pushed onto the new site without the new site also being flooded)."},{"card":"Waveshaper","q":"When exactly does the previous site stop being flooded when I use this ability for the second time?","a":"The newly flooded site becomes flooded at the same moment the previously flooded site stops being flooded. If you choose the same site, there is no moment when the site isn't flood."},{"card":"","q":"If the site doesn't get flooded (e.g. Bedrock), do the minions without submerge still tap?","a":"Yes! Imagine a big wave washing over the Bedrock, knocking everyone over, and then the water dissipates due to Bedrock."},{"card":"","q":"What does 'your body of water' mean?","a":"The body of water (if any) that your Avatar currently occupies. If the Avatar isn't in any body of water, the ability won't function. (They're a fish out of water!)"},{"card":"","q":"Can I choose the same site over and over?","a":"Yes, as long as it's nearby your body of water."},{"card":"Whirling Blades","q":"Does the path include the starting and ending locations?","a":"Yes."},{"card":"","q":"Can a unit with move-related abilities (e.g. Airborne) 'take steps' using its ability?","a":"Yes."},{"card":"","q":"Do I fully resolve my movement first, then strike each enemy simultaneously?","a":"Yes."},{"card":"","q":"If I choose to move 0 steps (perhaps because my unit is Immobile), do I strike anything?","a":"No, because you don't have any path if you don't move. A path involves 1 or more steps, and each step has a starting and ending location that's different (if your step is from a location to the same location, you didn't actually move anywhere.)"},{"card":"","q":"Can I choose to move a step forward and then back to strike an enemy twice with this?","a":"No. You can choose to step forward and back, but an enemy is either along your path or not. They will not be struck more than once."},{"card":"White Hart","q":"Can the White Hart's location be attacked?","a":"No, the White Hart's ability means that minions and locations which are nearby to the Hart, but are not the Hart, cannot be attacked. Everyone must focus on taking down the White Hart!"},{"card":"Wildfire","q":"Does 'visited before' apply to other Wildfires I cast in the same game?","a":"Once it leaves play, a Wildfire forgets all the places it visited. If you have multiple Wildfires in play, track them each separately."},{"card":"Wills-o'-the-Wisp","q":"If Wills-o'-the-Wisps are attacked and then use their ability to evade the attack, what happens?","a":"Attack triggers are still satisfied (e.g. Captain Baldassare), but the attack otherwise ends (assuming there aren't any units left to fight). The attacker will not strike, and the target of the attack will not revert to the original target (if any)."},{"card":"","q":"If Wills-o'-the-Wisps are attacked by a oversized minion, and then Wills-o'-the-Wisps teleport to a nearby location that the oversized minion still occupies, does the attack continue?","a":"Yes. To actually evade the attack, they must teleport to a location that the attacker doesn't occupy."},{"card":"Windblast","q":"Does the movement get resolved simultaneously?","a":"Yes, all the steps are simultaneously resolved (which might then provoke a variety of triggers)."},{"card":"","q":"Can I push something into the void?","a":"No. Since this is forced movement (and not normal unit movement), 'one step' means a single adjacent location. (And 'adjacent location' means an adjacent square in the same region.)"},{"card":"","q":"Per card text, artifacts that are carried get pushed as well. So, do held artifacts get blown away from the units carrying them?","a":"Since all of the movement is simultaneous the artifact always shares a location with the unit, so it was never dropped and continues to be carried."},{"card":"Witherwing Hero","q":"If a weaker ally is attacked and you return them to your hand via this ability, what happens?","a":"Attack triggers are still satisfied (e.g. Captain Baldassare), but the attack otherwise ends, assuming there aren't any units left to fight. The attacker will not strike."},{"card":"Yog-Sothoth","q":"What does 'Occupies all locations safely' mean?","a":"Yog Sothoth occupies all locations simultaneously, in all regions. That includes all surface locations, subsurface locations and voids. Yog Sothoth does not die due to being burrowed or submerged and is not banished due to being in the void."},{"card":"","q":"What happens if there's a silence or disable effect somewhere in the realm that affects minions (e.g. Root Spider, Silence aura)?","a":"Yog-Sothoth will be disabled or silenced by the effect, but will continue to occupy all locations since its size is a characteristic. This usually means Yog-Sothoth will be banished, since it can no longer safely occupy void locations!"},{"card":"Zephyranne Airship","q":"What happens when a minion carries another minion that's carrying a minion?","a":"Only the minions you're directly carrying count against your limit. Have fun at the carnival!"}];
const CODEX_DATA=[{"k":"Ability","def":"All cards in the game have abilities! There are two categories of abilities: Basic abilities, which \nall units have without being printed on their cards. Special abilities, which is the card text on \neach card, or text granted to it by other effects, e.g. [[Black Obelisk]]. Cards also have \ncharacteristics, which are distinct from abilities."},{"k":"Activated Ability","def":"An activated ability has a cost (such as tapping or paying mana) and an effect.  For example, \n[[Field Laborers]] have an activated ability. If you pay the cost, the effect occurs. If you can pay \nthe cost multiple times, you may do so (and the effect will occur each time you pay the cost). \nActivated abilities may only be used On your turn, during your main phase, and when no events are \npending on the storyline. Note that it's also possible for an activated ability to have no cost, in \nwhich case it will likely have some other limit, such as once on your turn. For example, [[Queen \nGuinevere]] has an activated ability with no cost, but is limited to once on your turn. Track your \nuse of such abilities during your turn to ensure the game state remains clear to both players. By \ndefault, only the controller of a card can use its activated abilities."},{"k":"","def":"","sub":"Activating Abilities:  To activate an ability, ensure that: You control the card with the ability \nIt's your turn It's your main phase No events are on the storyline You can pay the cost Once you pay \nthe cost and declare targets (if any), the effect of the activated ability goes on the storyline and \nthen will resolve normally."},{"k":"Active Player","def":"The active player is the player who is currently taking their turn."},{"k":"Adjacent","def":"Adjacent refers to the current square and the four orthogonal squares that share a border with it \n(not diagonals). For example, the middle square has 5 adjacent squares - itself and four others.  If \na square is in the corner of the realm, it will have fewer adjacent squares. For example, the bottom \nright square has only 3 adjacent squares - itself and two others.  When referring to adjacent sites, \nadjacent voids, or adjacent squares, the effect can cross the boundaries of regions. For example, \n[[Lord of the Void]] can be in the void and still banish an adjacent site, even though sites and \nvoids are in different regions. [[Frontier Settlers]] can be on a site and still play your top site \nto an adjacent void, even though sites and voids are in different regions. For all other references \nto adjacent, such as adjacent locations, adjacent minions, adjacent artifact, etc., regional \nboundaries must be respected and cannot be crossed. For example, if a minion with Voidwalk was \nattacked while at a site and then played [[Dodge Roll]], it could not move to a void square because \n'adjacent location' cannot cross a regional boundary."},{"k":"Air Site","def":"An air site is a site that provides at least one air (A) affinity. If the site provides other types \nof affinity as well, it's still an air site as long as it provides at least one air affinity."},{"k":"Airborne","def":"Keyword ability. A unit with Airborne may fly while on the surface. It gains three benefits while on \nthe surface: When taking a step, it may move diagonally. It cannot be targeted by attacks, unless \nthe attacking unit also has Airborne. It cannot be intercepted, unless the intercepting unit has \nAirborne or Ranged. Important reminders: Attacks from Airborne units can be defended normally! \nAirborne is mostly a defensive ability and gives greater mobility, but Airborne attacks (against a \nunit or a site) can be defended by any unit, even without Airborne! The Airborne unit must swoop \ndown to attack. Even if an Airborne attacker targets an Airborne defender, a non-Airborne unit may \ndefend, since the original target can bring the fight down to the ground. Airborne only works on the \nsurface. If the unit starts its step on the surface of a site, it can step diagonally. If the unit \nstarts its step in a different region (void, underwater, underground), then it can't step diagonally \n(and also doesn't get the other benefits either). Airborne has no effect on counting distance for \neffects with 'up to X steps away,' e.g. [[Disenchant]]."},{"k":"Ally","def":"An ally is a unit that you control, including your Avatar. Allies are always units, unless otherwise \nspecified by card text. For example, [[Cast into Exile]] uses 'allied site,' which means 'a site you \ncontrol.' [[Holy Nova]] uses 'allied Ward,' which means 'a Ward on card you control.'"},{"k":"Animate","def":"Animate means to give a card the minion type. It becomes a minion for the duration of the effect, in \naddition to its other types. For example, [[Enchantress]]."},{"k":"Artifact","def":"Artifacts are various relics, edifices, tools, gear, gadgets, devices, and baubles, often charged \nwith lasting enchantments by wizards of old. [[Spear of Destiny]] is an example of an artifact. \nArtifacts have an artifact frame on their card, and typically do not require threshold. For example, \n[[Philosopher's Stone]] or [[Sword and Shield]]. Artifact subtypes include Armor, Device, Document, \nInstrument, Potion, Relic, and Weapon, which have no special game rules, though other cards may \nreference them. There are two special artifact subtypes, Automaton and Monument, which have special \nrules, described below. Artifacts have characteristics, specifically ((artifact characteristics)), \nand are one of the six card types in the game. By default, any non-Monument, non-Automaton artifact \ncan be carried by a unit. If such an artifact is not carried, then it is not controlled by anyone. \nIf such an artifact is carried, then it's controlled by the bearer's controller. The '((Casting \nArtifacts))' entry has details on how to cast artifact spells."},{"k":"","def":"","sub":"Automaton:  Automatons are artifacts that are minions. See 'Cards With Multiple Types' in the \n'characteristics' entry for more details. [[Crave Golem]] is an example of an automaton."},{"k":"","def":"","sub":"Monument:  Monuments are an artifact subtype that cannot be carried. [[The Immortal Throne]] is an \nexample of a monument."},{"k":"As If Adjacent","def":"Some effects allow movement 'as if adjacent' e.g. [[Minecart Madness]]. If it matters, the \ncontroller of the movement effect decides the cardinal direction when a unit is moving 'as if \nadjacent.' For example, if you have a [[Waypoint Portal]] active and you want to move your \n[[East-West Dragon]] through it, you can choose to consider the movement horizontal and Move Freely, \neven if the two squares are not the same row. Similarly, a [[Dalcean Phalanx]] could step through a \nWaypoint Portal to a square in a different column by declaring the proper cardinal direction for the \n'as if adjacent' movement. Units moving 'as if adjacent' do not cross any borders. Therefore, a \n[[Waypoint Portal]] would allow you to circumvent a [[Wall of Ice]] or [[Great Wall]], which look \nfor crossing borders."},{"k":"As If Connected","def":"Some effects allow movement 'as if the top and bottom edges of the realm were connected' e.g. \n[[Polar Explorers]]. To resolve these effects, imagine a duplicate copy of the realm ))above(( the \ntop row, and ))below(( the bottom row. That is, those squares are considered adjacent for movement. \nImportantly, the squares are not actually connected for other effects, so something like [[Poison \nNova]] on the top row wouldn't hit the bottom row, since Poison Nova isn't movement. Moving 'as if \nconnected' does cross borders normally, and uses normal cardinal directions. Oversized units that \nmove as if connected and then find themselves spanning the realm will immediately end up on one side \nor the other. See '((Oversized Units))' for more details. Most forced movement effects require \nproximity and thus won't work across the top and bottom edge when moving 'as if connected.' For \nexample, [[Whirlwind]] could theoretically push across the top or bottom edge because a 'push' \ncounts as movement, but you won't be able to select a 2x2 area that spans the top and bottom edges, \nbecause those rows are not actually connected; [[Polar Explorers]] merely allow movement 'as if' \nconnected, not 'selecting 2x2 areas as if connected.' (In contrast, if [[Magellan Globe]] were in \nthe realm, then you really could select 2 squares in the top row and 2 squares in the bottom row, \nbecause Magellan Globe actually connects the edges, for all purposes.) An example of a forced \nmovement effect that would work is [[Maelström]]:  [[Maelström]] is at M, and [[Polar Bears]] are at \nP. The whole area is a giant body of water. You could pull normally to X, or could pull 'as if \nconnected' to M since pulling is a form of movement."},{"k":"At Rest","def":"The default state of a unit is at rest, but it stops being at rest when: It enters the realm, OR It \nmoves or is moved, OR It casts a spell, OR It activates an activated ability or triggers a triggered \nability. It returns to being 'at rest' after passive effects have been applied and the Storyline is \nempty. Here are some clarifying examples: If a [[Hillock Basilisk]] moves and attacks, the minions \nin the attacked location will be disabled before they have a chance to use their Defend triggered \nability, because passive abilities apply before triggered abilities. But, a defending minion moving \nin from 1 step sideways will NOT be at rest because once that defending minion uses its triggered \nability, it's no longer at rest. It won't return to being at rest until the whole attack sequence \nfinishes. Also, it's doubly not at rest because it moved! Units being carried by other units will \nnot be at rest while being moved. Units being forcefully moved by an effect like [[Grapple Shot]] or \n[[Windblast]] will not be at rest, since they're being moved."},{"k":"Atlas","def":"Your atlas is your deck of sites and is one of the zones in the game. Only sites can be placed or \nshuffled into your atlas. If an effect would cause a spell card to be shuffled into an atlas, that \neffect is ignored. Constructed Format\nYour atlas must contain 30 or more sites and respect rarity limits. Limited Formats (Draft or \nSealed)\nYour atlas must contain 12 or more sites, ignoring rarity restrictions."},{"k":"Atop","def":"On the surface of a site (not void). Synonymous with 'above a site' and 'aboveground.' This includes \nAirborne minions, as well as all types of sites, including water sites. Note: [[The Base of Babel]] \nuses the word 'atop' in a different way. See the FAQ for that card for clarity."},{"k":"Attack","def":"Attacking is one of the main ways you deal damage to your opponent's units and sites, and is a core \npart of Sorcery. Units attack as part of the Move and Attack basic ability. Certain rare effects may \nalso explicitly allow attacks, e.g. [[Crave Golem]]. You may only attack enemy units or the surface \nof enemy sites that are at your location. When you attack, follow this sequence: Declare the attack \ntarget and check that it's a legal target right now. If not, end this process and no attack \nhappened. Assuming the attack target is legal, 'attack' triggers are now satisfied and the defender \nhas been targeted and attacked (e.g. [[Captain Baldassare]], [[Sir Kay]], [[Dodge Roll]], \n[[Wills-o'-the-Wisp]]). Resolve those, using the storyline rules as usual for ((simultaneous \ntriggers)). Open the defend window. One unit may use the Defend ability, resolving its movement, if \nany. If it now occupies the attack's location, it joins the attack as a defender. If the original \ntarget was a site, it's removed from the attack. If the original target was a unit, it may remain in \nthe fight or not, as the defending player chooses. Note that the defender is not 'attacked' nor \n'targeted.' The opportunity to use 'attack' triggers (e.g. [[Dodge Roll]], [[Wills-o'-the-Wisp]], \netc.) has already passed. Repeat 3.a and 3.b as many times as defending player wants, one defender \nat a time. Defend window is closed. Check for attack target legality again. Units that used the \nDefend ability are automatically legal targets (e.g. a Stealth minion chooses to defend, a unit on \n[[Dome of Osiros]] chooses to defend, etc.) Resolve the fight. If there are no other units involved \nsince you're attacking an undefended site, simply strike the site, damaging it and causing the \ncontrolling avatar to lose that amount of life. The attack is over. Any 'after attack' triggers \nresolve now."},{"k":"Aura","def":"Auras are mostly incorporeal but lasting manifestations of elemental power.  They usually affect a \n2x2 area and can be cast anywhere in the realm. [[Entangle Terrain]] is an example of an aura. Auras \nhave characteristics, specifically ((aura characteristics)), and are one of the six card types in \nthe game. The '((Casting Auras))' entry has details on how to cast aura spells."},{"k":"","def":"","sub":"Moving Auras:  Some effects can move an aura by force (e.g. [[Windblast]]) and some auras can move \nthemselves (e.g. [[Thunderstorm]]). Auras ignore the regional boundary between the surface and void \nwhen moving. ([[Wildfire]]'s 'adjacent locations' are still defined by its current region.) For \nexample, a [[Thunderstorm]] moves itself with its end-of-turn ability. It can take a step into the \nvoid with this movement, though not to the subsurface. Additionally, an aura being moved by force \n(e.g. [[Displace]] or [[Windblast]]) can be moved from surface locations to void locations, and visa \nversa. This only applies to non-minion auras. See 'Cards with Multiple Types' for details on Aura \nMinions."},{"k":"Aura minion","def":"An aura minion is a card that is both an aura and a minion! See 'Cards with Multiple Types' for \ndetails."},{"k":"Avatar","def":"Your Avatar represents you and your connection to the realm. Every deck must contain exactly 1 \nAvatar. Choose wisely! [[Sparkmage]] is an example of an avatar. Avatars have characteristics, \nspecifically ((avatar characteristics)), and are one of the six card types in the game. Avatars are \nimmune to many negative effects, as described in their characteristics."},{"k":"Banished","def":"When you banish a card, it is removed from the game; place in a separate area, clearly distinct from \nany game zone. Once a card is banished, it can never return to the game."},{"k":"Basic Ability","def":"All units in Sorcery have five abilities that are not printed on their cards. These are called basic \nabilities, and are described in their own codex entries: Move and Attack Defend Intercept Pick Up \nDrop"},{"k":"Basic Movement","def":"Basic movement is movement from any basic ability, i.e. Move and Attack, or Defend."},{"k":"Bearer","def":"A unit holding a carriable artifact is its 'bearer.' Some artifacts grant abilities to their bearer, \ne.g. [[Sword and Shield]]. If an artifact is also a minion (e.g. [[Clay Golem]]), it does not have a \nbearer even if it's being carried (e.g. [[War Horse]])."},{"k":"Below","def":"At the subsurface of a site (not void)."},{"k":"Body of Water","def":"A body of water is a contiguous group of adjacent water sites, regardless of who controls those \nsites. If a card refers to 'its body of water' or 'this body of water' (e.g. [[Anui Undine]] or \n[[Giant Shark]]), it means the body of water occupied by that card. If that card doesn't currently \noccupy a body of water, then it doesn't have a body of water. To choose a body of water (e.g. \n[[Marine Voyage]]), choose one water site. Every water site (regardless of controller) that's \nconnected to the chosen site via adjacent water sites is in that body of water. If a site becomes \ndisconnected from the chosen water site (e.g. [[Earthquake]] in the middle of the turn), the \ndisconnected site is no longer in the body of water. If the chosen site is no longer a water site \n(e.g. [[Drought]] in the middle of the turn), then the 'chosen body of water' no longer exists."},{"k":"Border","def":"A square's border means other adjacent squares and doesn't include diagonals. The border is the edge \nof the square, not including the corners. For example, [[Border Militia]] checks for adjacent enemy \nsites, not diagonals."},{"k":"Bottom","def":"'Bottom' can have two different meanings in Sorcery, depending on context. When referring to your \ndeck, bottom or bottommost simply means the bottom card of the deck. For example, [[Autumn River]]. \nWhen referring to the realm, bottom means the row closest to you. For example, [[Polar Explorers]]."},{"k":"Break Stealth","def":"'Break ))Stealth((' as a cost for an activated ability, e.g. [[Asmodeus]] or [[Frozen Horror]], \nmeans that the minion must have Stealth and voluntarily lose it as the cost of the activated \nability.  The ability is not activated if the minion loses Stealth for any other reason, such as \ninteracting with the realm or being silenced."},{"k":"Broken Artifact","def":"A broken artifact is an artifact that's in a cemetery."},{"k":"Bruin","def":"Bruin is a token minion with 4 power. Bruin is a Unique Beast with 'While near your Avatar, Bruin \ntakes damage for them.' Bruin is an ((earth)) minion. See [[Druid]]."},{"k":"Burrowed Safely","def":"Burrowed safely means that the minion has burrowing and can't move itself, while at this location. \nTypically an effect will cause the minion to unburrow, for example [[Awakened Mummies]]."},{"k":"Burrowing","def":"Keyword Ability. A minion with Burrowing can be summoned to underground locations and survive \nunderground. By using one step, a minion with Burrowing can move between the surface and subsurface \nof a land site, or between adjacent underground locations. A minion with both the Burrowing and \nSubmerge abilities can move directly from an underground location to an underwater location in an \nadjacent square, and vice versa, in one step. For example, [[Cave Trolls]] can be summoned \nunderground to one of your land sites. Then, after their summoning sickness wore off, they could use \ntheir Move and Attack ability to take a step from underground to the surface of that site (and that \nwould use up their step). If they were on the surface of a land site, they could use their step to \nmove from the surface to underground of that site. To 'burrow' means to move from the surface to the \nunderground of a land site. When an effect 'burrows' a card, you forcefully move that card from the \nsurface to underground, even if it doesn't have the Burrowing ability. If an effect tries to \nforcefully burrow (e.g. [[Bury]]) a card that occupies at least one water site, the effect fails."},{"k":"Can vs. Can't","def":"If one or more effects say you 'can' do something and one or more effects say you 'can't' do that \nsame thing, the 'can't' effects always take precedence. For example, [[Queen Guinevere]] explicitly \nallows you to untap an allied minion, while [[Rhitta Gawr of Snowdonia]] prohibits other minions \nfrom untapping. If Queen Guinevere tries to untap any minion other than Rhitta, the effect will fail \nbecause the 'can't' effect from Rhitta takes precedence. Note that 'lose' effects (e.g. [[Sky \nBaron]]) also implicitly include a 'can't' effect. So if Sky Baron is in the realm and then you cast \n[[Power of Flight]], the 'can't' effect takes precedence and the minion doesn't gain Airborne."},{"k":"Can't Drop","def":"If an artifact ))can't(( be dropped, it may not be chosen for the '((Drop))' basic ability. Also, \nany effect that specifies 'drop,' will not affect that artifact, e.g. [[Shameless Squire]] or \n[[Attack by Night]]."},{"k":"Can't be Modified","def":"A card that 'can't be modified' cannot be disabled, silenced, immobilized, or transformed. It also \ncannot gain or lose any abilities, and its characteristics cann
